<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>充电动 — EV 充电</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');

:root {
  --bg: #0a0e17;
  --surface: #111827;
  --surface-2: #1a2438;
  --fg: #e8ecf4;
  --fg-muted: #64748b;
  --neon: #06f7c1;
  --neon-dim: #06f7c115;
  --magenta: #f4069a;
  --border: #1e293b;
  --font: 'Space Grotesk', system-ui, sans-serif;
  --radius: 0.75rem;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font); background:var(--bg); color:var(--fg); display:flex; justify-content:center; min-height:100vh; }

.phone { max-width:393px; width:100%; min-height:100vh; background:var(--bg); position:relative; }

.status { display:flex; justify-content:space-between; padding:0.5rem 1.5rem; font-size:0.7rem; color:var(--fg-muted); }

header { padding:0.5rem 1.5rem; display:flex; align-items:center; justify-content:space-between; }
header h1 { font-weight:700; font-size:1.5rem; letter-spacing:-0.02em; }
header h1 .cyber { color:var(--neon); text-shadow:0 0 20px var(--neon); }
header h1 .pink { color:var(--magenta); }

.search-wrap { margin:0.5rem 1.5rem; position:relative; }
.search-wrap input { width:100%; padding:0.75rem 1rem 0.75rem 2.75rem; border-radius:0.5rem; border:1px solid var(--border); background:var(--surface); color:var(--fg); font-size:0.85rem; outline:none; }
.search-wrap input:focus { border-color:var(--neon); box-shadow:0 0 15px var(--neon-dim); }
.search-wrap svg { position:absolute; left:1rem; top:50%; transform:translateY(-50%); width:1rem; height:1rem; stroke:var(--fg-muted); }

.scan-cta { margin:0.75rem 1.5rem; background:linear-gradient(135deg,var(--neon),var(--magenta)); border:none; border-radius:var(--radius); padding:1rem; display:flex; align-items:center; justify-content:center; gap:0.75rem; color:var(--bg); font-weight:700; font-size:1rem; letter-spacing:-0.01em; cursor:pointer; transition:all 0.3s; }
.scan-cta:hover { transform:scale(1.02); box-shadow:0 0 30px #06f7c180; }
.scan-cta svg { width:1.5rem; height:1.5rem; stroke:var(--bg); }

.list { padding:0 1.5rem 6rem; display:flex; flex-direction:column; gap:0.75rem; }
.item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; display:flex; gap:1rem; align-items:center; }
.item .power-icon { width:2.5rem; height:2.5rem; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.item .power-icon svg { width:1.25rem; height:1.25rem; stroke:var(--neon); }
.item .info { flex:1; }
.item .name { font-weight:600; font-size:0.9rem; color:#fff; display:flex; align-items:center; gap:0.4rem; }
.item .badge { font-size:0.55rem; padding:0.1rem 0.4rem; border-radius:0.25rem; text-transform:uppercase; font-weight:700; }
.badge-neon { background:var(--neon); color:var(--bg); }
.badge-pink { background:var(--magenta); color:#fff; }
.item .addr { font-size:0.75rem; color:var(--fg-muted); margin-top:0.15rem; }
.item .tags { display:flex; gap:0.5rem; margin-top:0.4rem; }
.item .tags span { font-size:0.65rem; color:var(--fg-muted); display:flex; align-items:center; gap:0.2rem; }
.item .right { text-align:right; }
.item .price { font-size:1.15rem; font-weight:700; color:var(--neon); }
.item .price small { font-size:0.6rem; color:var(--fg-muted); font-weight:400; }
.item .member { font-size:0.65rem; color:var(--magenta); }

.bottom { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:393px; background:var(--surface); border-top:1px solid var(--border); display:flex; padding:0.5rem 0 1rem; justify-content:space-around; }
.bottom .tab { display:flex; flex-direction:column; align-items:center; gap:0.15rem; color:var(--fg-muted); font-size:0.55rem; }
.bottom .tab svg { width:1.25rem; height:1.25rem; stroke:currentColor; }
.bottom .tab.active { color:var(--neon); }

@keyframes slideUp { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
.item { animation:slideUp 0.4s ease-out both; }
.item:nth-child(2){animation-delay:0.07s}
.item:nth-child(3){animation-delay:0.14s}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span>9:41</span><span><svg width="16" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="currentColor"/><rect x="2" y="2" width="18" height="8" rx="1" fill="currentColor" opacity="0.3"/></svg></span></div>

<header>
  <h1><span class="cyber">电动</span><span class="pink">充</span></h1>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--fg-muted)" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 4v16"/><path d="M15 4v16"/></svg>
</header>

<div class="search-wrap">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input type="text" placeholder="附近充电站" value="西湖区">
</div>

<button class="scan-cta">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
  扫码充电
</button>

<div class="list">
  <div class="item">
    <div class="power-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <div class="info">
      <div class="name">西溪湿地超充站 <span class="badge badge-neon">PLUS</span></div>
      <div class="addr">文二西路与紫金港路口 · 0.8km</div>
      <div class="tags"><span><span style="width:6px;height:6px;border-radius:50%;background:var(--neon);display:inline-block"></span> 4空闲</span><span>120kW</span></div>
    </div>
    <div class="right"><div class="price">1.28 <small>元</small></div><div class="member">会员 0.99</div></div>
  </div>
  <div class="item">
    <div class="power-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <div class="info">
      <div class="name">武林广场快充站</div>
      <div class="addr">延安路与体育场路口 · 1.2km</div>
      <div class="tags"><span><span style="width:6px;height:6px;border-radius:50%;background:var(--neon);display:inline-block"></span> 3空闲</span><span>60kW</span></div>
    </div>
    <div class="right"><div class="price">1.05 <small>元</small></div><div class="member">会员 0.85</div></div>
  </div>
  <div class="item">
    <div class="power-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <div class="info">
      <div class="name">杭州东站超充站 <span class="badge badge-pink">超充</span></div>
      <div class="addr">火车东站P4层B区 · 2.5km</div>
      <div class="tags"><span><span style="width:6px;height:6px;border-radius:50%;background:var(--neon);display:inline-block"></span> 6空闲</span><span>180kW</span></div>
    </div>
    <div class="right"><div class="price">1.68 <small>元</small></div><div class="member">超充专属</div></div>
  </div>
  <div class="item">
    <div class="power-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <div class="info">
      <div class="name">未来科技城充电站</div>
      <div class="addr">良睦路与文一路口 · 3.1km</div>
      <div class="tags"><span><span style="width:6px;height:6px;border-radius:50%;background:#ff4d4d;display:inline-block"></span> 0空闲</span><span>120kW</span></div>
    </div>
    <div class="right"><div class="price">1.18 <small>元</small></div><div class="member">会员 0.95</div></div>
  </div>
</div>

<div class="bottom">
  <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span>首页</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>优惠</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="6"/></svg><span>扫码</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>订单</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>我的</span></div>
</div>
</div>
</body>
</html>
