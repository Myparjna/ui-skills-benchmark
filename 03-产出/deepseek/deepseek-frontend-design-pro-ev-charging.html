<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>E-Charge 充电</title>
<style>
:root {
  --bg: #080c14;
  --surface: #0e1628;
  --surface-2: #162038;
  --fg: #e0eaf5;
  --fg-muted: #6a80a8;
  --neon: #00ff88;
  --neon-dim: #00ff8820;
  --neon-glow: #00ff8840;
  --accent-blue: #0066ff;
  --border: #1c2a48;
  --font: 'Inter', -apple-system, sans-serif;
  --radius: 1rem;
  --radius-lg: 1.5rem;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font); background:var(--bg); color:var(--fg); display:flex; justify-content:center; min-height:100vh; }
.phone { width:100%; max-width:393px; min-height:100vh; position:relative; background:var(--bg); overflow:hidden; }

.status-bar { display:flex; justify-content:space-between; padding:0.5rem 1.5rem; font-size:0.7rem; color:var(--fg-muted); }
.header { padding:0.5rem 1.5rem 0; display:flex; align-items:center; gap:1rem; }
.header .back { width:2.25rem; height:2.25rem; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; }
.header .back svg { width:1.25rem; height:1.25rem; stroke:var(--fg); }
.header h1 { font-size:1.4rem; font-weight:700; flex:1; }
.header h1 span { color:var(--neon); }

.search { margin:0.75rem 1.5rem; position:relative; }
.search input { width:100%; padding:0.75rem 1rem 0.75rem 2.75rem; border-radius:2rem; border:1px solid var(--border); background:var(--surface); color:var(--fg); font-size:0.85rem; outline:none; transition:all 0.3s; }
.search input:focus { border-color:var(--neon); box-shadow:0 0 20px var(--neon-dim); }
.search svg { position:absolute; left:1rem; top:50%; transform:translateY(-50%); width:1rem; height:1rem; stroke:var(--fg-muted); }
.search input::placeholder { color:var(--fg-muted); }

.map-area { height:220px; margin:0 1.5rem 1rem; border-radius:var(--radius-lg); background:linear-gradient(135deg,#0a1a30,#122240); position:relative; overflow:hidden; }
.map-area .grid { position:absolute; inset:0; background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px); background-size:25px 25px; opacity:0.2; }
.map-area .pin { position:absolute; width:12px; height:12px; border-radius:50%; }
.map-area .pin::before { content:''; position:absolute; top:-8px; left:-8px; width:28px; height:28px; border-radius:50%; opacity:0.25; }
.map-area .pin-active { background:var(--neon); box-shadow:0 0 15px var(--neon); }
.map-area .pin-active::before { background:var(--neon); }
.map-area .pin-idle { background:var(--fg-muted); }
.map-area .pin-super { background:#ff6b35; box-shadow:0 0 15px #ff6b3570; }
.map-area .pin-super::before { background:#ff6b35; }

.stations { padding:0 1.5rem 6rem; display:flex; flex-direction:column; gap:0.75rem; }
.station { background:linear-gradient(135deg,var(--surface),var(--surface-2)); border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; transition:all 0.3s; }
.station:active { transform:scale(0.98); }
.station .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.5rem; }
.station .name { font-weight:600; color:#fff; font-size:0.95rem; display:flex; align-items:center; gap:0.5rem; }
.station .badge { font-size:0.6rem; padding:0.15rem 0.45rem; border-radius:0.75rem; font-weight:500; }
.badge-plus { background:var(--neon-dim); color:var(--neon); }
.badge-super { background:#ff6b3520; color:#ff6b35; }
.station .addr { color:var(--fg-muted); font-size:0.78rem; margin-bottom:0.75rem; }
.station .detail { display:flex; justify-content:space-between; align-items:center; }
.station .tags { display:flex; gap:0.4rem; flex-wrap:wrap; }
.station .tags span { font-size:0.7rem; padding:0.15rem 0.5rem; border-radius:0.25rem; background:var(--surface); border:1px solid var(--border); color:var(--fg-muted); display:flex; align-items:center; gap:0.25rem; }
.station .tags span .dot { width:5px; height:5px; border-radius:50%; display:inline-block; }
.station .price { text-align:right; }
.station .price .num { font-size:1.25rem; font-weight:700; color:var(--neon); }
.station .price .meta { font-size:0.65rem; color:var(--fg-muted); }

.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:393px; background:var(--surface); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:0.5rem 0 1rem; }
.bottom-nav .tab { display:flex; flex-direction:column; align-items:center; gap:0.15rem; color:var(--fg-muted); font-size:0.6rem; }
.bottom-nav .tab svg { width:1.25rem; height:1.25rem; stroke:currentColor; }
.bottom-nav .tab.active { color:var(--neon); }
.bottom-nav .tab.qr { position:relative; }
.bottom-nav .tab.qr .qr-wrap { width:3.5rem; height:3.5rem; border-radius:50%; background:var(--neon); display:flex; align-items:center; justify-content:center; margin-top:-1rem; }
.bottom-nav .tab.qr .qr-wrap svg { stroke:var(--bg); }

@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.station { animation:fadeUp 0.5s ease-out both; }
.station:nth-child(2){animation-delay:0.08s}
.station:nth-child(3){animation-delay:0.15s}
.station:nth-child(4){animation-delay:0.22s}
</style>
</head>
<body>
<div class="phone">
<div class="status-bar"><span>9:41</span><span><svg width="16" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="currentColor"/><rect x="2" y="2" width="18" height="8" rx="1" fill="currentColor" opacity="0.3"/></svg></span></div>
<div class="header">

</div>
<div class="bottom-nav">
