<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoltGo — 充电</title>
<style>
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --surface-2: #1a2438;
  --fg: #e8ecf4;
  --fg-muted: #64748b;
  --accent: #06f7c1;
  --accent-bg: #06f7c115;
  --border: #1e293b;
  --font: 'Inter', system-ui, sans-serif;
  --r: 0.75rem;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font); background:var(--bg); color:var(--fg); display:flex; justify-content:center; }
.phone { max-width:393px; width:100%; min-height:100vh; }

.bar { display:flex; justify-content:space-between; padding:0.5rem 1.5rem; align-items:center; }
.bar h1 { font-size:1.35rem; font-weight:700; }
.bar h1 span { color:var(--accent); }

.search { margin:0.25rem 1.5rem; position:relative; }
.search input { width:100%; padding:0.7rem 1rem 0.7rem 2.75rem; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); color:var(--fg); font-size:0.85rem; outline:none; }
.search input:focus { border-color:var(--accent); }
.search svg { position:absolute; left:1rem; top:50%; transform:translateY(-50%); width:1rem; height:1rem; stroke:var(--fg-muted); }

.scan { display:flex; align-items:center; justify-content:center; gap:0.5rem; margin:0.5rem 1.5rem; padding:0.75rem; border:1px solid var(--accent); border-radius:var(--r); color:var(--accent); font-weight:500; cursor:pointer; background:var(--accent-bg); }
.scan svg { width:1.25rem; height:1.25rem; stroke:currentColor; }

.list { padding:0 1.5rem 6rem; display:flex; flex-direction:column; gap:0.5rem; }
.item { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:1rem; }
.item .flex { display:flex; justify-content:space-between; }
.item .name { font-weight:600; display:flex; align-items:center; gap:0.3rem; }
.item .badge { font-size:0.55rem; padding:0.15rem 0.4rem; border-radius:0.25rem; background:var(--accent-bg); color:var(--accent); }
.item .addr { font-size:0.75rem; color:var(--fg-muted); margin-top:0.15rem; }
.item .tags { display:flex; gap:0.4rem; margin-top:0.35rem; font-size:0.65rem; color:var(--fg-muted); }
.item .price { font-weight:700; color:var(--accent); }
.item .price small { font-weight:400; color:var(--fg-muted); }

.bottom-nav { position:fixed; bottom:0; max-width:393px; width:100%; left:50%; transform:translateX(-50%); background:var(--surface); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:0.4rem 0 0.75rem; }
.bottom-nav .tab { display:flex; flex-direction:column; align-items:center; gap:0.1rem; color:var(--fg-muted); font-size:0.5rem; }
.bottom-nav .tab svg { width:1.2rem; height:1.2rem; stroke:currentColor; }
.bottom-nav .tab.active { color:var(--accent); }
</style>
</head>
<body>
<div class="phone">
<div class="bar">
  <h1>Volt<span>Go</span></h1>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fg-muted)" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
</div>
<div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input type="text" placeholder="搜索充电站" value="西湖区">
</div>
<div class="scan">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
  扫码充电
</div>
<div class="list">
  <div class="item">
    <div class="flex">
      <div><div class="name">西溪湿地站 <span class="badge">PLUS</span></div><div class="addr">文二西路 · 0.8km</div><div class="tags"><span>4空闲</span><span>120kW</span></div></div>
      <div class="price">1.28<small>元</small></div>
    </div>
  </div>
  <div class="item">
    <div class="flex">
      <div><div class="name">武林广场站</div><div class="addr">延安路 · 1.2km</div><div class="tags"><span>3空闲</span><span>60kW</span></div></div>
      <div class="price">1.05<small>元</small></div>
    </div>
  </div>
  <div class="item">
    <div class="flex">
      <div><div class="name">杭州东站超充</div><div class="addr">火车东站 · 2.5km</div><div class="tags"><span>6空闲</span><span>180kW</span></div></div>
      <div class="price">1.68<small>元</small></div>
    </div>
  </div>
  <div class="item">
    <div class="flex">
      <div><div class="name">未来科技城</div><div class="addr">良睦路 · 3.1km</div><div class="tags"><span>0空闲</span><span>120kW</span></div></div>
      <div class="price">1.18<small>元</small></div>
    </div>
  </div>
</div>
<div class="bottom-nav">
  <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span>首页</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>优惠</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="6"/></svg><span>扫码</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>订单</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>我的</span></div>
</div>
</div>
</body>
</html>
