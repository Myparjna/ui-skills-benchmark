<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>充吧 — EV充电</title><style>:root{--primary:oklch(55% .2 165);--bg:#fff;--fg:#1a1a1a;--fg-muted:#5a5a5a;--border:#e5e5e5;--font:'Inter',system-ui,sans-serif;--r:.5rem}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:var(--font);background:var(--bg);color:var(--fg);display:flex;justify-content:center}.phone{max-width:393px;width:100%;min-height:100vh}
.bar{display:flex;justify-content:space-between;padding:.5rem 1rem;align-items:center}
.bar h1{font-weight:700;font-size:1.2rem;color:var(--primary)}
.search{margin:.25rem 1rem;position:relative}
.search input{width:100%;padding:.6rem 1rem .6rem 2.5rem;border:1px solid var(--border);border-radius:var(--r);font-size:.85rem;outline:none}
.search input:focus{border-color:var(--primary)}
.search svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;stroke:var(--fg-muted)}
.filters{display:flex;gap:.25rem;padding:0 1rem}
.filters button{padding:.35rem .7rem;border:1px solid var(--border);background:var(--bg);border-radius:var(--r);font-size:.75rem;white-space:nowrap}
.filters button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.scan{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:.5rem 1rem;padding:.7rem;border:1px solid var(--primary);border-radius:var(--r);color:var(--primary);font-weight:500;cursor:pointer}
.list{padding:0 1rem 6rem;display:flex;flex-direction:column;gap:.5rem}
.item{border:1px solid var(--border);border-radius:var(--r);padding:1rem}
.item .top{display:flex;justify-content:space-between}
.item .name{font-weight:600;font-size:.85rem}
.item .addr{font-size:.7rem;color:var(--fg-muted);margin-top:.1rem}
.item .tags{display:flex;gap:.4rem;margin-top:.3rem;font-size:.6rem;color:var(--fg-muted)}
.item .price{font-weight:700;color:var(--primary)}
.item .price small{font-weight:400;color:var(--fg-muted);font-size:.6rem}
.bottom{position:fixed;bottom:0;max-width:393px;width:100%;left:50%;transform:translateX(-50%);background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:.3rem 0 .6rem}
.bottom .tab{display:flex;flex-direction:column;align-items:center;gap:.1rem;color:var(--fg-muted);font-size:.5rem}
.bottom .tab svg{width:1.15rem;height:1.15rem;stroke:currentColor}
.bottom .tab.active{color:var(--primary)}
</style></head>
<body><div class="phone">
<div class="bar"><h1>充吧</h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fg-muted)" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></div>
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="搜索充电站" value="西湖区"></div>
<div class="filters"><button class="active">全部</button><button>快充</button><button>超充</button></div>
<div class="scan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>扫码充电</div>
<div class="list">
<div class="item"><div class="top"><div><div class="name">西溪湿地站</div><div class="addr">文二西路 · 0.8km</div><div class="tags"><span>4空闲</span><span>120kW</span></div></div><div class="price">1.28<small>元</small></div></div></div>
<div class="item"><div class="top"><div><div class="name">武林广场站</div><div class="addr">延安路 · 1.2km</div><div class="tags"><span>3空闲</span><span>60kW</span></div></div><div class="price">1.05<small>元</small></div></div></div>
<div class="item"><div class="top"><div><div class="name">杭州东站超充</div><div class="addr">火车东站 · 2.5km</div><div class="tags"><span>6空闲</span><span>180kW</span></div></div><div class="price">1.68<small>元</small></div></div></div>
</div>
<div class="bottom">
<div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span>首页</span></div>
<div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>优惠</span></div>
<div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="6"/></svg><span>扫码</span></div>
<div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>订单</span></div>
<div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>我的</span></div>
</div>
</div></body></html>
