<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理后台</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#1a1a1a;display:flex;min-height:100vh}
.sidebar{width:180px;background:#1e293b;color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .logo{padding:.75rem 1rem;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}

.content{padding:.75rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.75rem}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:.375rem;padding:.75rem}
.stat .lbl{font-size:.65rem;color:#64748b;text-transform:uppercase}
.stat .val{font-size:1.5rem;font-weight:700}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:.375rem;overflow:hidden;border:1px solid #e2e8f0}
th{text-align:left;padding:.4rem .6rem;font-size:.65rem;color:#64748b;border-bottom:1px solid #e2e8f0;background:#f8fafc}
td{padding:.4rem .6rem;font-size:.8rem;border-bottom:1px solid #e2e8f0}
</style></head>
