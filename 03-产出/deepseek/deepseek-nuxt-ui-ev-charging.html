<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>E-Charge</title>
<style>
:root {
  --bg: #ffffff;
  --foreground: #0a0a0a;
  --muted: #6b7280;
  --muted-foreground: #6b7280;
  --border: #e5e7eb;
  --primary: #0a0a0a;
  --primary-foreground: #fafafa;
  --accent: #f5f5f4;
  --radius: 0.5rem;
  --font: 'Inter', system-ui, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font); background:var(--bg); color:var(--foreground); display:flex; justify-content:center; }
.phone { max-width:393px; width:100%; min-height:100vh; }

.pad { padding:0.75rem 1rem; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
h1 { font-size:1.35rem; font-weight:700; }

.search { position:relative; margin:0.5rem 1rem; }
.search input { width:100%; padding:0.65rem 1rem 0.65rem 2.5rem; border:1px solid var(--border); border-radius:var(--radius); font-size:0.85rem; outline:none; }
.search input:focus { border-color:var(--foreground); }
.search svg { position:absolute; left:0.75rem; top:50%; transform:translateY(-50%); width:1rem; height:1rem; stroke:var(--muted); }

.tabs { display:flex; gap:0.25rem; padding:0 1rem; }
.tabs button { padding:0.35rem 0.75rem; border:1px solid var(--border); background:var(--bg); border-radius:var(--radius); font-size:0.78rem; cursor:pointer; color:var(--muted); }
.tabs button.active { background:var(--foreground); color:var(--primary-foreground); border-color:var(--foreground); }

.list { padding:0.75rem 1rem 6rem; display:flex; flex-direction:column; gap:0.5rem; }
.card { border:1px solid var(--border); border-radius:var(--radius); padding:1rem; display:flex; gap:1rem; }
.card .info { flex:1; }
.card .name { font-weight:600; font-size:0.9rem; display:flex; align-items:center; gap:0.4rem; }
.card .badge { font-size:0.6rem; padding:0.1rem 0.4rem; border-radius:0.25rem; background:var(--accent); color:var(--muted); }
.card .addr { font-size:0.75rem; color:var(--muted); margin-top:0.15rem; }
.card .tags { display:flex; gap:0.5rem; margin-top:0.4rem; }
.card .tags span { font-size:0.7rem; color:var(--muted); display:flex; align-items:center; gap:0.2rem; }
.card .price { text-align:right; }
.card .price .n { font-weight:700; }
.card .price .s { font-size:0.7rem; color:var(--muted); }

.bottom { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:393px; background:var(--bg); border-top:1px solid var(--border); display:flex; padding:0.4rem 0 0.75rem; justify-content:space-around; }
.bottom .tab { display:flex; flex-direction:column; align-items:center; gap:0.1rem; color:var(--muted); font-size:0.55rem; }
.bottom .tab svg { width:1.2rem; height:1.2rem; stroke:currentColor; }
.bottom .tab.active { color:var(--foreground); }

.scan-btn { display:flex; align-items:center; justify-content:center; gap:0.5rem; margin:0.5rem 1rem; padding:0.7rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--accent); cursor:pointer; font-weight:500; font-size:0.9rem; }
.scan-btn svg { width:1.25rem; height:1.25rem; }
</style>
</head>
<body>
<div class="phone">

<div class="pad flex-between">
  <h1>E-Charge</h1>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--foreground)" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
</div>

<div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input type="text" placeholder="搜索充电站" value="西湖区">
</div>

<div class="tabs">
  <button class="active">全部</button>
  <button>快充</button>
  <button>超充</button>
  <button>空闲</button>
</div>

<div class="scan-btn">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
  扫码充电
</div>

<div class="list">
  <div class="card">
    <div class="info">
      <div class="name">西溪湿地站 <span class="badge">PLUS</span></div>
      <div class="addr">文二西路 · 0.8km</div>
      <div class="tags"><span>4空闲</span><span>120kW</span></div>
    </div>
    <div class="price"><div class="n">1.28</div><div class="s">元/度</div></div>
  </div>
  <div class="card">
    <div class="info">
      <div class="name">武林广场站</div>
      <div class="addr">延安路 · 1.2km</div>
      <div class="tags"><span>3空闲</span><span>60kW</span></div>
    </div>
    <div class="price"><div class="n">1.05</div><div class="s">元/度</div></div>
  </div>
  <div class="card">
    <div class="info">
      <div class="name">杭州东站超充</div>
      <div class="addr">火车东站P4 · 2.5km</div>
      <div class="tags"><span>6空闲</span><span>180kW</span></div>
    </div>
    <div class="price"><div class="n">1.68</div><div class="s">元/度</div></div>
  </div>
  <div class="card">
    <div class="info">
      <div class="name">未来科技城</div>
      <div class="addr">良睦路 · 3.1km</div>
      <div class="tags"><span>0空闲</span><span>120kW</span></div>
    </div>
    <div class="price"><div class="n">1.18</div><div class="s">元/度</div></div>
  </div>
</div>

<div class="bottom">
  <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span>首页</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>优惠</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="6"/></svg><span>扫码</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>订单</span></div>
  <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>我的</span></div>
</div>

</div>
</body>
</html>
