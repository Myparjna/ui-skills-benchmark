<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fleet Ops</title><style>:root{--bg:#0d0d0d;--surface:#161616;--fg:#e0e0e0;--fg-muted:#777;--accent:#f59e0b;--border:#262626;--font:'Inter',system-ui,sans-serif;--r:.375rem}*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font);background:var(--bg);color:var(--fg);display:flex;min-height:100vh}
.sidebar{width:180px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar .logo{padding:.75rem 1rem;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border)}
.sidebar a{display:block;padding:.5rem 1rem;color:var(--fg-muted);text-decoration:none;font-size:.8rem}
.sidebar a:hover{color:var(--fg);background:var(--border)}
.sidebar a.active{color:var(--accent)}
.main{flex:1}
.topbar{display:flex;justify-content:space-between;padding:.5rem .75rem;border-bottom:1px solid var(--border);font-size:.8rem}
.content{padding:.75rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.75rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.75rem}
.stat .lbl{font-size:.6rem;color:var(--fg-muted);text-transform:uppercase}
.stat .val{font-size:1.35rem;font-weight:700}
.map{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem;overflow:hidden}
.map .h{padding:.5rem .75rem;border-bottom:1px solid var(--border);font-size:.8rem;font-weight:600}
.map .v{height:160px;background:var(--border)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.4rem .6rem;font-size:.6rem;color:var(--fg-muted);border-bottom:1px solid var(--border)}
td{padding:.4rem .6rem;font-size:.78rem;border-bottom:1px solid var(--border)}
.s{font-size:.55rem;padding:.1rem .3rem;border:1px solid;border-radius:2px}
.s-ok{border-color:#22c55e;color:#22c55e}
.s-warn{border-color:var(--accent);color:var(--accent)}
.wo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.4rem;margin-top:.5rem}
.wo>div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .75rem}
.wo .r{font-size:.55rem;color:var(--fg-muted)}
.wo .d{font-size:.78rem;margin:.1rem 0}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stat,.map,.wo>div{animation:f .4s ease-out both}
@media(max-width:768px){.sidebar{width:44px}.sidebar a span,.sidebar .logo span{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<aside class="sidebar"><div class="logo">F<span>leet</span></div><a href="#" class="active"><span>总览</span></a><a href="#"><span>车辆</span></a><a href="#"><span>电池</span></a><a href="#"><span>工单</span></a></aside>
<div class="main">
<div class="topbar"><span>总览</span><span style="color:var(--fg-muted);font-size:.7rem">杭州</span></div>
<div class="content">
<div class="stats"><div class="stat"><div class="lbl">在线</div><div class="val">2,847</div></div><div class="stat"><div class="lbl">骑行</div><div class="val">18,432</div></div><div class="stat"><div class="lbl">可用率</div><div class="val">94.7%</div></div><div class="stat"><div class="lbl">告警</div><div class="val">23</div></div></div>
<div class="map"><div class="h">实时分布</div><div class="v"></div></div>
<div class="map"><div class="h">车辆状态</div><table><thead><tr><th>编号</th><th>电量</th><th>状态</th><th>位置</th></tr></thead><tbody><tr><td style="font-family:monospace">HZ-00234</td><td>87%</td><td><span class="s s-ok">可用</span></td><td>西湖区</td></tr><tr><td style="font-family:monospace">HZ-00235</td><td>12%</td><td><span class="s s-warn">低电</span></td><td>武林广场</td></tr><tr><td style="font-family:monospace">HZ-00236</td><td>--</td><td><span class="s s-ok">可用</span></td><td>天目山路</td></tr><tr><td style="font-family:monospace">HZ-00237</td><td>45%</td><td><span class="s s-ok">充电中</span></td><td>余杭区</td></tr></tbody></table></div>
<div class="wo"><div><div class="r">WO-001</div><div class="d">换电</div><span style="color:#ef4444;font-size:.6rem">紧急</span></div><div><div class="r">WO-002</div><div class="d">检修</div><span style="font-size:.6rem;color:var(--fg-muted)">普通</span></div></div>
</div></div>
</body></html>
