<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营管理后台</title>
<style>
:root {
  --sidebar: #1e293b;
  --sidebar-fg: #cbd5e1;
  --primary: #2563eb;
  --bg: #f8fafc;
  --surface: #ffffff;
  --fg: #0f172a;
  --fg-muted: #64748b;
  --border: #e2e8f0;
  --green: #16a34a;
  --red: #ef4444;
  --radius: 0.375rem;
  --font: 'Inter', system-ui, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--fg); display:flex; min-height:100vh; }

.sidebar { width:220px; background:var(--sidebar); color:var(--sidebar-fg); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar .logo { padding:1rem; font-weight:700; color:#fff; border-bottom:1px solid rgba(255,255,255,0.1); }
.sidebar a { display:block; padding:0.65rem 1rem; color:var(--sidebar-fg); text-decoration:none; font-size:0.85rem; transition:all 0.15s; }
.sidebar a:hover { background:rgba(255,255,255,0.05); color:#fff; }
.sidebar a.active { background:var(--primary); color:#fff; }

.main { flex:1; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:0.65rem 1rem; border-bottom:1px solid var(--border); background:var(--surface); }
.topbar h2 { font-size:1rem; font-weight:600; }

.content { padding:1rem; }

.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0.75rem; margin-bottom:1rem; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; }
.stat .lbl { font-size:0.7rem; color:var(--fg-muted); text-transform:uppercase; }
.stat .val { font-size:1.75rem; font-weight:700; margin-top:0.15rem; }

.map-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:1rem; overflow:hidden; }
.map-section .head { display:flex; justify-content:space-between; padding:0.65rem 0.75rem; border-bottom:1px solid var(--border); }
.map-section .head h3 { font-size:0.85rem; font-weight:600; }
.map-viz { height:200px; background:#f1f5f9; }

.table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:0.5rem 0.75rem; font-size:0.7rem; color:var(--fg-muted); font-weight:500; border-bottom:1px solid var(--border); }
td { padding:0.5rem 0.75rem; font-size:0.83rem; border-bottom:1px solid var(--border); }
.status { font-size:0.65rem; padding:0.15rem 0.4rem; border-radius:0.25rem; }
.status.ok { background:#dcfce7; color:var(--green); }
.status.warn { background:#fef3c7; color:#d97706; }
.status.err { background:#fee2e2; color:var(--red); }
.status.chg { background:#dbeafe; color:var(--primary); }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">Fleet Manager</div>
  <a href="#" class="active">总览</a>
  <a href="#">车辆</a>
  <a href="#">电池</a>
  <a href="#">工单</a>
  <a href="#">报表</a>
  <a href="#">设置</a>
</aside>
<div class="main">
  <div class="topbar"><h2>总览</h2><span style="font-size:0.78rem;color:var(--fg-muted)">杭州 · 2026-06-05</span></div>
  <div class="content">
    <div class="stats">
      <div class="stat"><div class="lbl">在线</div><div class="val">2,847</div><div style="font-size:0.7rem;color:var(--green)">+3.2%</div></div>
      <div class="stat"><div class="lbl">今日骑行</div><div class="val">18,432</div><div style="font-size:0.7rem;color:var(--green)">+5.7%</div></div>
      <div class="stat"><div class="lbl">可用率</div><div class="val">94.7%</div><div style="font-size:0.7rem;color:var(--red)">-0.8%</div></div>
      <div class="stat"><div class="lbl">告警</div><div class="val">23</div><div style="font-size:0.7rem;color:var(--red)">+2</div></div>
    </div>
    <div class="map-section">
      <div class="head"><h3>实时分布</h3></div>
      <div class="map-viz"></div>
    </div>
    <div class="table-wrap">
      <div class="head" style="display:flex;justify-content:space-between;padding:0.65rem 0.75rem;border-bottom:1px solid var(--border)"><h3 style="font-size:0.85rem;font-weight:600">车辆状态</h3></div>
      <table>
        <thead><tr><th>编号</th><th>类型</th><th>电量</th><th>状态</th><th>位置</th></tr></thead>
        <tbody>
          <tr><td>HZ-00234</td><td>电单车</td><td>87%</td><td><span class="status ok">可用</span></td><td>西湖区</td></tr>
          <tr><td>HZ-00235</td><td>电单车</td><td>12%</td><td><span class="status warn">低电</span></td><td>武林广场</td></tr>
          <tr><td>HZ-00236</td><td>自行车</td><td>--</td><td><span class="status ok">可用</span></td><td>天目山路</td></tr>
          <tr><td>HZ-00237</td><td>电单车</td><td>45%</td><td><span class="status chg">充电中</span></td><td>余杭区</td></tr>
          <tr><td>HZ-00238</td><td>电单车</td><td>76%</td><td><span class="status err">维护中</span></td><td>维修中心</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
