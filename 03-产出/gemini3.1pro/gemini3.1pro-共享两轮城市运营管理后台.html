<!DOCTYPE html>
<html lang="zh-CN" class="antialiased text-gray-900 bg-gray-50 color-scheme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>城市运营管理后台 - 星星共享</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"PingFang SC"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Base styles matching guidelines */
        :root {
            color-scheme: light dark;
        }
        body {
            overscroll-behavior: none;
        }
        button, a, input, select {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-gray-50 dark:bg-gray-900 dark:text-gray-100">

    <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-700">
            <i data-lucide="bike" class="w-6 h-6 text-blue-600 mr-2" aria-hidden="true"></i>
            <h1 class="text-lg font-semibold tracking-tight">星共享运营台</h1>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md bg-blue-50 text-blue-700 dark:bg-blue-900/50 dark:text-blue-200" aria-current="page">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3 flex-shrink-0" aria-hidden="true"></i>
                运营总览
            </a>
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="map" class="w-5 h-5 mr-3 flex-shrink-0" aria-hidden="true"></i>
                地图调度中心
            </a>
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="zap" class="w-5 h-5 mr-3 flex-shrink-0" aria-hidden="true"></i>
                电池与能源
            </a>
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="clipboard-list" class="w-5 h-5 mr-3 flex-shrink-0" aria-hidden="true"></i>
                运维工单
            </a>
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="shield-alert" class="w-5 h-5 mr-3 flex-shrink-0" aria-hidden="true"></i>
                合规监管
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
            <button type="button" class="flex items-center w-full px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="settings" class="w-5 h-5 mr-3 flex-shrink-0" aria-hidden="true"></i>
                系统配置
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header -->
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-4 sm:px-6">
            <div class="flex items-center flex-1">
                <label for="search-input" class="sr-only">搜索车辆、工单或电池编号</label>
                <div class="relative w-full max-w-md">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search" class="h-5 w-5 text-gray-400" aria-hidden="true"></i>
                    </div>
                    <input id="search-input" name="search" type="search" autocomplete="off" spellcheck="false" class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md leading-5 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-500 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors" placeholder="搜索车辆、工单或电池编号…">
                </div>
            </div>
            
            <div class="ml-4 flex items-center space-x-4">
                <button type="button" class="p-2 text-gray-400 hover:text-gray-500 dark:hover:text-gray-300 rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" aria-label="通知">
                    <div class="relative">
                        <i data-lucide="bell" class="h-6 w-6" aria-hidden="true"></i>
                        <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white dark:ring-gray-800"></span>
                    </div>
                </button>
                <div class="relative">
                    <button type="button" class="flex items-center max-w-xs text-sm rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" aria-expanded="false" aria-haspopup="true">
                        <span class="sr-only">打开用户菜单</span>
                        <img class="h-8 w-8 rounded-full object-cover bg-gray-300" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="用户头像" width="32" height="32" loading="lazy">
                    </button>
                </div>
            </div>
        </header>

        <!-- Content scrollable area -->
        <div class="flex-1 overflow-auto p-4 sm:p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight" style="text-wrap: balance;">杭州市运营总览</h2>
                <div class="flex space-x-2">
                    <button type="button" class="inline-flex items-center px-3 py-1.5 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-500">
                        今日
                    </button>
                    <button type="button" class="inline-flex items-center px-3 py-1.5 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-500">
                        生成报表
                    </button>
                </div>
            </div>

            <!-- KPI Cards -->
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4 mb-8">
                <!-- Card 1 -->
                <div class="bg-white dark:bg-gray-800 overflow-hidden shadow rounded-lg border border-gray-100 dark:border-gray-700">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <i data-lucide="activity" class="h-6 w-6 text-gray-400" aria-hidden="true"></i>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 truncate">今日订单数</dt>
                                    <dd class="flex items-baseline">
                                        <div class="text-2xl font-semibold text-gray-900 dark:text-white tabular-nums">24,592</div>
                                        <span class="ml-2 text-sm font-medium text-green-600 flex items-center">
                                            <i data-lucide="arrow-up" class="w-4 h-4 mr-0.5" aria-hidden="true"></i> 12%
                                        </span>
                                    </dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Card 2 -->
                <div class="bg-white dark:bg-gray-800 overflow-hidden shadow rounded-lg border border-gray-100 dark:border-gray-700">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <i data-lucide="check-circle" class="h-6 w-6 text-gray-400" aria-hidden="true"></i>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 truncate">早高峰可用率</dt>
                                    <dd class="flex items-baseline">
                                        <div class="text-2xl font-semibold text-gray-900 dark:text-white tabular-nums">92.4%</div>
                                        <span class="ml-2 text-sm font-medium text-green-600 flex items-center">
                                            <i data-lucide="arrow-up" class="w-4 h-4 mr-0.5" aria-hidden="true"></i> 2.1%
                                        </span>
                                    </dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Card 3 -->
                <div class="bg-white dark:bg-gray-800 overflow-hidden shadow rounded-lg border border-gray-100 dark:border-gray-700">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <i data-lucide="battery-warning" class="h-6 w-6 text-orange-500" aria-hidden="true"></i>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 truncate">低电预警车辆</dt>
                                    <dd class="flex items-baseline">
                                        <div class="text-2xl font-semibold text-gray-900 dark:text-white tabular-nums">1,204</div>
                                        <span class="ml-2 text-sm font-medium text-red-600 flex items-center">
                                            <i data-lucide="arrow-up" class="w-4 h-4 mr-0.5" aria-hidden="true"></i> 5%
                                        </span>
                                    </dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Card 4 -->
                <div class="bg-white dark:bg-gray-800 overflow-hidden shadow rounded-lg border border-gray-100 dark:border-gray-700">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <i data-lucide="alert-triangle" class="h-6 w-6 text-red-500" aria-hidden="true"></i>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 truncate">违停告警</dt>
                                    <dd class="flex items-baseline">
                                        <div class="text-2xl font-semibold text-gray-900 dark:text-white tabular-nums">89</div>
                                        <span class="ml-2 text-sm font-medium text-gray-500 flex items-center">
                                            待处理 42
                                        </span>
                                    </dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Two column layout for Map and Actions -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Map Area -->
                <div class="lg:col-span-2 bg-white dark:bg-gray-800 shadow rounded-lg border border-gray-200 dark:border-gray-700 flex flex-col min-h-[400px]">
                    <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                        <h3 class="text-lg font-medium text-gray-900 dark:text-white">实时调度地图</h3>
                        <div class="flex space-x-2">
                            <button type="button" class="p-1 rounded text-gray-400 hover:text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" aria-label="刷新地图">
                                <i data-lucide="refresh-cw" class="w-5 h-5" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="p-1 rounded text-gray-400 hover:text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" aria-label="全屏显示">
                                <i data-lucide="maximize" class="w-5 h-5" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex-1 bg-gray-100 dark:bg-gray-900 relative rounded-b-lg overflow-hidden flex items-center justify-center">
                        <!-- Placeholder for Map -->
                        <div class="text-center">
                            <i data-lucide="map-pinned" class="mx-auto h-12 w-12 text-gray-400" aria-hidden="true"></i>
                            <p class="mt-2 text-sm text-gray-500">GIS 地图加载中…</p>
                        </div>
                        
                        <!-- Map controls overlay -->
                        <div class="absolute bottom-4 right-4 flex flex-col space-y-2">
                            <button type="button" class="bg-white dark:bg-gray-800 p-2 rounded shadow-md text-gray-700 dark:text-gray-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" aria-label="放大">
                                <i data-lucide="plus" class="w-5 h-5" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="bg-white dark:bg-gray-800 p-2 rounded shadow-md text-gray-700 dark:text-gray-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" aria-label="缩小">
                                <i data-lucide="minus" class="w-5 h-5" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions & Alerts -->
                <div class="flex flex-col space-y-6">
                    <!-- Alerts -->
                    <div class="bg-white dark:bg-gray-800 shadow rounded-lg border border-gray-200 dark:border-gray-700">
                        <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                            <h3 class="text-lg font-medium text-gray-900 dark:text-white">高优告警</h3>
                        </div>
                        <ul class="divide-y divide-gray-200 dark:divide-gray-700" role="list" aria-label="告警列表">
                            <li class="p-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                                <div class="flex space-x-3">
                                    <div class="flex-shrink-0">
                                        <i data-lucide="alert-circle" class="h-5 w-5 text-red-500" aria-hidden="true"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-medium text-gray-900 dark:text-white">滨江区违停聚集</p>
                                        <p class="text-sm text-gray-500 truncate">网易大厦南门超投 45 辆</p>
                                    </div>
                                    <div>
                                        <button type="button" class="text-sm text-blue-600 hover:text-blue-500 font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">派单</button>
                                    </div>
                                </div>
                            </li>
                            <li class="p-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                                <div class="flex space-x-3">
                                    <div class="flex-shrink-0">
                                        <i data-lucide="battery-low" class="h-5 w-5 text-orange-500" aria-hidden="true"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-medium text-gray-900 dark:text-white">批量低电告警</p>
                                        <p class="text-sm text-gray-500 truncate">西湖区 120 辆车电量 &lt; 10%</p>
                                    </div>
                                    <div>
                                        <button type="button" class="text-sm text-blue-600 hover:text-blue-500 font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">处理</button>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>

                    <!-- Quick Actions -->
                    <div class="bg-white dark:bg-gray-800 shadow rounded-lg border border-gray-200 dark:border-gray-700">
                        <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                            <h3 class="text-lg font-medium text-gray-900 dark:text-white">快捷工作台</h3>
                        </div>
                        <div class="p-4 grid grid-cols-2 gap-4">
                            <button type="button" class="flex flex-col items-center p-3 border border-gray-200 dark:border-gray-700 rounded-lg hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                                <i data-lucide="plus-circle" class="h-6 w-6 text-blue-600 mb-2" aria-hidden="true"></i>
                                <span class="text-sm font-medium text-gray-900 dark:text-white">新建调度</span>
                            </button>
                            <button type="button" class="flex flex-col items-center p-3 border border-gray-200 dark:border-gray-700 rounded-lg hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                                <i data-lucide="zap" class="h-6 w-6 text-blue-600 mb-2" aria-hidden="true"></i>
                                <span class="text-sm font-medium text-gray-900 dark:text-white">换电任务</span>
                            </button>
                            <button type="button" class="flex flex-col items-center p-3 border border-gray-200 dark:border-gray-700 rounded-lg hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                                <i data-lucide="map-pin" class="h-6 w-6 text-blue-600 mb-2" aria-hidden="true"></i>
                                <span class="text-sm font-medium text-gray-900 dark:text-white">围栏管理</span>
                            </button>
                            <button type="button" class="flex flex-col items-center p-3 border border-gray-200 dark:border-gray-700 rounded-lg hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                                <i data-lucide="users" class="h-6 w-6 text-blue-600 mb-2" aria-hidden="true"></i>
                                <span class="text-sm font-medium text-gray-900 dark:text-white">人员班次</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
