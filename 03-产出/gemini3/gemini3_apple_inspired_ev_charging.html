<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EV Charging - Apple Inspired</title>
    <style>
        :root {
            --apple-blue: #007AFF;
            --apple-green: #34C759;
            --apple-orange: #FF9500;
            --apple-gray: #8E8E93;
            --apple-bg: #F2F2F7;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: #000;
            overflow: hidden;
            height: 100vh;
        }

        /* 模拟地图背景 */
        .map-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            z-index: 1;
        }

        .map-marker {
            position: absolute;
            width: 44px;
            height: 44px;
            background: var(--apple-blue);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
            border: 3px solid white;
            animation: markerPulse 2s infinite ease-in-out;
        }

        .map-marker i {
            transform: rotate(45deg);
            color: white;
            font-size: 20px;
            font-style: normal;
        }

        @keyframes markerPulse {
            0% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.1); }
            100% { transform: rotate(-45deg) scale(1); }
        }

        /* 顶部状态栏 */
        .top-nav {
            position: fixed;
            top: 44px;
            left: 16px;
            right: 16px;
            height: 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 17px;
            outline: none;
            color: #333;
        }

        /* 底部抽屉卡片流 */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70vh;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 24px 24px 0 0;
            z-index: 200;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            transform: translateY(60%);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.4);
        }

        .bottom-sheet.expanded {
            transform: translateY(0);
        }

        .handle {
            width: 36px;
            height: 5px;
            background: rgba(0,0,0,0.1);
            border-radius: 3px;
            margin: 0 auto 20px;
        }

        .card-stream {
            height: calc(100% - 40px);
            overflow-y: auto;
            padding-bottom: 40px;
        }

        .station-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
            transition: transform 0.2s ease;
        }

        .station-card:active {
            transform: scale(0.97);
        }

        .info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info p {
            font-size: 13px;
            color: var(--apple-gray);
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pill.free { background: #E4F9EB; color: var(--apple-green); }
        .status-pill.busy { background: #FFF4E5; color: var(--apple-orange); }

        /* 中间大按钮 */
        .scan-btn {
            position: fixed;
            bottom: calc(30px + var(--safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #1677FF, #00C6FF);
            border-radius: 50%;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(22, 119, 255, 0.4);
            border: 4px solid white;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .scan-btn:active {
            transform: translateX(-50%) scale(0.9);
        }

        .scan-btn svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        /* 隐藏滚动条 */
        .card-stream::-webkit-scrollbar {
            display: none;
        }

        /* 快速功能图标组 */
        .quick-actions {
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .action-icon {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .action-item span {
            font-size: 12px;
            font-weight: 500;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="map-bg">
        <!-- 模拟地图图钉 -->
        <div class="map-marker" style="top: 30%; left: 40%;"><i>⚡</i></div>
        <div class="map-marker" style="top: 50%; left: 60%; background: var(--apple-orange);"><i>⚡</i></div>
        <div class="map-marker" style="top: 20%; left: 70%;"><i>⚡</i></div>
    </div>

    <div class="top-nav">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px; color: var(--apple-gray);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input" placeholder="搜索目的地或电站">
    </div>

    <div class="bottom-sheet" id="sheet">
        <div class="handle"></div>
        
        <div class="card-stream">
            <div class="quick-actions">
                <div class="action-item">
                    <div class="action-icon">⛽</div>
                    <span>优惠券</span>
                </div>
                <div class="action-item">
                    <div class="action-icon">🔋</div>
                    <span>电池管家</span>
                </div>
                <div class="action-item">
                    <div class="action-icon">🛣️</div>
                    <span>长途模式</span>
                </div>
                <div class="action-item">
                    <div class="action-icon">⭐</div>
                    <span>我的收藏</span>
                </div>
            </div>

            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 16px; padding-left: 4px;">附近的充电站</h2>

            <div class="station-card">
                <div class="info">
                    <h3>特来电 - 萧山国际机场站</h3>
                    <p>距离 1.2km · 杭州市萧山路 88 号</p>
                    <p style="margin-top: 4px;"><span style="color: var(--apple-blue); font-weight: 600;">¥1.20</span>/度 · 停车免费</p>
                </div>
                <div class="status-pill free">空闲 8/10</div>
            </div>

            <div class="station-card">
                <div class="info">
                    <h3>星星充电 - 钱江世纪城中心</h3>
                    <p>距离 2.5km · 钱塘江路 102 号</p>
                    <p style="margin-top: 4px;"><span style="color: var(--apple-blue); font-weight: 600;">¥1.45</span>/度 · 2小时免费</p>
                </div>
                <div class="status-pill busy">忙碌 1/12</div>
            </div>

            <div class="station-card">
                <div class="info">
                    <h3>云快充 - 滨江天街站</h3>
                    <p>距离 3.8km · 江汉路 1515 号</p>
                    <p style="margin-top: 4px;"><span style="color: var(--apple-blue); font-weight: 600;">¥1.15</span>/度 · 停车收费</p>
                </div>
                <div class="status-pill free">空闲 5/8</div>
            </div>

            <div class="station-card">
                <div class="info">
                    <h3>国网 - 西湖景区充电点</h3>
                    <p>距离 5.1km · 龙井路 1 号</p>
                    <p style="margin-top: 4px;"><span style="color: var(--apple-blue); font-weight: 600;">¥1.60</span>/度 · 环境优美</p>
                </div>
                <div class="status-pill busy">忙碌 0/4</div>
            </div>
        </div>
    </div>

    <div class="scan-btn">
        <svg viewBox="0 0 24 24">
            <path d="M4,4H10V6H6V10H4V4M14,4H20V10H18V6H14V4M4,14H6V18H10V20H4V14M18,18V14H20V20H14V18H18M7,7H11V11H7V7M13,7H17V11H13V7M7,13H11V17H7V13M13,13H17V17H13V13Z" />
        </svg>
    </div>

    <script>
        const sheet = document.getElementById('sheet');
        let startY = 0;
        let isExpanded = false;

        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        sheet.addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            if (startY - endY > 50) {
                sheet.classList.add('expanded');
                isExpanded = true;
            } else if (endY - startY > 50) {
                sheet.classList.remove('expanded');
                isExpanded = false;
            }
        });

        // 点击 handle 切换
        document.querySelector('.handle').addEventListener('click', () => {
            sheet.classList.toggle('expanded');
            isExpanded = !isExpanded;
        });
    </script>
</body>
</html>
