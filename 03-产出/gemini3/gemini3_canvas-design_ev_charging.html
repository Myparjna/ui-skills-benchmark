<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging - Chromatic Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --tech-blue: #1677FF;
            --charge-green: #52C41A;
            --bg-dark: #050505;
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            margin: 0;
            cursor: crosshair;
        }
        .canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
        }
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: pulse 8s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.5); opacity: 0.6; }
        }
        .text-art {
            font-family: 'Italiana', serif;
            letter-spacing: 0.2em;
        }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .pixel-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body>
    <div class="canvas-bg pixel-grid">
        <div class="glow-circle w-[600px] h-[600px] bg-blue-600 top-[-10%] left-[-10%]"></div>
        <div class="glow-circle w-[400px] h-[400px] bg-green-500 bottom-[5%] right-[-5%]" style="animation-delay: -2s;"></div>
    </div>

    <main class="relative h-screen w-full flex flex-col justify-between p-12">
        <!-- Header -->
        <header class="flex justify-between items-start">
            <div class="space-y-2">
                <h1 class="text-art text-6xl uppercase leading-none">V O L T</h1>
                <p class="text-sm opacity-50 tracking-[0.5em]">KINETIC ENERGY INFRASTRUCTURE</p>
            </div>
            <div class="flex items-center gap-8">
                <span class="text-xs tracking-widest opacity-40">EST. 2026</span>
                <i data-lucide="menu" class="w-6 h-6"></i>
            </div>
        </header>

        <!-- Center Art Piece -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="relative w-[80vh] h-[80vh] border border-white/5 rounded-full flex items-center justify-center">
                <div class="w-[60vh] h-[60vh] border border-white/10 rounded-full flex items-center justify-center animate-[spin_20s_linear_infinite]">
                    <div class="absolute top-0 w-2 h-2 bg-white rounded-full"></div>
                </div>
                <div class="absolute w-px h-full bg-gradient-to-b from-transparent via-white/20 to-transparent"></div>
                <div class="absolute h-px w-full bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
                
                <!-- Main CTA Node -->
                <div class="relative group pointer-events-auto">
                    <button class="w-32 h-32 rounded-full border border-white/40 flex flex-col items-center justify-center gap-2 hover:bg-white hover:text-black transition-all duration-700">
                        <i data-lucide="qr-code" class="w-6 h-6"></i>
                        <span class="text-[10px] tracking-widest uppercase">Scan</span>
                    </button>
                    <div class="absolute -inset-4 border border-green-500/30 rounded-full animate-ping"></div>
                </div>
            </div>
        </div>

        <!-- Info Panels -->
        <footer class="flex justify-between items-end">
            <div class="max-w-xs space-y-8">
                <div class="space-y-2">
                    <span class="text-[10px] text-green-500 tracking-tighter">● LIVE NETWORK</span>
                    <div class="flex gap-4 items-end">
                        <span class="text-5xl font-light">12,842</span>
                        <span class="text-xs opacity-50 pb-2">ACTIVE NODES</span>
                    </div>
                </div>
                <p class="text-[11px] leading-relaxed opacity-40 uppercase tracking-widest">
                    A seamless synthesis of location intelligence and energetic flow. 
                    Finding balance in the urban pulse.
                </p>
            </div>

            <div class="flex flex-col items-end gap-12">
                <div class="vertical-text text-[10px] tracking-[1em] opacity-30 uppercase">
                    Plus Membership / Infinite Reach
                </div>
                <div class="flex gap-4">
                    <div class="p-4 border border-white/10 backdrop-blur-md">
                        <i data-lucide="map-pin" class="w-4 h-4 opacity-50"></i>
                    </div>
                    <div class="p-4 border border-white/10 backdrop-blur-md">
                        <i data-lucide="zap" class="w-4 h-4 text-green-500"></i>
                    </div>
                </div>
            </div>
        </footer>
    </main>

    <script>
        lucide.createIcons();
        // Subtle mouse interaction
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            document.querySelector('.glow-circle').style.transform = `translate(${x * 50}px, ${y * 50}px)`;
        });
    </script>
</body>
</html>
