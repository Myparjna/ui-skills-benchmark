<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skystar Airline - Ethereal Horizon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400&family=Inter:wght@200;300&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: #fff;
            color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .sky-gradient {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #E6F0FF 0%, #FFFFFF 60%, #F5F5F5 100%);
            z-index: 0;
        }
        .horizon-line {
            position: absolute;
            bottom: 30vh;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0,0,0,0.05);
        }
        .elegant-serif {
            font-family: 'Lora', serif;
            font-style: italic;
        }
        .content-frame {
            border: 1px solid rgba(0,0,0,0.1);
            margin: 40px;
            height: calc(100vh - 80px);
            position: relative;
            z-index: 10;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .float-anim {
            animation: float 10s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="sky-gradient">
        <div class="horizon-line"></div>
        <!-- Abstract Cloud/Aviation Form -->
        <div class="absolute top-1/4 right-[-10%] w-[800px] h-[400px] bg-blue-100/50 rounded-full blur-[120px] float-anim"></div>
    </div>

    <div class="content-frame">
        <header class="flex justify-between items-start">
            <div class="space-y-1">
                <p class="text-[10px] tracking-[0.4em] uppercase opacity-40">Aura of the Skies</p>
                <h1 class="text-4xl font-light tracking-tighter">SKYSTAR</h1>
            </div>
            <nav class="flex gap-12 text-[10px] tracking-widest uppercase opacity-60">
                <a href="#" class="hover:opacity-100">Destinations</a>
                <a href="#" class="hover:opacity-100">Experience</a>
                <a href="#" class="hover:opacity-100">Loyalty</a>
            </nav>
        </header>

        <section class="max-w-2xl">
            <h2 class="elegant-serif text-7xl mb-8 leading-tight">Every takeoff is a new beginning.</h2>
            <div class="flex gap-12 items-center">
                <button class="group flex items-center gap-4">
                    <div class="w-16 h-16 rounded-full border border-black/10 flex items-center justify-center group-hover:bg-black group-hover:text-white transition-all">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </div>
                    <span class="text-xs tracking-widest uppercase">Search Flights</span>
                </button>
                <div class="h-px w-24 bg-black/10"></div>
                <p class="text-xs opacity-40 uppercase tracking-widest leading-loose">
                    Connecting worlds, touching dreams.<br>186 aircraft. 5.2 years avg age.
                </p>
            </div>
        </section>

        <footer class="flex justify-between items-end">
            <div class="space-y-6">
                <div class="flex gap-8">
                    <div>
                        <p class="text-[10px] opacity-40 mb-2">HGH → LHR</p>
                        <p class="text-sm">From ¥3,899</p>
                    </div>
                    <div>
                        <p class="text-[10px] opacity-40 mb-2">HGH → NRT</p>
                        <p class="text-sm">From ¥1,299</p>
                    </div>
                </div>
            </div>
            <div class="text-right space-y-4">
                <p class="text-[10px] tracking-[0.5em] opacity-30">SINCE 2008</p>
                <div class="flex gap-4 justify-end opacity-40">
                    <i data-lucide="instagram" class="w-4 h-4"></i>
                    <i data-lucide="twitter" class="w-4 h-4"></i>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
