<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Ops - Cinematic Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --accent: #38BDF8;
            --bg: #050505;
            --surface: rgba(15, 15, 15, 0.6);
            --border: rgba(255,255,255,0.05);
        }
        body {
            background-color: var(--bg);
            color: #E2E2E2;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass {
            background: var(--surface);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .reveal { opacity: 0; }
        .map-container {
            position: fixed;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
            background: 
                radial-gradient(circle at 2px 2px, #334155 1px, transparent 0);
            background-size: 40px 40px;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.1), transparent);
            animation: scan 6s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body class="flex h-screen">
    <div class="map-container">
        <div class="scan-line"></div>
    </div>

    <!-- Main Sidebar UI -->
    <main class="w-[480px] h-full flex flex-col p-12 border-r border-white/5 relative z-10">
        <header class="mb-24 reveal">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-8 h-8 glass rounded-lg flex items-center justify-center border-sky-500/50">
                    <i data-lucide="command" class="text-sky-400 w-5 h-5"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tighter">URBAN_COMMAND</h1>
            </div>
            <p class="text-xs mono opacity-40 uppercase tracking-[0.4em]">Integrated Fleet Operations / v8.0</p>
        </header>

        <section class="flex-1 space-y-12">
            <div class="reveal">
                <p class="text-[10px] mono text-sky-500 mb-2 uppercase tracking-widest">Operational_Status</p>
                <div class="flex items-end gap-4">
                    <h2 class="text-6xl font-bold tracking-tighter">24,092</h2>
                    <span class="text-xs mono opacity-40 mb-2">ACTIVE_ASSETS</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 reveal">
                <div class="glass p-6 rounded-3xl">
                    <p class="text-[10px] mono opacity-40 mb-2">BATTERY_ALERTS</p>
                    <p class="text-2xl font-bold text-amber-500">1,240</p>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <p class="text-[10px] mono opacity-40 mb-2">WORK_ORDERS</p>
                    <p class="text-2xl font-bold">342</p>
                </div>
            </div>

            <!-- Asymmetric Data List -->
            <div class="space-y-4 reveal">
                <p class="text-[10px] mono opacity-40 uppercase tracking-widest">Recent_Activity</p>
                <div class="space-y-1">
                    <div class="flex justify-between items-center py-4 px-6 glass rounded-2xl border-l-4 border-l-sky-500">
                        <div>
                            <p class="text-sm font-bold">Deployment Plan Alpha</p>
                            <p class="text-[10px] mono opacity-40">District_04 / Central</p>
                        </div>
                        <span class="text-[10px] mono font-bold">78%</span>
                    </div>
                    <div class="flex justify-between items-center py-4 px-6 glass rounded-2xl">
                        <div>
                            <p class="text-sm font-bold">Critical Battery Swap</p>
                            <p class="text-[10px] mono opacity-40">HGH_Station_92</p>
                        </div>
                        <i data-lucide="clock" class="w-3 h-3 opacity-20"></i>
                    </div>
                </div>
            </div>
        </section>

        <footer class="mt-auto pt-12 border-t border-white/5 reveal">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-slate-900 border border-white/5 flex items-center justify-center overflow-hidden">
                        <div class="w-full h-full bg-gradient-to-br from-sky-500 to-blue-700 opacity-80"></div>
                    </div>
                    <div>
                        <p class="text-xs font-bold">Admin S. Wei</p>
                        <p class="text-[9px] mono opacity-40 uppercase">Shift Manager</p>
                    </div>
                </div>
                <button class="p-3 glass rounded-full hover:bg-sky-500 hover:text-black transition-all">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </footer>
    </main>

    <!-- Floating Map Overlay -->
    <div class="absolute bottom-12 right-12 flex flex-col gap-4 reveal">
        <div class="glass p-6 rounded-3xl w-64">
            <div class="flex justify-between mb-4">
                <span class="text-[10px] mono opacity-40">GIS_LAYERS</span>
                <i data-lucide="maximize-2" class="w-3 h-3 opacity-20"></i>
            </div>
            <div class="space-y-2">
                <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                    <div class="h-full bg-sky-500 w-3/4"></div>
                </div>
                <div class="flex justify-between text-[9px] mono opacity-40">
                    <span>COVERAGE</span>
                    <span>94.2%</span>
                </div>
            </div>
        </div>
        <button class="glass p-6 rounded-3xl w-64 bg-sky-500 text-black border-none font-bold text-sm flex items-center justify-between">
            Launch Dispatcher
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();
        gsap.to(".reveal", {
            opacity: 1,
            x: 0,
            duration: 1.5,
            stagger: 0.2,
            ease: "power3.out"
        });
    </script>
</body>
</html>
