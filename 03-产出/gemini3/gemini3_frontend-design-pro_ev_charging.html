<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging - Futuristic Energy Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00F2FF;
            --secondary: #7000FF;
            --success: #00FF94;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-heavy: rgba(255, 255, 255, 0.2);
            --text: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animated Mesh Gradient Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, #1a0033 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #001a33 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, #000 0%, #000 100%);
        }

        .aurora {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            filter: blur(100px);
            opacity: 0.5;
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(80px);
        }

        .blob-1 { background: var(--secondary); top: -100px; left: -100px; animation: float 15s infinite; }
        .blob-2 { background: var(--primary); bottom: -100px; right: -100px; animation: float 18s infinite reverse; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(100px, 50px) scale(1.2); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Glass Container */
        .app-container {
            width: 390px;
            height: 844px;
            background: var(--glass);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 40px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .location {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Search & Map Preview */
        .search-box {
            margin: 0 24px 20px;
            background: var(--glass-heavy);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .map-preview {
            flex: 1;
            margin: 0 24px;
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-marker {
            position: absolute;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border: 4px solid #FFF;
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary);
        }

        /* Charging Card */
        .bottom-sheet {
            background: var(--glass-heavy);
            backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 40px 40px 0 0;
            margin-top: auto;
        }

        .station-info h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .charging-status {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 75%, transparent 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-circle::after {
            content: '75%';
            position: absolute;
            width: 65px;
            height: 65px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .status-details h4 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .status-details p {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border: none;
            padding: 18px;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(112, 0, 255, 0.3);
            transition: transform 0.2s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        /* Nav Tab */
        .tab-bar {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .tab-item.active {
            opacity: 1;
            color: var(--primary);
        }

        .scan-btn {
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--primary);
            margin-top: -30px;
        }

        /* Floating elements */
        .glass-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="bg-gradient">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <header>
            <div class="location">
                <div class="location-dot"></div>
                Hangzhou, Binjiang Dist.
            </div>
            <div style="width: 40px; height: 40px; background: var(--glass-heavy); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
        </header>

        <div class="search-box">
            <svg width="20" height="20" fill="rgba(255,255,255,0.5)" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span style="opacity: 0.5;">Search Charging Stations</span>
        </div>

        <div class="map-preview">
            <!-- Simulated Map Elements -->
            <div class="map-marker" style="top: 30%; left: 40%;"></div>
            <div class="map-marker" style="top: 60%; left: 70%; opacity: 0.5;"></div>
            <div class="map-marker" style="top: 50%; left: 20%; opacity: 0.3;"></div>
            
            <div class="glass-badge">
                <span style="color: var(--success);">●</span> 12 Stations Nearby
            </div>
            <div style="font-family: var(--font-display); font-size: 3rem; opacity: 0.05; font-weight: 700;">MAPVIEW_CORE</div>
        </div>

        <div class="bottom-sheet">
            <div class="station-info">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <h2>Star Charge Hub A-2</h2>
                    <span style="color: var(--primary); font-weight: 700;">¥1.28/kWh</span>
                </div>
                <div class="tags">
                    <div class="tag">Super Fast</div>
                    <div class="tag">Free Parking</div>
                    <div class="tag">PLUS Member 80% Off</div>
                </div>
            </div>

            <div class="charging-status">
                <div class="progress-circle"></div>
                <div class="status-details">
                    <h4>Charging Now</h4>
                    <p>Current Power: 120.5 kW</p>
                    <p>Est. Time: 12 min left</p>
                </div>
                <div style="margin-left: auto;">
                    <svg width="24" height="24" fill="var(--primary)" viewBox="0 0 24 24"><path d="M13.5 2L5 14h7v8l8.5-12H13.5z"/></svg>
                </div>
            </div>

            <button class="btn-action">Scan to Start Charging</button>
            
            <div class="tab-bar">
                <div class="tab-item active">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span style="font-size: 0.6rem;">Explore</span>
                </div>
                <div class="tab-item">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span style="font-size: 0.6rem;">Favs</span>
                </div>
                <div class="scan-btn">
                    <svg width="24" height="24" fill="black" viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2zM7 7h10v10H7z"/></svg>
                </div>
                <div class="tab-item">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    <span style="font-size: 0.6rem;">Orders</span>
                </div>
                <div class="tab-item">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span style="font-size: 0.6rem;">Me</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Interactive Glow Following Cursor
        const container = document.querySelector('.app-container');
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            container.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, transparent 100%)`;
        });
        
        container.addEventListener('mouseleave', () => {
            container.style.background = `var(--glass)`;
        });
    </script>
</body>
</html>
