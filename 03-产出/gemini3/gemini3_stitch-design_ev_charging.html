<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging - Stitch Design Prototype</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --stitch-primary: #1677FF;
            --stitch-secondary: #52C41A;
            --stitch-surface: #FFFFFF;
            --stitch-background: #F8FAFC;
            --stitch-radius-lg: 24px;
            --stitch-radius-md: 16px;
            --stitch-shadow: 0 10px 30px -10px rgba(22, 119, 255, 0.1);
        }
        body { background-color: var(--stitch-background); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .stitch-card { background: var(--stitch-surface); border-radius: var(--stitch-radius-lg); border: 1px solid rgba(0,0,0,0.03); box-shadow: var(--stitch-shadow); }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: var(--stitch-radius-md); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-free { background-color: #52C41A; box-shadow: 0 0 8px #52C41A; }
        .status-busy { background-color: #FA8C16; box-shadow: 0 0 8px #FA8C16; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-md mx-auto min-h-screen pb-24">
    <!-- Header -->
    <header class="flex items-center justify-between mb-8 px-2">
        <div class="flex items-center gap-3">
            <div class="size-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                <i data-lucide="zap" class="size-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">EV Charging</h1>
                <p class="text-xs text-slate-400 font-medium">寻找最近的能量点</p>
            </div>
        </div>
        <div class="size-10 rounded-full border-2 border-white shadow-sm overflow-hidden bg-slate-200">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar">
        </div>
    </header>

    <!-- Search Area -->
    <div class="stitch-card p-4 mb-8">
        <div class="relative">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 size-5 text-slate-400"></i>
            <input type="text" placeholder="搜索充电站、地点" class="w-full pl-12 pr-4 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500/20 outline-none text-sm font-medium">
        </div>
        <div class="flex gap-2 mt-4 overflow-x-auto pb-1 no-scrollbar">
            <span class="px-4 py-2 bg-blue-50 text-blue-600 rounded-full text-xs font-bold whitespace-nowrap">最近使用</span>
            <span class="px-4 py-2 bg-slate-100 text-slate-500 rounded-full text-xs font-bold whitespace-nowrap">超充站</span>
            <span class="px-4 py-2 bg-slate-100 text-slate-500 rounded-full text-xs font-bold whitespace-nowrap">免费停车</span>
        </div>
    </div>

    <!-- Active Charging Card (Minimalist Glassmorphism) -->
    <div class="stitch-card p-6 bg-gradient-to-br from-blue-600 to-blue-700 text-white mb-8 relative overflow-hidden">
        <div class="absolute -right-10 -top-10 size-40 bg-white/10 rounded-full blur-3xl"></div>
        <div class="flex justify-between items-start mb-6">
            <div>
                <span class="text-blue-100 text-xs font-bold uppercase tracking-wider">正在充电</span>
                <h2 class="text-2xl font-bold mt-1">特斯拉 Model 3</h2>
            </div>
            <div class="px-3 py-1 glass-panel text-[10px] font-bold">直流快充 · 120kW</div>
        </div>
        <div class="flex items-end gap-2 mb-8">
            <span class="text-6xl font-black leading-none">82</span>
            <span class="text-xl font-bold text-blue-200 pb-1">%</span>
            <div class="ml-auto text-right">
                <p class="text-xs text-blue-100 opacity-80">预计充满</p>
                <p class="text-lg font-bold">12:45</p>
            </div>
        </div>
        <div class="w-full h-2 bg-white/20 rounded-full overflow-hidden">
            <div class="h-full bg-white w-[82%] shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>
        </div>
    </div>

    <!-- Nearby Stations -->
    <div class="space-y-4">
        <div class="flex justify-between items-center px-2">
            <h3 class="font-bold text-slate-800">附近站点</h3>
            <button class="text-blue-600 text-xs font-bold">查看全部</button>
        </div>
        
        <!-- Station 1 -->
        <div class="stitch-card p-4 flex gap-4 items-center">
            <div class="size-16 rounded-2xl bg-slate-50 flex items-center justify-center overflow-hidden border border-slate-100">
                <img src="https://images.unsplash.com/photo-1620211541064-2e774526d165?auto=format&fit=crop&q=80&w=100&h=100" class="object-cover size-full">
            </div>
            <div class="flex-1">
                <div class="flex justify-between">
                    <h4 class="font-bold text-slate-800 text-sm">西溪悦泰充电站</h4>
                    <span class="text-[10px] font-bold text-slate-400">850m</span>
                </div>
                <p class="text-[10px] text-slate-500 mt-1">杭州市西湖区余杭塘路 128 号</p>
                <div class="flex gap-3 mt-2">
                    <span class="flex items-center gap-1 text-[10px] font-bold">
                        <span class="status-dot status-free"></span> 4 空闲
                    </span>
                    <span class="text-[10px] font-bold text-slate-400">|</span>
                    <span class="text-[10px] font-bold text-blue-600">¥1.25 / 度</span>
                </div>
            </div>
        </div>

        <!-- Station 2 -->
        <div class="stitch-card p-4 flex gap-4 items-center">
            <div class="size-16 rounded-2xl bg-slate-50 flex items-center justify-center overflow-hidden border border-slate-100">
                <img src="https://images.unsplash.com/photo-1593941707882-a5bba14938c7?auto=format&fit=crop&q=80&w=100&h=100" class="object-cover size-full">
            </div>
            <div class="flex-1">
                <div class="flex justify-between">
                    <h4 class="font-bold text-slate-800 text-sm">星空航站楼超充</h4>
                    <span class="text-[10px] font-bold text-slate-400">2.1km</span>
                </div>
                <p class="text-[10px] text-slate-500 mt-1">萧山国际机场 T3 停车场</p>
                <div class="flex gap-3 mt-2">
                    <span class="flex items-center gap-1 text-[10px] font-bold">
                        <span class="status-dot status-busy"></span> 1 空闲
                    </span>
                    <span class="text-[10px] font-bold text-slate-400">|</span>
                    <span class="text-[10px] font-bold text-blue-600">¥1.88 / 度</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sticky Navigation (Stitch Floating Bar) -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass-panel p-2 flex justify-around items-center shadow-2xl">
        <button class="p-3 text-blue-600"><i data-lucide="map-pinned" class="size-6"></i></button>
        <button class="p-3 text-slate-400 hover:text-blue-500 transition-colors"><i data-lucide="ticket-percent" class="size-6"></i></button>
        <button class="size-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-300 -mt-8">
            <i data-lucide="qr-code" class="size-8"></i>
        </button>
        <button class="p-3 text-slate-400 hover:text-blue-500 transition-colors"><i data-lucide="clipboard-list" class="size-6"></i></button>
        <button class="p-3 text-slate-400 hover:text-blue-500 transition-colors"><i data-lucide="user" class="size-6"></i></button>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
