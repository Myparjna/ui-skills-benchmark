<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空航空 - Skystar Airlines | 连接世界，触达梦想</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #060F1E;
            --secondary: #132238;
            --accent: #D4AF37;
            --accent-hover: #E5C158;
            --text-light: #FAF6F0;
            --text-dark: #2C353F;
            --text-muted: #8E9BAE;
            --border-light: rgba(212, 175, 55, 0.25);
            --border-dark: rgba(19, 34, 56, 0.1);
            --shadow-luxury: 0 20px 40px rgba(6, 15, 30, 0.15);
            --transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: var(--text-light);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .serif {
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--text-light);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* --- Header & Navigation --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 24px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            border-bottom: 1px solid transparent;
        }

        header.scrolled {
            background-color: rgba(6, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 8%;
            border-bottom: 1px solid var(--border-light);
        }

        header.scrolled .logo h1, 
        header.scrolled .nav-links a {
            color: var(--text-light);
        }

        header.scrolled .nav-links a::after {
            background-color: var(--accent);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), #f3e5ab);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        .logo-icon i {
            color: var(--primary);
            font-size: 18px;
        }

        .logo h1 {
            color: var(--primary);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            transition: var(--transition);
        }

        .logo span {
            font-size: 12px;
            display: block;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            position: relative;
            padding: 8px 0;
            transition: var(--transition);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-member {
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            border-radius: 0px;
            background: transparent;
            transition: var(--transition);
            cursor: pointer;
        }

        .btn-member:hover {
            background-color: var(--accent);
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        /* --- Hero Banner Section --- */
        .hero {
            position: relative;
            min-height: 100vh;
            background-color: var(--primary);
            background-image: radial-gradient(circle at 80% 20%, rgba(19, 34, 56, 0.8) 0%, rgba(6, 15, 30, 1) 70%);
            display: flex;
            align-items: center;
            padding: 120px 8% 80px 8%;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(6,15,30,0.5) 0%, rgba(6,15,30,0.9) 100%);
            z-index: 1;
        }

        /* Luxury Stars Overlay */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            color: var(--text-light);
            max-width: 650px;
            animation: fadeInUp 1.5s ease;
        }

        .hero-tag {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            display: block;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .hero-title {
            font-size: 54px;
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 24px;
        }

        .hero-title span {
            font-weight: 600;
            display: block;
            background: linear-gradient(135deg, #fff 40%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 16px;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
        }

        .stat-item h3 {
            font-size: 32px;
            font-weight: 400;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .stat-item p {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        /* Flight Search Widget (Overlapping Hero) */
        .search-container {
            position: absolute;
            bottom: 0;
            left: 8%;
            right: 8%;
            transform: translateY(50%);
            background-color: var(--text-light);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-luxury);
            z-index: 10;
            padding: 30px 40px;
            border-radius: 0px;
        }

        .search-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .search-title span {
            color: var(--accent);
            font-weight: 300;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 2.2fr 1fr 1fr 1fr 1.2fr;
            gap: 15px;
            align-items: end;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            background: #fff;
            border: 1px solid rgba(19, 34, 56, 0.15);
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: var(--transition);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }

        .input-wrapper i {
            color: var(--accent);
            font-size: 16px;
            margin-right: 12px;
        }

        .input-wrapper input, .input-wrapper select {
            border: none;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .airport-flow {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .airport-flow input {
            text-align: center;
        }

        .airport-flow input:first-child {
            text-align: left;
        }

        .airport-flow input:last-child {
            text-align: right;
        }

        .airport-swap {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
        }

        .airport-swap:hover {
            transform: rotate(180deg);
        }

        .btn-search {
            background-color: var(--primary);
            color: var(--text-light);
            border: 1px solid var(--accent);
            height: 52px;
            width: 100%;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-search:hover {
            background-color: var(--accent);
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        /* --- Section Defaults --- */
        section {
            padding: 160px 8% 100px 8%;
        }

        .section-header {
            max-width: 700px;
            margin-bottom: 60px;
        }

        .section-tag {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .section-title {
            font-size: 40px;
            font-weight: 300;
            color: var(--primary);
            line-height: 1.3;
        }

        .section-title span {
            font-weight: 700;
            display: block;
        }

        /* --- Special Offers Banner (Ticker Style) --- */
        .promo-ticker {
            background-color: var(--secondary);
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 20px 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            position: relative;
        }

        .promo-wrapper {
            display: flex;
            white-space: nowrap;
            animation: ticker 25s linear infinite;
        }

        .promo-item {
            display: inline-flex;
            align-items: center;
            margin-right: 50px;
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
            letter-spacing: 1px;
        }

        .promo-tag {
            background-color: var(--accent);
            color: var(--primary);
            font-weight: 700;
            font-size: 11px;
            padding: 3px 8px;
            text-transform: uppercase;
            margin-right: 15px;
            letter-spacing: 1px;
        }

        .promo-item a {
            color: var(--accent);
            text-decoration: none;
            margin-left: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
        }

        /* --- Why Choose Us (Asymmetrical grid) --- */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 30px;
        }

        .feature-card {
            background-color: #fff;
            border: 1px solid var(--border-dark);
            padding: 40px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: var(--transition);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: var(--shadow-luxury);
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .feature-icon-wrapper {
            width: 60px;
            height: 60px;
            border: 1px solid var(--border-light);
            background: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .feature-card:hover .feature-icon-wrapper {
            background-color: var(--primary);
            color: var(--accent);
        }

        .feature-card h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .feature-card p {
            font-size: 14px;
            color: var(--text-dark);
            line-height: 1.7;
            font-weight: 400;
            opacity: 0.85;
        }

        .feature-col-4 {
            grid-column: span 4;
        }

        .feature-col-6 {
            grid-column: span 6;
        }

        /* --- Featured Destinations (Editorial Card design) --- */
        .destinations {
            background-color: #fff;
        }

        .destinations-carousel {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 24px;
            margin-top: 20px;
        }

        .destination-card {
            position: relative;
            height: 480px;
            overflow: hidden;
            border: 1px solid var(--border-dark);
            cursor: pointer;
        }

        .destination-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .destination-card:hover .destination-bg {
            transform: scale(1.1);
        }

        .dest-1 { background-image: linear-gradient(rgba(6,15,30,0.1), rgba(6,15,30,0.85)), url('https://images.unsplash.com/photo-1542856391-010fb87dcfed?auto=format&fit=crop&q=80&w=600'); }
        .dest-2 { background-image: linear-gradient(rgba(6,15,30,0.1), rgba(6,15,30,0.85)), url('https://images.unsplash.com/photo-1534067783941-51c9c23eccfd?auto=format&fit=crop&q=80&w=600'); }
        .dest-3 { background-image: linear-gradient(rgba(6,15,30,0.1), rgba(6,15,30,0.85)), url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&q=80&w=600'); }
        .dest-4 { background-image: linear-gradient(rgba(6,15,30,0.1), rgba(6,15,30,0.85)), url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&q=80&w=600'); }
        .dest-5 { background-image: linear-gradient(rgba(6,15,30,0.1), rgba(6,15,30,0.85)), url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&q=80&w=600'); }

        .destination-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px;
            color: var(--text-light);
            z-index: 2;
            transition: var(--transition);
        }

        .destination-card:hover .destination-info {
            transform: translateY(-10px);
        }

        .destination-name {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .destination-tagline {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 15px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .destination-meta {
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .destination-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .destination-card::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 1px solid var(--border-light);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .destination-card:hover::after {
            opacity: 1;
        }

        /* --- Star Membership (Frequent Flyer Program) --- */
        .membership {
            background-color: var(--primary);
            color: var(--text-light);
            position: relative;
        }

        .membership-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 80px;
            align-items: center;
        }

        .membership-info p {
            font-size: 15px;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .btn-register-mileage {
            background: linear-gradient(135deg, var(--accent), #f3e5ab);
            color: var(--primary);
            border: none;
            padding: 16px 36px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-register-mileage:hover {
            box-shadow: 0 5px 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .membership-table-wrapper {
            background-color: var(--secondary);
            border: 1px solid var(--border-light);
            padding: 40px;
        }

        .membership-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .membership-table th {
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 600;
        }

        .membership-table td {
            padding: 20px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            font-weight: 400;
        }

        .membership-table tr:last-child td {
            border-bottom: none;
        }

        .membership-table tr:hover td {
            color: var(--accent);
        }

        .level-badge {
            display: inline-block;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .level-silver { color: #A8A9AD; }
        .level-gold { color: var(--accent); }
        .level-platinum { color: #E5E4E2; }
        .level-diamond { color: #B9F2FF; }

        /* --- Services & Solutions (Dual Column Overlap) --- */
        .services-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
        }

        .service-column {
            position: relative;
            background: #fff;
            border: 1px solid var(--border-dark);
            padding: 50px;
        }

        .service-column h3 {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 15px;
        }

        .service-item {
            margin-bottom: 30px;
        }

        .service-item:last-child {
            margin-bottom: 0;
        }

        .service-item h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .service-item h4 i {
            color: var(--accent);
            font-size: 16px;
        }

        .service-item p {
            font-size: 14px;
            color: var(--text-dark);
            line-height: 1.7;
            opacity: 0.85;
        }

        .corp-solutions {
            background-color: var(--secondary);
            border-color: var(--border-light);
            color: var(--text-light);
        }

        .corp-solutions h3 {
            color: var(--accent);
            border-color: var(--border-light);
        }

        .corp-solutions .service-item h4 {
            color: var(--text-light);
        }

        /* --- About Us & Sustainability --- */
        .about {
            background-color: #fff;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .about-text h2 {
            font-size: 38px;
            font-weight: 300;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .about-text h2 span {
            font-weight: 700;
            color: var(--accent);
        }

        .about-text p {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-dark);
            margin-bottom: 24px;
            opacity: 0.9;
        }

        .sustainability-box {
            background-color: var(--text-light);
            border-left: 3px solid var(--accent);
            padding: 30px;
            margin-top: 40px;
        }

        .sustainability-box h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sustainability-box h4 i {
            color: #2E8B57;
        }

        .sustainability-box p {
            font-size: 13px;
            margin-bottom: 0;
            line-height: 1.6;
        }

        .about-image {
            position: relative;
            height: 550px;
            border: 1px solid var(--border-dark);
        }

        .about-img-bg {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&q=80&w=800');
            background-size: cover;
            background-position: center;
        }

        .about-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid var(--accent);
            z-index: 0;
        }

        /* --- Footer --- */
        footer {
            background-color: var(--primary);
            color: var(--text-light);
            padding: 80px 8% 40px 8%;
            border-top: 1px solid var(--border-light);
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.5fr;
            gap: 50px;
            margin-bottom: 60px;
        }

        .footer-brand h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .footer-brand span {
            color: var(--accent);
            letter-spacing: 4px;
            font-size: 12px;
            display: block;
            margin-bottom: 20px;
        }

        .footer-brand p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .footer-links h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .footer-links ul {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 12px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--accent);
            padding-left: 5px;
        }

        .footer-socials {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: var(--transition);
        }

        .social-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: rgba(212, 175, 55, 0.05);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer-bottom-links {
            display: flex;
            gap: 20px;
        }

        .footer-bottom-links a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer-bottom-links a:hover {
            color: var(--accent);
        }

        /* --- Interactive Search Results Popup --- */
        .search-results-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .search-results-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .results-box {
            background-color: var(--text-light);
            border: 1px solid var(--accent);
            width: 90%;
            max-width: 900px;
            padding: 40px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.9);
            transition: var(--transition);
        }

        .search-results-overlay.active .results-box {
            transform: scale(1);
        }

        .close-results {
            position: absolute;
            top: 25px;
            right: 25px;
            background: transparent;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 24px;
        }

        .results-header {
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .results-flight-summary {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
        }

        .results-flight-date {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .flight-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .flight-card {
            background: #fff;
            border: 1px solid var(--border-dark);
            padding: 24px;
            display: grid;
            grid-template-columns: 1.5fr 2fr 1fr 1fr;
            align-items: center;
            transition: var(--transition);
        }

        .flight-card:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .flight-info-main h4 {
            font-size: 16px;
            color: var(--primary);
        }

        .flight-info-main p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .flight-timeline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .time-node {
            text-align: center;
        }

        .time-node h5 {
            font-size: 18px;
            color: var(--primary);
            font-weight: 600;
        }

        .time-node p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .timeline-line {
            flex-grow: 1;
            height: 1px;
            background-color: var(--text-muted);
            position: relative;
            min-width: 60px;
        }

        .timeline-line i {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 0 5px;
            font-size: 12px;
            color: var(--accent);
        }

        .flight-price {
            text-align: right;
            padding-right: 20px;
        }

        .price-val {
            font-size: 22px;
            font-weight: 600;
            color: var(--primary);
        }

        .price-val span {
            color: var(--accent);
            font-size: 14px;
            font-weight: 400;
        }

        .price-tax {
            font-size: 11px;
            color: var(--text-muted);
        }

        .btn-book-flight {
            background-color: var(--primary);
            color: var(--text-light);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-book-flight:hover {
            background-color: var(--accent);
            color: var(--primary);
        }

        /* --- Keyframe Animations --- */
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Responsive Styles --- */
        @media (max-width: 1200px) {
            .search-container {
                position: relative;
                bottom: auto;
                left: auto;
                right: auto;
                transform: none;
                margin: 40px 8% -80px 8%;
            }
            .search-grid {
                grid-template-columns: 1fr 1fr;
            }
            .btn-search {
                grid-column: span 2;
            }
            section {
                padding: 120px 8% 80px 8%;
            }
            .destinations-carousel {
                grid-template-columns: repeat(3, 1fr);
            }
            .membership-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 20px 5%;
            }
            .nav-links {
                display: none;
            }
            .hero-title {
                font-size: 38px;
            }
            .search-grid {
                grid-template-columns: 1fr;
            }
            .btn-search {
                grid-column: span 1;
            }
            .features-grid {
                grid-template-columns: 1fr;
            }
            .feature-col-4, .feature-col-6 {
                grid-column: span 1;
            }
            .destinations-carousel {
                grid-template-columns: 1fr;
            }
            .destination-card {
                height: 380px;
            }
            .services-layout {
                grid-template-columns: 1fr;
            }
            .about {
                grid-template-columns: 1fr;
            }
            .about-image {
                height: 300px;
                order: -1;
            }
            .footer-grid {
                grid-template-columns: 1fr;
            }
        }
    </script>
</body>
</html>
