<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stitch Design — 智能充电桩 App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <style>
    :root {
      --primary: #1677FF;
      --primary-50: #E6F4FF;
      --primary-100: #BAE0FF;
      --primary-600: #0958D9;
      --primary-700: #003EB3;
      --success: #52C41A;
      --success-50: #F6FFED;
      --warning: #FA8C16;
      --warning-50: #FFF7E6;
      --error: #FF4D4F;
      --error-50: #FFF1F0;
      --gray-50: #F9FAFB;
      --gray-100: #F2F4F7;
      --gray-200: #EAECF0;
      --gray-300: #D0D5DD;
      --gray-400: #98A2B3;
      --gray-500: #667085;
      --gray-600: #475467;
      --gray-800: #1D2939;
      --gray-900: #101828;
      --white: #FFFFFF;
      /* Shadows — Stitch precision */
      --shadow-xs: 0px 1px 2px rgba(16,24,40,0.05);
      --shadow-sm: 0px 1px 3px rgba(16,24,40,0.10), 0px 1px 2px rgba(16,24,40,0.06);
      --shadow-md: 0px 4px 8px -2px rgba(16,24,40,0.06), 0px 2px 4px -2px rgba(16,24,40,0.04);
      --shadow-lg: 0px 12px 16px -4px rgba(16,24,40,0.08), 0px 4px 6px -2px rgba(16,24,40,0.03);
      --shadow-xl: 0px 20px 24px -4px rgba(16,24,40,0.08), 0px 8px 8px -4px rgba(16,24,40,0.03);
      /* Radii */
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, sans-serif;
      background: linear-gradient(180deg, #EEF2FF 0%, #F5F7FA 50%, #FFFFFF 100%);
      color: var(--gray-900);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    /* ===== Mobile Device Frame (375px centered) ===== */
    .device-frame {
      width: 375px;
      min-height: 812px;
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow:
        0 0 0 11px #1a1a1a,
        0 0 0 13px #333,
        0 25px 60px rgba(0,0,0,0.22),
        0 0 0 44px rgba(255,255,255,0.02);
      overflow: hidden;
      position: relative;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
    }

    /* Notch */
    .device-notch {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 30px;
      background: #1a1a1a;
      border-radius: 0 0 18px 18px;
      z-index: 200;
    }

    /* ===== Status Bar ===== */
    .status-bar {
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-900);
      z-index: 100;
      position: relative;
    }
    .status-left { display: flex; align-items: center; gap: 4px; }
    .status-right { display: flex; align-items: center; gap: 5px; }

    /* ===== App Content ===== */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--gray-50);
    }

    /* Header area */
    .app-header {
      padding: 4px 20px 16px;
      background: linear-gradient(135deg, var(--primary) 0%, #4096FF 100%);
      color: white;
    }
    .ah-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .ah-greeting h3 {
      font-size: 15px; font-weight: 400; opacity: 0.85;
      margin-bottom: 1px;
    }
    .ah-greeting p {
      font-size: 21px; font-weight: 700; letter-spacing: -0.3px;
    }
    .ah-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }

    /* Search input */
    .ah-search {
      position: relative;
    }
    .ah-search input {
      width: 100%; height: 42px;
      border-radius: var(--radius-sm);
      border: none;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(4px);
      color: white;
      font-family: inherit; font-size: 14px;
      padding: 0 16px 0 40px;
      outline: none;
    }
    .ah-search input::placeholder { color: rgba(255,255,255,0.55); }
    .ah-search-icon {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.65); font-size: 17px;
    }

    /* ===== Map Area ===== */
    .map-section {
      position: relative;
      height: 220px;
      background: linear-gradient(160deg, #E8F0FE 0%, #D6E4FF 30%, #F0F5FF 70%, #EFF2FA 100%);
      overflow: hidden;
    }
    /* Map grid */
    .ms-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    /* Roads */
    .ms-road {
      position: absolute; background: rgba(148,162,195,0.3); border-radius: 2px;
    }
    .mr-h1 { width:55%; height:4px; left:8%; top:32%; transform:rotate(-2deg); }
    .mr-h2 { width:45%; height:3px; left:35%; top:58%; transform:rotate(1deg); }
    .mr-v1 { width:3px; height:45%; left:36%; top:15%; }
    .mr-v2 { width:3px; height:35%; left:66%; top:40%; }

    /* Pins */
    .pin {
      position: absolute; width: 12px; height: 12px;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      cursor: pointer; transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
    }
    .pin::after {
      content:''; position:absolute; width:6px; height:6px;
      border-radius:50%; background:white; top:3px; left:3px;
    }
    .pin-green { background:var(--success); box-shadow:0 2px 8px rgba(82,196,26,0.35); }
    .pin-orange { background:var(--warning); box-shadow:0 2px 8px rgba(250,140,22,0.35); }
    .pin-red { background:var(--error); box-shadow:0 2px 8px rgba(255,77,79,0.35); }
    .pin:hover { transform: rotate(-45deg) scale(1.35); z-index:10; }

    .p1{left:22%;top:34%;} .p2{left:56%;top:44%;} .p3{left:40%;top:64%;}
    .p4{left:74%;top:26%;} .p5{left:16%;top:58%;} .p6{left:80%;top:68%;}

    /* Current location */
    .loc-dot-wrap {
      position: absolute; left:44%; top:46%;
    }
    .loc-pulse-ring {
      width:20px; height:20px; border-radius:50%;
      background:var(--primary); opacity:0.15;
      animation: locPulse 2s ease-out infinite;
      position:absolute;
    }
    @keyframes locPulse { 0%{transform:scale(1);opacity:0.15;} 100%{transform:scale(3.5);opacity:0;} }
    .loc-dot-core {
      width:14px; height:14px; border-radius:50%;
      background:var(--primary); border:2.5px solid white;
      position:relative; z-index:2;
      box-shadow:0 2px 6px rgba(22,119,255,0.3);
    }

    /* Battery badge on map */
    .battery-badge {
      position: absolute; right:12px; top:12px;
      background:white; border-radius:var(--radius-md);
      padding: 8px 12px; display:flex;align-items:center;gap:8px;
      box-shadow:var(--shadow-md); z-index:5;
    }
    .bb-ring {
      width:32px; height:32px; position:relative;
    }
    .bb-ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
    .bb-bg{fill:none;stroke:#E8ECF0;stroke-width:3;}
    .bb-fg{fill:none;stroke:var(--success);stroke-width:3;stroke-linecap:round;
      stroke-dasharray:88; stroke-dashoffset:17.6; /* 80% */}
    .bb-text { font-size:12px; font-weight:700; color:var(--gray-800); }

    /* ===== Station List Panel ===== */
    .station-panel {
      flex: 1;
      background: var(--white);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 20px 16px 0;
      margin-top: -16px;
      position: relative;
      z-index: 10;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
    }
    .sp-handle {
      width:32px; height:4px; border-radius:2px;
      background:var(--gray-300); margin:0 auto 16px;
    }
    .sp-header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:14px;
    }
    .sp-title { font-size:17px; font-weight:700; letter-spacing:-0.2px; }
    .sp-count {
      font-size:11px; font-weight:600;
      background:var(--primary-50); color:var(--primary);
      padding:2px 8px; border-radius:10px;
    }
    .sp-filter-row {
      display:flex; gap:8px; margin-bottom:14px; overflow-x:auto;
    }
    .sf-chip {
      padding:6px 14px; border-radius:20px; font-size:12px; font-weight:500;
      white-space:nowrap; cursor:pointer; transition:all 0.15s;
      border:1px solid var(--gray-200); background:var(--white); color:var(--gray-500);
    }
    .sf-chip.active {
      background:var(--primary); color:white; border-color:var(--primary);
    }

    /* Station Card — High fidelity */
    .station-card {
      display:flex; gap:12px; padding:14px;
      background:var(--gray-50); border-radius:var(--radius-md);
      margin-bottom:10px; cursor:pointer; transition:all 0.2s ease;
      border:1.5px solid transparent;
    }
    .station-card:hover {
      border-color:var(--primary-100);
      background:var(--white);
      box-shadow:var(--shadow-sm);
      transform:translateY(-1px);
    }
    .sc-icon-col { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .sc-status-icon {
      width:42px; height:42px; border-radius:var(--radius-sm);
      display:flex; align-items:center; justify-content:center; font-size:19px;
    }
    .sci-available { background:var(--success-50); color:var(--success); }
    .sci-charging { background:var(--warning-50); color:var(--warning); }
    .sci-busy { background:var(--error-50); color:var(--error); }

    .sc-distance-badge {
      font-size:10px; font-weight:600; padding:2px 6px;
      border-radius:4px; background:var(--white);
      color:var(--gray-500); box-shadow:var(--shadow-xs);
    }

    .sc-info-col { flex:1; display:flex; flex-direction:column; justify-content:center; }
    .sc-name { font-size:14px; font-weight:600; color:var(--gray-900); margin-bottom:4px; line-height:1.3; }
    .sc-meta-row { display:flex; gap:10px; flex-wrap:wrap; }
    .sc-meta-item { font-size:11px; color:var(--gray-500); display:flex; align-items:center; gap:3px; }
    .sc-meta-num { font-weight:600; }
    .smn-success { color:var(--success); }
    .smn-primary { color:var(--primary); }

    .sc-action-col { display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:6px; }
    .sc-nav-btn {
      width:34px; height:34px; border-radius:var(--radius-sm);
      background:var(--primary); color:white;
      display:flex; align-items:center; justify-content:center;
      font-size:16px; cursor:pointer; transition:all 0.2s;
    }
    .sc-nav-btn:hover { background:var(--primary-600); transform:scale(1.06); }

    /* ===== Tab Bar ===== */
    .tab-bar {
      display:flex; justify-content:space-around; align-items:flex-end;
      padding:10px 0 24px; background:var(--white);
      border-top:1px solid var(--gray-200); margin-top:14px;
    }
    .tab-item { display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
    .tab-icon { font-size:22px; color:var(--gray-400); transition:color 0.2s; }
    .tab-label { font-size:10px; font-weight:500; color:var(--gray-400); transition:color 0.2s; }
    .tab-item.active .tab-icon, .tab-item.active .tab-label { color:var(--primary); }
    .tab-scan-btn {
      width:48px; height:48px; border-radius:14px;
      background:linear-gradient(135deg, var(--primary), #59A1FF);
      color:white; display:flex; align-items:center; justify-content:center;
      font-size:24px; box-shadow:0 4px 14px rgba(22,119,255,0.3);
      margin-top:-22px;
    }
  </style>
</head>
<body>

<div class="device-frame">

  <!-- Device notch -->
  <div class="device-notch"></div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left"><span>23:56</span></div>
    <div class="status-right">
      <span class="iconify" data-icon="mdi:signal-cellular-3" style="font-size:15px;"></span>
      <span class="iconify" data-icon="mdi:wifi-strength-3" style="font-size:15px;"></span>
      <span class="iconify" data-icon="mdi:battery-70" style="font-size:16px;"></span>
    </div>
  </div>

  <!-- App -->
  <div class="app-content">

    <!-- Header with gradient -->
    <header class="app-header">
      <div class="ah-top">
        <div class="ah-greeting">
          <h3>Good Evening</h3>
          <p>袁先生，晚上好</p>
        </div>
        <div class="ah-avatar">袁</div>
      </div>
      <div class="ah-search">
        <span class="iconify ah-search-icon" data-icon="mdi:magnify"></span>
        <input type="text" placeholder="您想去哪里充电？">
      </div>
    </header>

    <!-- Map -->
    <section class="map-section">
      <div class="ms-grid"></div>
      <div class="ms-road mr-h1"></div><div class="ms-road mr-h2"></div>
      <div class="ms-road mr-v1"></div><div class="ms-road mr-v2"></div>

      <!-- Pins -->
      <div class="pin pin-green p1"></div>
      <div class="pin pin-orange p2"></div>
      <div class="pin pin-green p3"></div>
      <div class="pin pin-red p4"></div>
      <div class="pin pin-green p5"></div>
      <div class="pin pin-orange p6"></div>

      <!-- Location -->
      <div class="loc-dot-wrap">
        <div class="loc-pulse-ring"></div>
        <div class="loc-dot-core"></div>
      </div>

      <!-- Battery overlay -->
      <div class="battery-badge">
        <div class="bb-ring">
          <svg viewBox="0 0 32 32">
            <circle class="bb-bg" cx="16" cy="16" r="14"/>
            <circle class="bb-fg" cx="16" cy="16" r="14"/>
          </svg>
          <span class="bb-text">80%</span>
        </div>
      </div>
    </section>

    <!-- Station panel -->
    <div class="station-panel">
      <div class="sp-handle"></div>
      <div class="sp-header">
        <span class="sp-title">附近站点</span>
        <span class="sp-count">6 个可用</span>
      </div>

      <!-- Filter chips -->
      <div class="sp-filter-row">
        <div class="sf-chip active">全部</div>
        <div class="sf-chip">空闲</div>
        <div class="sf-chip">充电中</div>
        <div class="sf-chip">超充</div>
        <div class="sf-chip">快充</div>
      </div>

      <!-- Station cards -->
      <div class="station-card">
        <div class="sc-icon-col">
          <div class="sc-status-icon sci-available"><span class="iconify" data-icon="mdi:ev-station"></span></div>
          <span class="sc-distance-badge">0.8km</span>
        </div>
        <div class="sc-info-col">
          <div class="sc-name">世纪大道超充站</div>
          <div class="sc-meta-row">
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:battery-charging-high"></span> 空闲 <span class="sc-meta-num smn-success">8</span></span>
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:currency-cny"></span> <span class="sc-meta-num smn-primary">¥1.28</span>/度</span>
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:speedometer"></span> 120kW</span>
          </div>
        </div>
        <div class="sc-action-col">
          <div class="sc-nav-btn"><span class="iconify" data-icon="mdi:navigation-variant-outline"></span></div>
        </div>
      </div>

      <div class="station-card">
        <div class="sc-icon-col">
          <div class="sc-status-icon sci-charging"><span class="iconify" data-icon="mdi:ev-station"></span></div>
          <span class="sc-distance-badge">1.2km</span>
        </div>
        <div class="sc-info-col">
          <div class="sc-name">万达广场快充站</div>
          <div class="sc-meta-row">
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:battery-charging-high"></span> 空闲 <span class="sc-meta-num smn-success">3</span></span>
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:currency-cny"></span> <span class="sc-meta-num smn-primary">¥1.45</span>/度</span>
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:speedometer"></span> 60kW</span>
          </div>
        </div>
        <div class="sc-action-col">
          <div class="sc-nav-btn"><span class="iconify" data-icon="mdi:navigation-variant-outline"></span></div>
        </div>
      </div>

      <div class="station-card">
        <div class="sc-icon-col">
          <div class="sc-status-icon sci-available"><span class="iconify" data-icon="mdi:ev-station"></span></div>
          <span class="sc-distance-badge">2.5km</span>
        </div>
        <div class="sc-info-col">
          <div class="sc-name">高新区科技园站</div>
          <div class="sc-meta-row">
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:battery-charging-high"></span> 空闲 <span class="sc-meta-num smn-success">12</span></span>
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:currency-cny"></span> <span class="sc-meta-num smn-primary">¥1.15</span>/度</span>
            <span class="sc-meta-item"><span class="iconify" style="font-size:12px;" data-icon="mdi:speedometer"></span> 180kW</span>
          </div>
        </div>
        <div class="sc-action-col">
          <div class="sc-nav-btn"><span class="iconify" data-icon="mdi:navigation-variant-outline"></span></div>
        </div>
      </div>

      <!-- Tab Bar -->
      <nav class="tab-bar">
        <div class="tab-item active">
          <span class="iconify tab-icon" data-icon="mdi:home-variant"></span>
          <span class="tab-label">首页</span>
        </div>
        <div class="tab-item">
          <span class="iconify tab-icon" data-icon="mdi:tag-outline"></span>
          <span class="tab-label">优惠</span>
        </div>
        <div class="tab-item">
          <div class="tab-scan-btn"><span class="iconify" data-icon="mdi:qrcode-scan"></span></div>
        </div>
        <div class="tab-item">
          <span class="iconify tab-icon" data-icon="mdi:clipboard-list-outline"></span>
          <span class="tab-label">订单</span>
        </div>
        <div class="tab-item">
          <span class="iconify tab-icon" data-icon="mdi:account-circle-outline"></span>
          <span class="tab-label">我的</span>
        </div>
      </nav>
    </div>

  </div>
</div>

</body>
</html>
