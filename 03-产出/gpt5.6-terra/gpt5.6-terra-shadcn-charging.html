4px solid var(--bg);display:grid;place-items:center}.nav .active{color:var(--primary);font-weight:800}.overlay{position:fixed;inset:0;background:#0f172a66;display:none;z-index:7;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.modal{background:white;width:min(100%,430px);border-radius:22px 22px 0 0;padding:22px;animation:up .2s}.modal h2{margin:0 0 6px;font-size:20px}.mode{display:flex;gap:7px;margin:18px 0}.mode button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;flex:1;font-size:12px}.mode button.active{border-color:var(--primary);background:var(--pale);color:var(--primary);font-weight:800}.summary{background:var(--bg);border-radius:11px;padding:12px;color:var(--muted);margin-bottom:16px}.summary b{display:block;color:var(--fg);font-size:16px;margin-top:2px}@keyframes up{from{transform:translateY(80px)}to{transform:translateY(0)}}.toast{position:fixed;left:50%;top:30px;transform:translate(-50%,-130px);background:#172033;color:white;border-radius:9px;padding:10px 13px;z-index:9;transition:.25s}.toast.show{transform:translate(-50%,0)}

-lucide="badge-percent"></i>省钱</button><button class="scan" onclick="openCharge('扫码识别充电桩')"><i data-lucide="scan-line"></i></button><button onclick="toast('当前没有充电中的订单')"><i data-lucide="receipt-text"></i>订单</button><button onclick="toast('我的页面即将打开')"><i data-lucide="user-round"></i>我的</button></nav></div><div class="overlay" id="overlay"><section class="modal"><div class="handle"></div><h2 id="modalTitle">扫码启动充电</h2><p style="color:var(--muted);margin-top:0">已识别 01 号直流充电桩 · 2 号枪</p><div class="mode"><button class="active">按金额</button><button>按电量</button><button>充满为止</button></div><div class="summary">预计支付金额<b>¥ 20.00</b></div><button class="btn" style="width:100%;justify-content:center;padding:12px" onclick="startCharge()">确认启动充电</button><button onclick="closeCharge()" style="width:100%;border:0;background:transparent;color:var(--muted);padding:13px">取消</button></section></div><div class="toast" id="toast"></div><script>lucide.createIcons();let O=document.querySelector('#overlay');function openCharge(s){document.querySelector('#modalTitle').textContent=s;O.classList.add('show')}function closeCharge(){O.classList.remove('show')}function startCharge(){closeCharge();toast('启动指令已发送，正在连接充电桩')}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}document.querySelectorAll('.tab,.mode button').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('button').forEach(y=>y.classList.remove('active'));x.classList.add('active')})</script></body></html>
