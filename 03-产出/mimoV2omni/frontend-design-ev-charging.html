<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电动汽车充电小程序 - 绿能充电</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1677FF;
            --success-green: #52C41A;
            --warning-orange: #FA8C16;
            --danger-red: #FF4D4F;
            --dark-text: #1F1F1F;
            --light-text: #8C8C8C;
            --border-color: #F0F0F0;
            --card-bg: #FFFFFF;
            --page-bg: #F5F7FA;
            --gradient-blue-green: linear-gradient(135deg, #1677FF 0%, #52C41A 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--page-bg);
            color: var(--dark-text);
            line-height: 1.6;
            max-width: 428px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        /* Header */
        .header {
            background: var(--gradient-blue-green);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(22, 119, 255, 0.15);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .location {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
        }
        
        .location-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        
        .search-bar {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            width: 100%;
            margin-top: 16px;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
        
        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Main Content */
        .main-content {
            padding: 16px;
        }
        
        /* Banner */
        .banner {
            background: var(--gradient-blue-green);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            color: white;
        }
        
        .banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 4s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        
        .banner h2 {
            font-size: 24px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        
        .banner p {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        /* Map Section */
        .map-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .view-all {
            color: var(--primary-blue);
            font-size: 14px;
            text-decoration: none;
        }
        
        .map-placeholder {
            height: 200px;
            background: linear-gradient(135deg, #E6F7FF 0%, #F0F9E6 100%);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed var(--border-color);
            margin-bottom: 16px;
        }
        
        .map-icon {
            width: 48px;
            height: 48px;
            fill: var(--primary-blue);
            margin-bottom: 12px;
        }
        
        .map-text {
            color: var(--light-text);
            font-size: 14px;
        }
        
        .station-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .station-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--page-bg);
            border-radius: 12px;
            border-left: 4px solid var(--success-green);
        }
        
        .station-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .station-info p {
            font-size: 13px;
            color: var(--light-text);
        }
        
        .station-status {
            text-align: right;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .status-available {
            background: #F6FFED;
            color: var(--success-green);
            border: 1px solid #B7EB8F;
        }
        
        .status-charging {
            background: #FFF7E6;
            color: var(--warning-orange);
            border: 1px solid #FFD591;
        }
        
        .station-price {
            font-size: 13px;
            color: var(--primary-blue);
            font-weight: 500;
        }
        
        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 8px;
            background: var(--card-bg);
            border-radius: 12px;
            text-decoration: none;
            color: var(--dark-text);
            transition: transform 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .action-item:hover {
            transform: translateY(-2px);
        }
        
        .action-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
            fill: var(--primary-blue);
        }
        
        .action-text {
            font-size: 12px;
            text-align: center;
        }
        
        /* Membership Section */
        .membership-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .membership-card {
            background: linear-gradient(135deg, #1F1F1F 0%, #303030 100%);
            border-radius: 12px;
            padding: 20px;
            color: white;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        
        .membership-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255, 215, 0, 0.1) 50%, transparent 60%);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        
        .membership-level {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        
        .membership-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .membership-benefits {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .benefit-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .membership-price {
            text-align: center;
            margin-top: 16px;
        }
        
        .price-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-blue);
        }
        
        .price-unit {
            font-size: 14px;
            color: var(--light-text);
        }
        
        /* Carbon Credits Section */
        .carbon-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .carbon-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .carbon-icon {
            width: 40px;
            height: 40px;
            fill: var(--success-green);
        }
        
        .carbon-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        
        .carbon-info p {
            font-size: 13px;
            color: var(--light-text);
        }
        
        .carbon-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        
        .stat-card {
            background: var(--page-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--success-green);
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--light-text);
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            max-width: 428px;
            margin: 0 auto;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--light-text);
            font-size: 12px;
        }
        
        .nav-item.active {
            color: var(--primary-blue);
        }
        
        .nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
        }
        
        .scan-button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient-blue-green);
            border: none;
            margin-top: -28px;
            box-shadow: 0 4px 12px rgba(22, 119, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .scan-button:hover {
            transform: scale(1.05);
        }
        
        .scan-icon {
            width: 32px;
            height: 32px;
            fill: white;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="location">
                <svg class="location-icon" viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <span>北京市 · 海淀区</span>
            </div>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
            </svg>
        </div>
        <input type="text" class="search-bar" placeholder="搜索附近充电站、地点...">
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Banner -->
        <div class="banner">
            <h2>新能源充电新体验</h2>
            <p>扫码即充 · 实时桩态 · 会员优惠</p>
        </div>
        
        <!-- Quick Actions -->
        <div class="quick-actions">
            <a href="#" class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <span class="action-text">地图找桩</span>
            </a>
            <a href="#" class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
                </svg>
                <span class="action-text">我的账户</span>
            </a>
            <a href="#" class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24">
                    <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                </svg>
                <span class="action-text">充值</span>
            </a>
            <a href="#" class="action-item">
                <svg class="action-icon" viewBox="0 0 24 24">
                    <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>
                </svg>
                <span class="action-text">碳积分</span>
            </a>
        </div>
        
        <!-- Map Section -->
        <div class="map-section">
            <div class="section-header">
                <h3 class="section-title">附近充电站</h3>
                <a href="#" class="view-all">查看全部</a>
            </div>
            
            <div class="map-placeholder">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <span class="map-text">地图加载中...</span>
            </div>
            
            <div class="station-list">
                <div class="station-card">
                    <div class="station-info">
                        <h4>国家电网充电站</h4>
                        <p>海淀区中关村大街1号 · 1.2km</p>
                    </div>
                    <div class="station-status">
                        <span class="status-badge status-available">空闲 8/12</span>
                        <div class="station-price">¥1.2/度</div>
                    </div>
                </div>
                
                <div class="station-card" style="border-left-color: var(--warning-orange);">
                    <div class="station-info">
                        <h4>特来电充电站</h4>
                        <p>海淀区科学院南路2号 · 0.8km</p>
                    </div>
                    <div class="station-status">
                        <span class="status-badge status-charging">充电中 10/12</span>
                        <div class="station-price">¥1.5/度</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Membership Section -->
        <div class="membership-section">
            <div class="section-header">
                <h3 class="section-title">PLUS会员</h3>
                <a href="#" class="view-all">了解详情</a>
            </div>
            
            <div class="membership-card">
                <div class="membership-level">当前等级</div>
                <div class="membership-name">银卡会员</div>
                <div class="membership-benefits">
                    <span class="benefit-tag">充电6折起</span>
                    <span class="benefit-tag">每月5张券</span>
                    <span class="benefit-tag">停车减免</span>
                    <span class="benefit-tag">优先客服</span>
                </div>
            </div>
            
            <div class="membership-price">
                <div class="price-value">¥9.9</div>
                <div class="price-unit">每月，预计可省¥50</div>
            </div>
        </div>
        
        <!-- Carbon Credits Section -->
        <div class="carbon-section">
            <div class="carbon-header">
                <svg class="carbon-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <div class="carbon-info">
                    <h3>碳积分中心</h3>
                    <p>每次充电都在为环保做贡献</p>
                </div>
            </div>
            
            <div class="carbon-stats">
                <div class="stat-card">
                    <div class="stat-value">128</div>
                    <div class="stat-label">累计碳积分</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--primary-blue);">56</div>
                    <div class="stat-label">减少碳排放(kg)</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            <span>首页</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
            </svg>
            <span>优惠</span>
        </a>
        <a href="#" class="nav-item">
            <button class="scan-button">
                <svg class="scan-icon" viewBox="0 0 24 24">
                    <path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5z"/>
                </svg>
            </button>
            <span style="margin-top: 32px;">扫码</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <span>订单</span>
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>我的</span>
        </a>
    </div>
</body>
</html>
