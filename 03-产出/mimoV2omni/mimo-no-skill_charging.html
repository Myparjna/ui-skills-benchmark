<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广知科技 - 设置页面</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .toggle-switch {
            position: relative;
            width: 48px;
            height: 24px;
            background: #374151;
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .toggle-switch.active {
            background: #8b5cf6;
        }
        
        .toggle-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        
        .toggle-switch.active .toggle-knob {
            transform: translateX(24px);
        }
        
        .sidebar-item {
            transition: all 0.2s ease;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        
        .sidebar-item.active {
            background: rgba(139, 92, 246, 0.2);
            border-left: 3px solid #8b5cf6;
        }
        
        .input-focus:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex">
        <!-- 侧边栏 -->
        <aside class="w-64 glass-card h-screen fixed left-0 top-0 border-r border-gray-700">
            <div class="p-6">
                <h1 class="text-xl font-bold mb-8 text-white">设置</h1>
                
                <nav class="space-y-2">
                    <a href="#" class="sidebar-item active flex items-center px-4 py-3 rounded-lg text-white">
                        <i data-lucide="user" class="w-5 h-5 mr-3"></i>
                        个人资料
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="bell" class="w-5 h-5 mr-3"></i>
                        通知
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="lock" class="w-5 h-5 mr-3"></i>
                        隐私
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="shield" class="w-5 h-5 mr-3"></i>
                        安全
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="credit-card" class="w-5 h-5 mr-3"></i>
                        账单
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="palette" class="w-5 h-5 mr-3"></i>
                        外观
                    </a>
                </nav>
            </div>
            
            <div class="absolute bottom-0 left-0 right-0 p-6">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 mr-3"></div>
                    <div>
                        <div class="text-sm font-medium text-white">张三</div>
                        <div class="text-xs text-gray-400">管理员</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- 主内容 -->
        <main class="flex-1 ml-64 p-8">
            <div class="max-w-4xl mx-auto">
                <!-- 页面标题 -->
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-white mb-2">个人资料</h2>
                    <p class="text-gray-400">管理您的个人信息和偏好设置</p>
                </div>
                
                <!-- 头像部分 -->
                <div class="glass-card rounded-xl p-6 mb-6">
                    <h3 class="text-lg font-semibold text-white mb-4">头像</h3>
                    <div class="flex items-center">
                        <div class="w-20 h-20 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 flex items-center justify-center text-white text-2xl font-bold mr-6">
                            张
                        </div>
                        <div>
                            <button class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg text-white text-sm font-medium transition-colors mr-3">
                                上传头像
                            </button>
                            <button class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white text-sm font-medium transition-colors">
                                移除
                            </button>
                            <p class="text-gray-400 text-sm mt-2">支持 JPG、PNG 格式，大小不超过 2MB</p>
                        </div>
                    </div>
                </div>
                
                <!-- 基本信息 -->
                <div class="glass-card rounded-xl p-6 mb-6">
                    <h3 class="text-lg font-semibold text-white mb-4">基本信息</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">姓名</label>
                            <input type="text" value="张三" class="input-focus w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white transition-all">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">邮箱</label>
                            <input type="email" value="zhangsan@guangzhi.tech" class="input-focus w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white transition-all">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">手机号</label>
                            <input type="tel" value="+86 138 0000 0000" class="input-focus w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white transition-all">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">职位</label>
                            <input type="text" value="高级前端工程师" class="input-focus w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white transition-all">
                        </div>
                        
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-400 mb-2">个人简介</label>
                            <textarea rows="3" class="input-focus w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white transition-all resize-none">热爱技术，专注于AI应用开发和用户体验设计。拥有10年前端开发经验，熟悉React、Vue、TypeScript等技术栈。</textarea>
                        </div>
                    </div>
                </div>
                
                <!-- 偏好设置 -->
                <div class="glass-card rounded-xl p-6 mb-6">
                    <h3 class="text-lg font-semibold text-white mb-4">偏好设置</h3>
                    
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="text-white font-medium">接收产品更新邮件</h4>
                                <p class="text-gray-400 text-sm">接收关于新功能和改进的邮件通知</p>
                            </div>
                            <div class="toggle-switch active" onclick="this.classList.toggle('active')">
                                <div class="toggle-knob"></div>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="text-white font-medium">启用双因素认证</h4>
                                <p class="text-gray-400 text-sm">为您的账户增加额外的安全保护</p>
                            </div>
                            <div class="toggle-switch" onclick="this.classList.toggle('active')">
                                <div class="toggle-knob"></div>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="text-white font-medium">公开个人资料</h4>
                                <p class="text-gray-400 text-sm">允许其他用户查看您的个人资料</p>
                            </div>
                            <div class="toggle-switch active" onclick="this.classList.toggle('active')">
                                <div class="toggle-knob"></div>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="text-white font-medium">显示在线状态</h4>
                                <p class="text-gray-400 text-sm">在团队中显示您的在线状态</p>
                            </div>
                            <div class="toggle-switch active" onclick="this.classList.toggle('active')">
                                <div class="toggle-knob"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 语言和时区 -->
                <div class="glass-card rounded-xl p-6 mb-6">
                    <h3 class="text-lg font-semibold text-white mb-4">语言和时区</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">语言</label>
                            <select class="input-focus w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white transition-all appearance-none">
                                <option>简体中文</option>
                                <option>English</option>
                                <option>日本語</option>
                                <option>한국어</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">时区</label>
                            <select class="input-focus w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white transition-all appearance-none">
                                <option>UTC+8 北京时间</option>
                                <option>UTC+0 格林威治时间</option>
                                <option>UTC-5 美国东部时间</option>
                                <option>UTC-8 美国太平洋时间</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="flex justify-end space-x-4">
                    <button class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-white font-medium transition-colors">
                        取消
                    </button>
                    <button class="px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded-lg text-white font-medium transition-colors">
                        保存更改
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // 侧边栏点击效果
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // 保存按钮点击效果
        document.querySelector('button:last-of-type').addEventListener('click', function() {
            this.textContent = '已保存 ✓';
            this.classList.remove('bg-purple-600', 'hover:bg-purple-700');
            this.classList.add('bg-green-600', 'hover:bg-green-700');
            
            setTimeout(() => {
                this.textContent = '保存更改';
                this.classList.remove('bg-green-600', 'hover:bg-green-700');
                this.classList.add('bg-purple-600', 'hover:bg-purple-700');
            }, 2000);
        });
    </script>
</body>
</html>
