<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>充电桩 - 扫码充电 即扫即走</title>
<style>
:root {
  --primary: oklch(0.55 0.2 250);
  --primary-light: oklch(0.7 0.16 250);
  --primary-dark: oklch(0.45 0.18 250);
  --success: oklch(0.65 0.18 145);
  --warning: oklch(0.75 0.16 75);
  --danger: oklch(0.6 0.22 25);
  --bg: oklch(0.97 0.01 250);
  --surface: oklch(1 0 0);
  --text-primary: oklch(0.2 0.02 250);
  --text-secondary: oklch(0.45 0.02 250);
  --text-tertiary: oklch(0.65 0.02 250);
  --border: oklch(0.92 0.01 250);
  --shadow-sm: 0 2px 8px oklch(0.2 0.02 250 / 0.06);
  --shadow-md: 0 4px 16px oklch(0.2 0.02 250 / 0.1);
  --shadow-lg: 0 8px 32px oklch(0.2 0.02 250 / 0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  background: #e8e8e8;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Phone Frame */
.phone {
  width: 390px;
  height: 844px;
  background: var(--bg);
  border-radius: 40px;
  box-shadow: 0 24px 60px oklch(0 0 0 / 0.18), 0 0 0 10px #1a1a1a;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Status Bar */
.status-bar {
  height: 44px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

/* Header */
.header {
  background: var(--surface);
  padding: 12px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.location {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 600;
}

.location-icon {
  width: 18px;
  height: 18px;
  color: var(--primary);
}

.header-actions {
  display: flex;
  gap: 12px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  transition: all var(--transition);
}

.icon-btn:active {
  transform: scale(0.95);
  background: var(--border);
}

.icon-btn svg {
  width: 18px;
  height: 18px;
  color: var(--text-secondary);
}

/* Search Bar */
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg);
  border-radius: var(--radius-md);
}

.search-bar svg {
  width: 16px;
  height: 16px;
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.search-bar input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 14px;
  outline: none;
  font-family: inherit;
}

.search-bar input::placeholder {
  color: var(--text-tertiary);
}

/* Main Content */
.content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 80px;
}

/* Map Section */
.map-section {
  position: relative;
  height: 280px;
  background: linear-gradient(135deg, oklch(0.92 0.02 250), oklch(0.88 0.03 250));
  overflow: hidden;
}

.map-placeholder {
  width: 100%;
  height: 100%;
  position: relative;
}

.map-grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(oklch(0.85 0.02 250 / 0.3) 1px, transparent 1px),
    linear-gradient(90deg, oklch(0.85 0.02 250 / 0.3) 1px, transparent 1px);
  background-size: 40px 40px;
}

.map-pin {
  position: absolute;
  width: 40px;
  height: 40px;
  background: var(--primary);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
  animation: bounce 2s infinite;
}

.map-pin svg {
  width: 18px;
  height: 18px;
  color: white;
  transform: rotate(45deg);
}

.map-pin:nth-child(2) {
  top: 30%;
  left: 25%;
  animation-delay: 0.3s;
}

.map-pin:nth-child(3) {
  top: 50%;
  right: 30%;
  animation-delay: 0.6s;
}

.map-pin:nth-child(4) {
  bottom: 25%;
  left: 40%;
  animation-delay: 0.9s;
}

@keyframes bounce {
  0%, 100% { transform: rotate(-45deg) translateY(0); }
  50% { transform: rotate(-45deg) translateY(-8px); }
}

.map-controls {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.map-btn {
  width: 40px;
  height: 40px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  border: none;
  cursor: pointer;
}

.map-btn svg {
  width: 18px;
  height: 18px;
  color: var(--text-secondary);
}

/* Quick Actions */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding: 20px;
  background: var(--surface);
  margin-top: -20px;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  position: relative;
  z-index: 10;
}

.action-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 12px 8px;
  background: var(--bg);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition);
}

.action-item:active {
  transform: scale(0.95);
  background: var(--border);
}

.action-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
}

.action-icon svg {
  width: 22px;
  height: 22px;
}

.action-icon.scan {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
}

.action-icon.wallet {
  background: oklch(0.92 0.08 145);
  color: var(--success);
}

.action-icon.vehicle {
  background: oklch(0.92 0.08 75);
  color: var(--warning);
}

.action-icon.member {
  background: oklch(0.92 0.08 25);
  color: var(--danger);
}

.action-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}

/* Section */
.section {
  padding: 20px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.section-title {
  font-size: 17px;
  font-weight: 600;
}

.section-more {
  font-size: 13px;
  color: var(--primary);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
}

.section-more svg {
  width: 14px;
  height: 14px;
}

/* Membership Banner */
.membership-banner {
  margin: 0 20px 20px;
  padding: 20px;
  background: linear-gradient(135deg, oklch(0.25 0.15 250), oklch(0.35 0.18 250));
  border-radius: var(--radius-lg);
  color: white;
  position: relative;
  overflow: hidden;
}

.membership-banner::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, oklch(0.7 0.2 250 / 0.3), transparent);
  border-radius: 50%;
}

.membership-content {
  position: relative;
  z-index: 1;
}

.membership-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: oklch(0.75 0.18 80);
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 12px;
}

.membership-badge svg {
  width: 12px;
  height: 12px;
}

.membership-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 6px;
}

.membership-desc {
  font-size: 13px;
  opacity: 0.85;
  margin-bottom: 16px;
}

.membership-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: white;
  color: var(--primary-dark);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: all var(--transition);
}

.membership-btn:active {
  transform: scale(0.95);
}

.membership-btn svg {
  width: 14px;
  height: 14px;
}

/* Station List */
.station-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.station-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all var(--transition);
}

.station-card:active {
  transform: scale(0.98);
  box-shadow: var(--shadow-md);
}

.station-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}

.station-info {
  flex: 1;
}

.station-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}

.station-address {
  font-size: 12px;
  color: var(--text-tertiary);
}

.station-distance {
  font-size: 13px;
  color: var(--primary);
  font-weight: 500;
}

.station-stats {
  display: flex;
  gap: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}

.stat-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.stat-dot.available {
  background: var(--success);
}

.stat-dot.busy {
  background: var(--warning);
}

.stat-dot.offline {
  background: var(--text-tertiary);
}

.stat-item svg {
  width: 12px;
  height: 12px;
}

/* Bottom Navigation */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 16px;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
}

.tab-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  background: var(--primary);
  border-radius: 0 0 3px 3px;
}

.tab-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-tertiary);
}

.tab-item.active .tab-icon {
  color: var(--primary);
}

.tab-icon svg {
  width: 20px;
  height: 20px;
}

.tab-label {
  font-size: 11px;
  color: var(--text-tertiary);
}

.tab-item.active .tab-label {
  color: var(--primary);
  font-weight: 600;
}

/* Scan Button (Center) */
.scan-btn {
  position: relative;
  top: -20px;
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  transition: all var(--transition);
}

.scan-btn:active {
  transform: scale(0.92);
}

.scan-btn svg {
  width: 26px;
  height: 26px;
  color: white;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.station-card {
  animation: fadeIn 300ms ease-out both;
}

.station-card:nth-child(1) { animation-delay: 50ms; }
.station-card:nth-child(2) { animation-delay: 100ms; }
.station-card:nth-child(3) { animation-delay: 150ms; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

// Tab switching

    tab.classList.add('active');
  });
});

// Scan button

scanBtn.addEventListener('click', () => {
  alert('打开扫码功能');
});

// Station card click
const stationCards = document.querySelectorAll('.station-card');
stationCards.forEach(card => {
  card.addEventListener('click', () => {
    const name = card.querySelector('.station-name').textContent;
    alert(`查看 ${name} 详情`);
  });
});

// Action items
const actionItems = document.querySelectorAll('.action-item');
actionItems.forEach(item => {
  item.addEventListener('click', () => {
    const label = item.querySelector('.action-label').textContent;
    alert(`打开${label}`);

});

});
