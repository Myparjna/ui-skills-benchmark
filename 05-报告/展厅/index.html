      if (model === 'mimoV25') {
        return {
          airline: `mimoV25-${catId}-airline.html`,
          charging: `mimoV25-${catId}-ev-charging.html`,
          bikeops: `mimoV25-${catId}-bike-dashboard.html`
        };
      }
      if (model === 'm3') {
        return {
          airline: `m3_${catId}_airline.html`,
          charging: `m3_${catId}_ev_charging.html`,
          bikeops: `m3_${catId}_fleet_ops.html`
        };
      }
      if (model === 'deepseek') {
        return {
          airline: `deepseek-${catId}-airline.html`,
          charging: `deepseek-${catId}-ev-charging.html`,
          bikeops: `deepseek-${catId}-bike-dashboard.html`
        };
      }
      if (model === 'kimiK26') {
        return {
          airline: `kimi-k2.6-${catId}-airline.html`,
          charging: `kimi-k2.6-${catId}-charging.html`,
          bikeops: `kimi-k2.6-${catId}-bikeops.html`
        };
      }
      return {};
    }

    function buildItems(model, categories) {
      const items = [];
      const basePath = './pages/';
      categories.forEach(cat => {
        const map = getFileMap(model, cat.id);
        Object.keys(map).forEach(prodKey => {
          const filename = map[prodKey];
          items.push({
            id: (model + '_' + filename.replace('.html', '')),
            model: model,
            categoryId: cat.id,
            categoryName: cat.name,
            categorySource: cat.source,
            productKey: prodKey,
            productLabel: productLabels[prodKey],
            filename: filename,
            desc: cat.desc,
            install: cat.install,
            skillsUrl: cat.skillsUrl,
            screenshot: screenshotBase + filename.replace('.html', '.png'),
            url: basePath + filename
          });
        });
      });
      return items;
    }

    function getAllItems() {
      return [
        ...buildItems('kimi', kimiCategories),
        ...buildItems('mimo', mimoCategories),
        ...buildItems('glm', glmCategories),
        ...buildItems('gemini3', gemini3Categories),
        ...buildItems('gemini35', gemini35Categories),
        ...buildItems('mimoV25', mimoV25Categories),
        ...buildItems('m3', m3Categories),
        ...buildItems('deepseek', deepseekCategories),
        ...buildItems('kimiK26', kimiK26Categories)
      ];
    }

    function getLikes() { try { return JSON.parse(localStorage.getItem('skillShowcaseLikes') || '{}'); } catch { return {}; } }
    function setLike(id, count) { const likes = getLikes(); likes[id] = count; localStorage.setItem('skillShowcaseLikes', JSON.stringify(likes)); }
    function getLikeCount(id) { return getLikes()[id] || 0; }

    let activeModel = 'all';
    let activeTab = 'airline';
    let activeChip = 'all';

    function saveFilters() {
      try {
        localStorage.setItem('skillShowcaseFilters', JSON.stringify({ model: activeModel, tab: activeTab, chip: activeChip }));
      } catch {}
    }
    function loadFilters() {
      try {
        const saved = JSON.parse(localStorage.getItem('skillShowcaseFilters') || '{}');
        if (saved.model && ['all','kimi','mimo','glm','gemini3','gemini35','mimoV25','m3','deepseek','kimiK26'].includes(saved.model)) activeModel = saved.model;
        if (saved.tab && ['all','airline','charging','bikeops'].includes(saved.tab)) activeTab = saved.tab;
        if (saved.chip) activeChip = saved.chip;
      } catch {}
    }

    function getCurrentCategories() {
      if (activeModel === 'kimi') return kimiCategories;
      if (activeModel === 'mimo') return mimoCategories;
      if (activeModel === 'glm') return glmCategories;
      if (activeModel === 'gemini3') return gemini3Categories;
      if (activeModel === 'gemini35') return gemini35Categories;
      if (activeModel === 'mimoV25') return mimoV25Categories;
      if (activeModel === 'm3') return m3Categories;
      if (activeModel === 'deepseek') return deepseekCategories;
      if (activeModel === 'kimiK26') return kimiK26Categories;
      // 'all': merge and deduplicate by id, keeping order from common + kimi extras
      const map = new Map();
      [...kimiCategories, ...mimoCategories, ...glmCategories, ...gemini3Categories, ...gemini35Categories, ...mimoV25Categories, ...m3Categories, ...deepseekCategories].forEach(c => {
        if (!map.has(c.id)) map.set(c.id, c);
      });
      return Array.from(map.values());
    }

    function getCurrentItems() {
      if (activeModel === 'all') {
        let all = getAllItems();
        if (activeTab !== 'all') {
          all = all.filter(i => i.productKey === activeTab);
        }
        if (activeChip !== 'all') {
          all = all.filter(i => i.categoryName === activeChip);
        }
        return all;
      }
      const items = buildItems(activeModel, getCurrentCategories());
      if (activeTab !== 'all') {
        return items.filter(i => i.productKey === activeTab);
      }
      if (activeChip !== 'all') {
        return items.filter(i => i.categoryId === activeChip);
      }
      return items;
    }

    function updateModels() {
      document.querySelectorAll('.model-btn').forEach(btn => {
        if (btn.dataset.model === activeModel) {
          btn.classList.remove('model-inactive'); btn.classList.add('model-active');
          btn.style.border = 'none';
        } else {
          btn.classList.remove('model-active'); btn.classList.add('model-inactive');
        }
      });
    }

    function updateTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.tab === activeTab) {
          btn.classList.remove('tab-inactive'); btn.classList.add('tab-active');
          btn.style.border = 'none';
        } else {
          btn.classList.remove('tab-active'); btn.classList.add('tab-inactive');
        }
      });
    }

    function renderChips() {
      const chipContainer = document.getElementById('chipContainer');
      chipContainer.innerHTML = '';
      const allBtn = document.createElement('button');
      allBtn.className = 'chip-btn px-2 py-0.5 text-[10px] font-medium border border-[#1a1a1a] bg-[#1a1a1a] text-white transition';
      allBtn.textContent = '全部来源';
      allBtn.dataset.filter = 'all';
      chipContainer.appendChild(allBtn);

      const cats = getCurrentCategories();
      if (activeModel === 'all') {
        const seen = new Set();
        cats.forEach(cat => {
          if (seen.has(cat.name)) return;
          seen.add(cat.name);
          const btn = document.createElement('button');
          btn.className = 'chip-btn px-2 py-0.5 text-[10px] font-medium border border-[#ddd] bg-white text-[#444] hover:border-[#999] transition';
          btn.textContent = cat.name;
          btn.dataset.filter = cat.name;
          chipContainer.appendChild(btn);
        });
      } else {
        cats.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'chip-btn px-2 py-0.5 text-[10px] font-medium border border-[#ddd] bg-white text-[#444] hover:border-[#999] transition';
          btn.textContent = cat.name;
          btn.dataset.filter = cat.id;
          chipContainer.appendChild(btn);
        });
      }

      chipContainer.querySelectorAll('.chip-btn').forEach(btn => {
        const isActive = btn.dataset.filter === activeChip;
        if (isActive) {
          btn.classList.remove('bg-white', 'text-[#444]', 'border-[#ddd]');
          btn.classList.add('bg-[#1a1a1a]', 'text-white', 'border-[#1a1a1a]');
        }
      });
    }

    function getAspectClass(productKey) {
      return productKey === 'charging' ? 'aspect-[9/16]' : 'aspect-video';
    }

    function modelBadgeColor(model) {
      if (model === 'kimi') return 'bg-[#dc5f3c] text-white';
      if (model === 'mimo') return 'bg-[#4a6fa5] text-white';
      if (model === 'glm') return 'bg-[#22c55e] text-white';
      if (model === 'mimoV25') return 'bg-[#f59e0b] text-white';
      if (model === 'gemini3') return 'bg-[#8b5cf6] text-white';
      if (model === 'gemini35') return 'bg-[#a855f7] text-white';
      if (model === 'm3') return 'bg-[#0d9488] text-white';
      if (model === 'deepseek') return 'bg-[#dc2626] text-white';
      return 'bg-[#6b7280] text-white';
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      const filtered = getCurrentItems();

      filtered.forEach(item => {
        const likes = getLikeCount(item.id);
        const aspectClass = getAspectClass(item.productKey);
        const badgeClass = modelBadgeColor(item.model);
        const modelLabel = item.model === 'kimi' ? 'Kimi' : item.model === 'mimo' ? 'Mimo' : item.model === 'glm' ? 'GLM' : item.model === 'mimoV25' ? 'Mimo V2.5' : item.model === 'gemini3' ? 'Gemini 3' : item.model === 'gemini35' ? 'Gemini 3.5' : item.model === 'm3' ? 'MiniMax M3' : item.model === 'deepseek' ? 'DeepSeek V4' : 'Unknown';
        const installRow = item.install
          ? `<div class="mt-1 text-[10px] text-[#444] bg-[#f5f5f5] px-1.5 py-0.5 border border-[#e5e5e5] truncate font-mono cursor-pointer hover:border-[#999] transition relative group" onclick="event.stopPropagation(); navigator.clipboard.writeText('${item.install.replace(/'/g, "\\'")}');">
              ${item.install}
              <span class="copy-hint absolute right-1 top-0.5 text-[9px] text-[#666] bg-white px-1 border border-[#ddd]">已复制</span>
             </div>`
          : '';
        const linkRow = item.skillsUrl
          ? `<div class="mt-0.5 text-[10px] truncate"><a href="${item.skillsUrl}" target="_blank" class="text-[#2563eb] hover:underline" onclick="event.stopPropagation()">${item.skillsUrl}</a></div>`
          : '';

        const card = document.createElement('div');
        card.className = 'bg-white border border-[#e0e0e0] cursor-pointer group flex flex-col';
        card.innerHTML = `
          <div class="relative ${aspectClass} overflow-hidden bg-[#eaeaea]">
            <img src="${item.screenshot}" alt="${item.productLabel}" class="w-full h-full object-contain">
          </div>
          <div class="p-2 border-t border-[#e0e0e0] flex flex-col flex-1">
            <div class="flex items-center justify-between gap-2 mb-1">
              <div class="flex items-center gap-1.5 flex-1 min-w-0">
                <span class="px-1.5 py-0.5 rounded text-[9px] font-semibold shrink-0 ${badgeClass}">${modelLabel}</span>
                <div class="font-semibold text-[13px] leading-tight text-[#1a1a1a] truncate">${item.categoryName}</div>
              </div>
              <button class="like-btn flex items-center gap-1 text-[11px] text-[#444] hover:text-[#e11d48] transition shrink-0" data-id="${item.id}">
                <i data-lucide="heart" class="w-3 h-3"></i>
                <span class="like-count">${likes}</span>
              </button>
            </div>
            <div class="text-[10px] text-[#888] mb-0.5 truncate">${item.categorySource}</div>
            <div class="text-[11px] text-[#555] leading-snug line-clamp-2">${item.desc}</div>
            ${linkRow}
            ${installRow}
          </div>
        `;
        card.addEventListener('click', (e) => {
          if (e.target.closest('.like-btn') || e.target.closest('a') || e.target.closest('.font-mono')) {
            e.stopPropagation();
            if (e.target.closest('.like-btn')) {
              const btn = e.target.closest('.like-btn');
              const id = btn.dataset.id;
              const current = getLikeCount(id) + 1;
              setLike(id, current);
              const countEl = btn.querySelector('.like-count');
              if (countEl) countEl.textContent = current;
            }
            return;
          }
          saveFilters();
          window.location.href = `view.html?src=${encodeURIComponent(item.url)}&title=${encodeURIComponent(item.productLabel + ' · ' + item.categoryName + ' · ' + modelLabel)}`;
        });
        gallery.appendChild(card);
      });
      lucide.createIcons();
    }

    document.querySelectorAll('.model-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeModel = btn.dataset.model;
        activeChip = 'all';
        saveFilters();
        updateModels();
        renderChips();
        updateTabs();
        renderGallery();
      });
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        activeChip = 'all';
        saveFilters();
        updateTabs();
        renderChips();
        renderGallery();
      });
    });

    document.getElementById('chipContainer').addEventListener('click', e => {
      if (!e.target.classList.contains('chip-btn')) return;
      activeChip = e.target.dataset.filter;
      saveFilters();
      renderChips();
      renderGallery();
    });

    loadFilters();
    if (activeModel === 'all' && activeChip !== 'all') {
      const validNames = new Set(getCurrentCategories().map(c => c.name));
      if (!validNames.has(activeChip)) activeChip = 'all';
    }
    updateModels();
    updateTabs();
    renderChips();
    renderGallery();
  </script>
</body>
</html>
