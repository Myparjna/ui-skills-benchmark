<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星充 — 电动汽车充电</title>
<style>
:root {
  --bg: #070a0f;
  --surface: #0d1420;
  --surface-2: #141e30;
  --fg: #d0e0f0;
  --fg-muted: #6a8aaa;
  --accent: #00e5a0;
  --accent-dim: #00e5a040;
  --accent-2: #0088ff;
  --warn: #ff6b35;
  --border: #1a2a40;
  --radius: 1rem;
  --font: 'Inter', -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font); background:var(--bg); color:var(--fg); overflow-x:hidden; display:flex; justify-content:center; min-height:100vh; }

.phone-frame { width:100%; max-width:393px; min-height:100vh; position:relative; background:var(--bg); margin:0 auto; }

/* === STATUS BAR === */
.status-bar { display:flex; justify-content:space-between; padding:0.5rem 1rem; font-size:0.75rem; color:var(--fg-muted); }

/* === HEADER === */
.header { padding:0.75rem 1rem; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:1.5rem; font-weight:700; color:#fff; }
.header h1 span { color:var(--accent); }
.header .actions { display:flex; gap:0.75rem; }
.header .actions svg { width:1.25rem; height:1.25rem; stroke:var(--fg-muted); }

/* === SEARCH === */
.search-bar { margin:0.5rem 1rem; display:flex; gap:0.5rem; }
.search-bar input { flex:1; padding:0.75rem 1rem; border-radius:2rem; border:1px solid var(--border); background:var(--surface); color:var(--fg); font-size:0.875rem; outline:none; }
.search-bar input:focus { border-color:var(--accent); }
.search-bar input::placeholder { color:var(--fg-muted); }

/* === FILTER TABS === */
.filter-tabs { display:flex; gap:0.5rem; padding:0.75rem 1rem; overflow-x:auto; }
.filter-tabs span { padding:0.4rem 1rem; border-radius:2rem; font-size:0.8rem; background:var(--surface); color:var(--fg-muted); white-space:nowrap; border:1px solid transparent; cursor:default; }
.filter-tabs span.active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent); }

/* === MAP AREA === */
.map-area { height:200px; margin:0 1rem 1rem; border-radius:var(--radius); background:linear-gradient(135deg, #0d1a2e, #132238); position:relative; overflow:hidden; }
.map-area .map-grid { position:absolute; inset:0; background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size:30px 30px; opacity:0.3; }
.map-area .map-pin { position:absolute; width:0.75rem; height:0.75rem; border-radius:50%; }
.map-area .map-pin::after { content:''; position:absolute; top:-4px; left:-4px; width:1.25rem; height:1.25rem; border-radius:50%; opacity:0.3; }
.map-area .pin-active { background:var(--accent); }
.map-area .pin-active::after { background:var(--accent); }
.map-area .pin-idle { background:var(--fg-muted); }
.map-area .pin-idle::after { background:var(--fg-muted); }
.map-area .pin-warn { background:var(--warn); }
.map-area .pin-warn::after { background:var(--warn); }
.map-area .pin1 { top:25%; left:30%; }
.map-area .pin2 { top:45%; left:55%; }
.map-area .pin3 { top:60%; left:20%; }
.map-area .pin4 { top:30%; left:65%; }
.map-area .pin5 { top:55%; left:75%; }
.map-area .pin6 { top:70%; left:40%; }
.map-area .pin7 { top:35%; left:45%; }

/* === STATION LIST === */
.station-list { display:flex; flex-direction:column; gap:0.75rem; padding:0 1rem 6rem; }
.station-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; display:flex; gap:1rem; transition:all 0.3s; }
.station-card:active { transform:scale(0.98); }
.station-card .info { flex:1; }
.station-card .name { font-weight:600; font-size:0.95rem; color:#fff; margin-bottom:0.25rem; display:flex; align-items:center; gap:0.5rem; }
.station-card .name .badge { font-size:0.65rem; padding:0.15rem 0.45rem; border-radius:1rem; background:var(--accent-dim); color:var(--accent); font-weight:500; }
.station-card .addr { font-size:0.8rem; color:var(--fg-muted); margin-bottom:0.5rem; }
.station-card .stats { display:flex; gap:1rem; font-size:0.78rem; }
.station-card .stats .stat { display:flex; align-items:center; gap:0.25rem; }
.station-card .stats .stat .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.stats .dot.green { background:var(--accent); }
.stats .dot.orange { background:var(--warn); }
.stats .dot.gray { background:var(--fg-muted); }
.station-card .pricing { text-align:right; display:flex; flex-direction:column; gap:0.25rem; }
.station-card .pricing .price { font-size:1.1rem; font-weight:700; color:var(--accent); }
.station-card .pricing .price small { font-size:0.7rem; color:var(--fg-muted); font-weight:400; }
.station-card .pricing .per { font-size:0.7rem; color:var(--fg-muted); }

/* === BOTTOM TAB === */
.bottom-tab { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:393px; background:var(--surface); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:0.5rem 0 1rem; }
.bottom-tab .tab-item { display:flex; flex-direction:column; align-items:center; gap:0.2rem; color:var(--fg-muted); font-size:0.65rem; }
.bottom-tab .tab-item svg { width:1.25rem; height:1.25rem; stroke:currentColor; }
.bottom-tab .tab-item.active { color:var(--accent); }

/* === ANIMATIONS === */
@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.station-card { animation:fadeUp 0.5s ease-out both; }
.station-card:nth-child(1) { animation-delay:0.05s; }
.station-card:nth-child(2) { animation-delay:0.1s; }
.station-card:nth-child(3) { animation-delay:0.15s; }
.station-card:nth-child(4) { animation-delay:0.2s; }
</style>
</head>
<body>
<div class="phone-frame">

<div class="status-bar">

  <span>
