<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet — 运营后台</title>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --surface-2: #1a1a1a;
  --fg: #e8e8e8;
  --fg-muted: #666;
  --accent: #f59e0b;
  --accent-bg: #f59e0b10;
  --border: #222;
  --font: 'Inter', system-ui, sans-serif;
  --r: 0.5rem;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--fg); display:flex; min-height:100vh; }

.sidebar { width:200px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar .logo { padding:1rem 1.25rem; font-weight:700; color:var(--accent); border-bottom:1px solid var(--border); }
.sidebar a { display:block; padding:0.6rem 1.25rem; color:var(--fg-muted); text-decoration:none; font-size:0.82rem; }
.sidebar a:hover { color:var(--fg); background:var(--surface-2); }
.sidebar a.active { color:var(--accent); }

.main { flex:1; }
.topbar { display:flex; justify-content:space-between; padding:0.6rem 1rem; border-bottom:1px solid var(--border); align-items:center; }
.topbar h2 { font-size:0.9rem; font-weight:600; }

.content { padding:1rem; }

.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; margin-bottom:1rem; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:1rem; }
.stat .lbl { font-size:0.65rem; color:var(--fg-muted); text-transform:uppercase; }
.stat .val { font-size:1.5rem; font-weight:700; margin-top:0.2rem; }

.map-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); margin-bottom:1rem; overflow:hidden; }
.map-section .head { padding:0.6rem 0.75rem; border-bottom:1px solid var(--border); font-size:0.8rem; font-weight:600; }

table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:0.5rem 0.75rem; font-size:0.65rem; color:var(--fg-muted); font-weight:400; text-transform:uppercase; border-bottom:1px solid var(--border); }
td { padding:0.5rem 0.75rem; font-size:0.82rem; border-bottom:1px solid var(--border); }
.status { font-size:0.6rem; padding:0.1rem 0.4rem; border:1px solid; border-radius:2px; }
.status-ok { border-color:#22c55e; color:#22c55e; }
.status-warn { border-color:var(--accent); color:var(--accent); }
.status-err { border-color:#ef4444; color:#ef4444; }

.wo { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:0.5rem; margin-top:0.75rem; }
.wo > div { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:0.75rem; }
.wo .ref { font-size:0.6rem; color:var(--fg-muted); }
.wo .desc { font-size:0.82rem; margin:0.15rem 0; }
.wo .meta { font-size:0.6rem; color:var(--fg-muted); display:flex; justify-content:space-between; }

@media (max-width:768px){
  .sidebar { width:48px; }
  .sidebar a span, .sidebar .logo span { display:none; }
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">F<span>leet</span></div>
  <a href="#" class="active"><span>总览</span></a>
  <a href="#"><span>车辆</span></a>
  <a href="#"><span>电池</span></a>
  <a href="#"><span>工单</span></a>
  <a href="#"><span>报表</span></a>
</aside>
<div class="main">
  <div class="topbar"><h2>总览</h2><span style="font-size:0.72rem;color:var(--fg-muted)">杭州</span></div>
  <div class="content">
    <div class="stats">
      <div class="stat"><div class="lbl">在线</div><div class="val">2,847</div></div>
      <div class="stat"><div class="lbl">今日骑行</div><div class="val">18,432</div></div>
      <div class="stat"><div class="lbl">可用率</div><div class="val">94.7%</div></div>
      <div class="stat"><div class="lbl">告警</div><div class="val">23</div></div>
    </div>
    <div class="map-section">
      <div class="head">实时分布</div>
      <div style="height:180px;background:var(--surface-2)"></div>
    </div>
    <div class="map-section">
      <div class="head">车辆状态</div>
      <table>
        <thead><tr><th>编号</th><th>电量</th><th>状态</th><th>位置</th></tr></thead>
        <tbody>
          <tr><td style="font-family:monospace">HZ-00234</td><td>87%</td><td><span class="status status-ok">可用</span></td><td>西湖区</td></tr>
          <tr><td style="font-family:monospace">HZ-00235</td><td>12%</td><td><span class="status status-warn">低电</span></td><td>武林广场</td></tr>
          <tr><td style="font-family:monospace">HZ-00236</td><td>--</td><td><span class="status status-ok">可用</span></td><td>天目山路</td></tr>
          <tr><td style="font-family:monospace">HZ-00237</td><td>45%</td><td><span class="status status-ok">充电中</span></td><td>余杭区</td></tr>
          <tr><td style="font-family:monospace">HZ-00238</td><td>76%</td><td><span class="status status-err">维护中</span></td><td>维修中心</td></tr>
        </tbody>
      </table>
    </div>
    <div class="wo">
      <div><div class="ref">WO-001</div><div class="desc">换电</div><div class="meta"><span style="color:#ef4444">紧急</span><span>张三</span></div></div>
      <div><div class="ref">WO-002</div><div class="desc">检修</div><div class="meta"><span>普通</span><span>李四</span></div></div>
      <div><div class="ref">WO-003</div><div class="desc">增补</div><div class="meta"><span>例行</span><span>王五</span></div></div>
    </div>
  </div>
</div>
</body>
</html>
