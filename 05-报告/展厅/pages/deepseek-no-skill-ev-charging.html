<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>充电吧</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#1a1a1a;display:flex;justify-content:center}
.phone{max-width:393px;width:100%;min-height:100vh}
.bar{display:flex;justify-content:space-between;padding:.5rem 1rem;align-items:center;border-bottom:1px solid #eee}
.bar h1{font-size:1.2rem;color:#059669}
.search{margin:.5rem 1rem}
.search input{width:100%;padding:.6rem;border:1px solid #ddd;border-radius:.375rem;font-size:.85rem}
.list{padding:0 1rem 5rem}
.item{border:1px solid #eee;border-radius:.375rem;padding:.75rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.item .name{font-weight:600;font-size:.85rem}
.item .addr{font-size:.7rem;color:#666}
.item .price{font-weight:700;color:#059669}
.bottom{position:fixed;bottom:0;max-width:393px;width:100%;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:.3rem 0 .5rem}
.bottom .tab{font-size:.6rem;color:#666;text-align:center}
.bottom .tab.active{color:#059669;font-weight:600}
</style></head>
<body><div class="phone">
<div class="bar"><h1>充电吧</h1><span style="color:#666;font-size:.8rem">杭州</span></div>
<div class="search"><input type="text" placeholder="搜索充电站" value="西湖区"></div>
<div class="list">
<div class="item"><div><div class="name">西溪湿地站</div><div class="addr">文二西路 · 0.8km</div></div><div class="price">1.28</div></div>
<div class="item"><div><div class="name">武林广场站</div><div class="addr">延安路 · 1.2km</div></div><div class="price">1.05</div></div>
<div class="item"><div><div class="name">杭州东站超充</div><div class="addr">火车东站 · 2.5km</div></div><div class="price">1.68</div></div>
</div>
<div class="bottom"><div class="tab active">首页</div><div class="tab">扫码</div><div class="tab">订单</div><div class="tab">我的</div></div>
</div></body></html>
