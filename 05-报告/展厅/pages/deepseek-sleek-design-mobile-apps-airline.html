<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>StarSky — 星空航空</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a1628;
  --navy-light:#13203d;
  --navy-card:#1a2d52;
  --navy-border:#243b66;
  --gold:#d4a853;
  --gold-light:#e8c97a;
  --gold-bg:rgba(212,168,83,0.12);
  --text-primary:#f0f0f5;
  --text-secondary:#8899b4;
  --text-tertiary:#5a6d8a;
  --danger:#e05555;
  --success:#4caf84;
  --white:#ffffff;
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0d1a2d;
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;
  color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
}
.app-shell{
  width:100%;max-width:375px;min-height:100vh;
  background:linear-gradient(180deg, var(--navy) 0%, #0f1e38 100%);
  position:relative;
  overflow-x:hidden;
  padding-bottom:calc(72px + var(--safe-bottom));
}

/* ===== Status Bar ===== */
.status-bar{
  height:44px;padding-top:var(--safe-top);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:12px;color:var(--text-secondary);
}

/* ===== Header ===== */
.header{
  padding:0 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-brand{
  display:flex;align-items:center;gap:8px;
}
.header-logo{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg, var(--gold) 0%, #b89130 100%);
  display:flex;align-items:center;justify-content:center;
}
.header-title{font-size:18px;font-weight:700;letter-spacing:0.5px;}
.header-actions{display:flex;gap:8px;}
.icon-btn{
  width:40px;height:40px;border-radius:12px;
  background:var(--navy-card);border:1px solid var(--navy-border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.icon-btn:active{background:var(--navy-border);transform:scale(0.95);}
.icon-btn svg{width:20px;height:20px;stroke:var(--text-secondary);fill:none;stroke-width:1.8;}

/* ===== Loyalty Banner ===== */
.loyalty-banner{
  margin:0 16px 16px;padding:16px;
  background:linear-gradient(135deg, #1a2740 0%, #1e3555 100%);
  border-radius:16px;border:1px solid rgba(212,168,83,0.25);
  display:flex;align-items:center;gap:12px;
}
.loyalty-badge{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg, var(--gold) 0%, #c4983d 100%);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.loyalty-info{flex:1;}
.loyalty-tier{font-size:11px;color:var(--gold-light);font-weight:600;text-transform:uppercase;letter-spacing:1px;}
.loyalty-points{font-size:20px;font-weight:700;margin-top:2px;}
.loyalty-points span{font-size:12px;color:var(--text-secondary);font-weight:400;}
.loyalty-arrow svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;}

/* ===== Search Card ===== */
.search-card{
  margin:0 16px 16px;padding:16px;
  background:var(--navy-card);border-radius:16px;
  border:1px solid var(--navy-border);
}
.search-route{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;
}
.search-city{flex:1;}
.search-city-label{font-size:10px;color:var(--text-tertiary);margin-bottom:4px;}
.search-city-name{font-size:22px;font-weight:700;}
.search-city-code{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.search-swap{
  width:36px;height:36px;border-radius:50%;
  background:var(--navy-border);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.search-swap svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;}
.search-meta{
  display:flex;gap:8px;
}
.search-meta-item{
  flex:1;padding:10px 12px;
  background:var(--navy-light);border-radius:10px;
  display:flex;align-items:center;gap:8px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.search-meta-item svg{width:16px;height:16px;stroke:var(--text-secondary);fill:none;stroke-width:1.5;}
.search-meta-item span{font-size:14px;color:var(--text-primary);}
.search-btn{
  width:100%;margin-top:14px;padding:14px;
  background:linear-gradient(135deg, var(--gold) 0%, #c4983d 100%);
  border:none;border-radius:12px;
  color:var(--navy);font-size:16px;font-weight:700;
  cursor:pointer;letter-spacing:1px;
  -webkit-tap-highlight-color:transparent;
}
.search-btn:active{opacity:0.85;transform:scale(0.98);}

/* ===== Section ===== */
.section{margin-bottom:20px;}
.section-header{
  padding:0 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.section-title{font-size:16px;font-weight:700;}
.section-more{font-size:13px;color:var(--gold-light);cursor:pointer;}
.section-more:active{opacity:0.7;}

/* ===== Destinations Scroll ===== */
.dest-scroll{
  display:flex;gap:12px;padding:0 16px;
  overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.dest-scroll::-webkit-scrollbar{display:none;}
.dest-card{
  min-width:140px;height:170px;border-radius:16px;
  background:var(--navy-card);border:1px solid var(--navy-border);
  position:relative;overflow:hidden;
  scroll-snap-align:start;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px;
}
.dest-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 30%, rgba(10,22,40,0.92) 100%);
}
.dest-card-img{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:48px;opacity:0.18;
}
.dest-card-name{font-size:15px;font-weight:700;position:relative;z-index:1;}
.dest-card-price{font-size:12px;color:var(--gold-light);position:relative;z-index:1;margin-top:4px;}
.dest-card:active{transform:scale(0.96);transition:transform 0.15s;}

/* ===== Booking Card ===== */
.booking-card{
  margin:0 16px 12px;padding:16px;
  background:var(--navy-card);border-radius:14px;
  border:1px solid var(--navy-border);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.booking-card:active{background:var(--navy-light);}
.booking-route{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.booking-city{font-size:16px;font-weight:700;}
.booking-line{flex:1;height:1px;background:var(--navy-border);position:relative;}
.booking-line::after{
  content:'';position:absolute;right:-3px;top:-3px;
  width:7px;height:7px;border-radius:50%;background:var(--gold);
}
.booking-meta{
  display:flex;justify-content:space-between;align-items:center;
}
.booking-date{font-size:12px;color:var(--text-secondary);}
.booking-status{
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;
}
.status-confirmed{background:rgba(76,175,132,0.15);color:var(--success);}
.status-upcoming{background:rgba(212,168,83,0.15);color:var(--gold-light);}

/* ===== QR Section ===== */
.qr-section{
  margin:0 16px 16px;padding:20px;
  background:var(--navy-card);border-radius:16px;
  border:1px solid var(--navy-border);
  display:flex;align-items:center;gap:16px;
}
.qr-code{
  width:72px;height:72px;border-radius:12px;
  background:var(--white);padding:8px;
  flex-shrink:0;
}
.qr-code svg{width:100%;height:100%;}
.qr-info{flex:1;}
.qr-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.qr-sub{font-size:12px;color:var(--text-secondary);line-height:1.4;}
.qr-cta{
  margin-top:8px;font-size:13px;color:var(--gold-light);font-weight:600;
  cursor:pointer;display:inline-block;
}

/* ===== Bottom TabBar ===== */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:375px;height:calc(64px + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:rgba(10,22,40,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--navy-border);
  display:flex;align-items:center;justify-content:space-around;
  z-index:100;
}
.tab-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;padding:6px 12px;
  -webkit-tap-highlight-color:transparent;
  min-height:44px;justify-content:center;
}
.tab-item svg{width:22px;height:22px;stroke:var(--text-tertiary);fill:none;stroke-width:1.8;}
.tab-label{font-size:10px;color:var(--text-tertiary);}
.tab-item.active svg{stroke:var(--gold);}
.tab-item.active .tab-label{color:var(--gold);}
.tab-item:active{opacity:0.7;}

/* ===== Utility ===== */
.text-gold{color:var(--gold-light);}
</style>
</head>
