<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理后台</title><style>:root{--sidebar:#1e293b;--primary:#2563eb;--bg:#f8fafc;--surface:#fff;--fg:#0f172a;--fg-muted:#64748b;--border:#e2e8f0;--font:'Inter',system-ui,sans-serif;--r:.375rem}*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font);background:var(--bg);color:var(--fg);display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .logo{padding:.75rem 1rem;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar a{display:block;padding:.5rem 1rem;color:#cbd5e1;text-decoration:none;font-size:.82rem}
.sidebar a:hover{background:rgba(255,255,255,.05)}
.sidebar a.active{background:var(--primary);color:#fff}
.main{flex:1}
.topbar{display:flex;justify-content:space-between;padding:.5rem .75rem;border-bottom:1px solid var(--border);background:var(--surface)}
.content{padding:.75rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.75rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.75rem}
.stat .lbl{font-size:.65rem;color:var(--fg-muted);text-transform:uppercase}
.stat .val{font-size:1.5rem;font-weight:700}
.map{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem}
.map .h{padding:.5rem .75rem;border-bottom:1px solid var(--border);font-weight:600;font-size:.85rem}
.map .v{height:160px;background:#f1f5f9;border-radius:0 0 var(--r) var(--r)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.4rem .6rem;font-size:.65rem;color:var(--fg-muted);border-bottom:1px solid var(--border)}
td{padding:.4rem .6rem;font-size:.8rem;border-bottom:1px solid var(--border)}
.s{font-size:.6rem;padding:.1rem .35rem;border-radius:.2rem}
.s-ok{background:#dcfce7;color:#16a34a}
.s-warn{background:#fef3c7;color:#d97706}
@media(max-width:768px){.sidebar{width:48px}.sidebar a span,.sidebar .logo span{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<aside class="sidebar"><div class="logo">Fleet</div><a href="#" class="active">总览</a><a href="#">车辆</a><a href="#">电池</a><a href="#">工单</a></aside>
<div class="main">
<div class="topbar"><span>总览</span><span style="color:var(--fg-muted);font-size:.72rem">杭州 · 2026-06-05</span></div>
<div class="content">
<div class="stats"><div class="stat"><div class="lbl">在线</div><div class="val">2,847</div></div><div class="stat"><div class="lbl">骑行</div><div class="val">18,432</div></div><div class="stat"><div class="lbl">可用率</div><div class="val">94.7%</div></div><div class="stat"><div class="lbl">告警</div><div class="val">23</div></div></div>
<div class="map"><div class="h">实时分布</div><div class="v"></div></div>
<div class="map"><div class="h">车辆状态</div><table><thead><tr><th>编号</th><th>电量</th><th>状态</th><th>位置</th></tr></thead><tbody><tr><td>HZ-00234</td><td>87%</td><td><span class="s s-ok">可用</span></td><td>西湖区</td></tr><tr><td>HZ-00235</td><td>12%</td><td><span class="s s-warn">低电</span></td><td>武林广场</td></tr><tr><td>HZ-00236</td><td>--</td><td><span class="s s-ok">可用</span></td><td>天目山路</td></tr><tr><td>HZ-00237</td><td>45%</td><td><span class="s s-ok">充电中</span></td><td>余杭区</td></tr></tbody></table></div>
</div></div>
</body></html>
