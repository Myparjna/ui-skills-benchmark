<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Ops - Geometric Silence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400&family=Bricolage+Grotesque:wght@200;400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .grid-container {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 0;
        }
        .grid-item {
            border: 0.5px solid rgba(255,255,255,0.03);
            transition: all 0.5s ease;
        }
        .grid-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .accent-line {
            position: absolute;
            background: rgba(255,255,255,0.2);
            transition: all 1s ease-in-out;
        }
        .data-dot {
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px #fff;
        }
        .stark-heading {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 200;
        }
    </style>
</head>
<body>
    <div class="grid-container" id="grid">
        <!-- Generated by JS -->
    </div>

    <main class="relative z-10 h-screen w-full p-16 flex flex-col justify-between mix-blend-difference">
        <div class="flex justify-between items-start">
            <div class="space-y-4">
                <h1 class="stark-heading text-8xl uppercase leading-none tracking-tighter">FLEET<br>SYSTEMS</h1>
                <div class="h-px w-64 bg-white/40"></div>
                <p class="text-xs tracking-[0.8em] opacity-40">URBAN LOGISTICS OS / V1.0</p>
            </div>
            <div class="text-right">
                <p class="text-xs opacity-40 mb-2">SYSTEM LATENCY</p>
                <p class="text-2xl font-light">14MS</p>
            </div>
        </div>

        <div class="flex justify-center flex-grow items-center">
            <div class="relative w-[500px] h-[500px]">
                <!-- Abstract Asset Map -->
                <svg viewBox="0 0 100 100" class="w-full h-full opacity-20">
                    <circle cx="50" cy="50" r="48" fill="none" stroke="white" stroke-width="0.1" />
                    <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="0.1" />
                    <path d="M10 50 L90 50 M50 10 L50 90" stroke="white" stroke-width="0.1" />
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="text-center group cursor-pointer">
                        <p class="text-[10px] tracking-[0.5em] opacity-40 mb-4 group-hover:opacity-100 transition-opacity">TOTAL ASSETS</p>
                        <p class="text-7xl stark-heading">24,092</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end">
            <div class="grid grid-cols-2 gap-16">
                <div>
                    <p class="text-[10px] opacity-40 mb-4 tracking-widest">ACTIVE WORKFLOWS</p>
                    <div class="flex gap-2">
                        <div class="w-8 h-1 bg-white"></div>
                        <div class="w-8 h-1 bg-white/20"></div>
                        <div class="w-8 h-1 bg-white/20"></div>
                    </div>
                </div>
                <div>
                    <p class="text-[10px] opacity-40 mb-4 tracking-widest">COMPLIANCE RATE</p>
                    <p class="text-2xl font-light">99.8%</p>
                </div>
            </div>
            
            <div class="flex gap-4">
                <button class="px-8 py-3 border border-white/20 hover:bg-white hover:text-black transition-all text-xs tracking-widest uppercase">
                    Dispatch
                </button>
                <button class="p-3 border border-white/20 hover:bg-white hover:text-black transition-all">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        const grid = document.getElementById('grid');
        for (let i = 0; i < 144; i++) {
            const item = document.createElement('div');
            item.className = 'grid-item';
            grid.appendChild(item);
        }

        lucide.createIcons();

        // Random data dots
        setInterval(() => {
            const dot = document.createElement('div');
            dot.className = 'data-dot';
            dot.style.left = Math.random() * 100 + '%';
            dot.style.top = Math.random() * 100 + '%';
            document.body.appendChild(dot);
            setTimeout(() => dot.remove(), 2000);
        }, 500);
    </script>
</body>
</html>
