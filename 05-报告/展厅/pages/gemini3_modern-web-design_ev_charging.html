<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging - 智能充电小程序</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=PingFang+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'PingFang SC', sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .mobile-container {
            width: 390px;
            height: 844px;
            background: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.25);
            border-radius: 40px;
            border: 8px solid #1a1a1a;
        }
        .map-bg {
            position: absolute;
            inset: 0;
            background: url('https://api.mapbox.com/styles/v1/mapbox/light-v10/static/120.15,30.28,13,0/390x844?access_token=YOUR_MAPBOX_TOKEN') no-repeat center center;
            background-size: cover;
            z-index: 0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(160%);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }
        .station-card {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .station-card:active {
            transform: scale(0.98);
        }
        .status-pill {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .tab-bar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #f0f0f0;
        }
        .scan-btn {
            background: linear-gradient(135deg, #1677FF 0%, #00B96B 100%);
            box-shadow: 0 10px 20px rgba(22, 119, 255, 0.3);
        }
        .marker {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #1677FF;
        }
        .marker span {
            transform: rotate(45deg);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Status Bar Space -->
        <div class="h-11 w-full flex justify-between items-center px-8 relative z-20">
            <span class="text-sm font-bold">9:41</span>
            <div class="flex space-x-1.5 items-center">
                <div class="w-4 h-4 rounded-full border-2 border-black"></div>
                <div class="w-4 h-4 rounded-full border-2 border-black"></div>
                <div class="w-6 h-3 rounded-sm border-2 border-black"></div>
            </div>
        </div>

        <!-- Search Header -->
        <div class="px-5 mt-2 relative z-20">
            <div class="flex items-center bg-white/90 backdrop-blur-md rounded-2xl p-3 shadow-lg border border-white/50">
                <div class="w-10 h-10 flex items-center justify-center text-gray-400">🔍</div>
                <input type="text" placeholder="搜索充电站、目的地" class="flex-1 bg-transparent border-none outline-none text-sm font-medium ml-2">
                <div class="w-10 h-10 flex items-center justify-center border-l border-gray-100 text-blue-600">📍</div>
            </div>
        </div>

        <!-- Quick Filters -->
        <div class="px-5 mt-4 flex space-x-2 relative z-20 overflow-x-auto no-scrollbar">
            <button class="bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">全部</button>
            <button class="bg-white/80 backdrop-blur-md text-gray-700 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-white/50">快充</button>
            <button class="bg-white/80 backdrop-blur-md text-gray-700 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-white/50">免费停车</button>
            <button class="bg-white/80 backdrop-blur-md text-gray-700 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-white/50">运营商</button>
        </div>

        <!-- Map Mockup -->
        <div class="map-bg"></div>

        <!-- Map Markers -->
        <div class="absolute top-[30%] left-[25%] marker">
            <span class="text-green-600 font-bold">8</span>
        </div>
        <div class="absolute top-[45%] left-[60%] marker border-orange-500">
            <span class="text-orange-600 font-bold">2</span>
        </div>
        <div class="absolute top-[20%] left-[70%] marker">
            <span class="text-green-600 font-bold">12</span>
        </div>

        <!-- Bottom Sheet -->
        <div class="absolute bottom-0 left-0 right-0 z-30">
            <div class="glass-panel rounded-t-[32px] p-6 shadow-2xl">
                <!-- Handle -->
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>

                <!-- Station List Heading -->
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold">附近充电站</h3>
                    <button class="text-blue-600 text-sm font-bold">列表模式</button>
                </div>

                <!-- Featured Station Card -->
                <div class="station-card bg-white rounded-2xl p-4 mb-4 shadow-sm border border-gray-50">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h4 class="font-bold text-gray-900">特来电滨江星光大道站</h4>
                            <p class="text-xs text-gray-500 mt-1">滨江区滨盛路1766号 | 850m</p>
                        </div>
                        <span class="status-pill bg-green-100 text-green-700">空闲 8/12</span>
                    </div>
                    <div class="flex space-x-2 mb-4">
                        <span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded">快充</span>
                        <span class="text-[10px] bg-orange-50 text-orange-600 px-2 py-1 rounded">PLUS优惠</span>
                        <span class="text-[10px] bg-gray-50 text-gray-600 px-2 py-1 rounded">免费停车2h</span>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-gray-50">
                        <div class="text-lg font-bold text-blue-600">¥1.28 <span class="text-xs font-normal text-gray-400">/度</span></div>
                        <button class="bg-blue-600 text-white px-6 py-2 rounded-xl text-sm font-bold">导航前往</button>
                    </div>
                </div>

                <!-- Second Station Card (Partial) -->
                <div class="station-card bg-white rounded-2xl p-4 shadow-sm border border-gray-50 opacity-60">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-gray-900">星星充电杭州印中心站</h4>
                            <p class="text-xs text-gray-500 mt-1">滨江区闻涛路 | 1.2km</p>
                        </div>
                        <span class="status-pill bg-orange-100 text-orange-700">空闲 2/10</span>
                    </div>
                </div>
            </div>

            <!-- Tab Bar -->
            <div class="tab-bar h-24 flex items-center justify-around px-4 pb-4">
                <div class="flex flex-col items-center space-y-1">
                    <div class="w-6 h-6 text-blue-600">🏠</div>
                    <span class="text-[10px] font-bold text-blue-600">首页</span>
                </div>
                <div class="flex flex-col items-center space-y-1">
                    <div class="w-6 h-6 text-gray-400">🎁</div>
                    <span class="text-[10px] font-medium text-gray-400">优惠</span>
                </div>
                <!-- Scan Button -->
                <div class="relative -top-6">
                    <div class="scan-btn w-16 h-16 rounded-full flex flex-col items-center justify-center text-white border-4 border-white">
                        <div class="text-xl">📷</div>
                        <span class="text-[9px] font-bold mt-1 uppercase">扫码充电</span>
                    </div>
                </div>
                <div class="flex flex-col items-center space-y-1">
                    <div class="w-6 h-6 text-gray-400">📋</div>
                    <span class="text-[10px] font-medium text-gray-400">订单</span>
                </div>
                <div class="flex flex-col items-center space-y-1">
                    <div class="w-6 h-6 text-gray-400">👤</div>
                    <span class="text-[10px] font-medium text-gray-400">我的</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Entrance Animations
        window.addEventListener('load', () => {
            gsap.from('.mobile-container', {
                opacity: 0,
                y: 50,
                duration: 1,
                ease: 'power4.out'
            });

            gsap.from('.glass-panel', {
                y: 300,
                duration: 1.2,
                delay: 0.5,
                ease: 'power3.out'
            });

            gsap.from('.marker', {
                scale: 0,
                opacity: 0,
                stagger: 0.2,
                duration: 0.8,
                delay: 1,
                ease: 'back.out(1.7)'
            });
        });
    </script>
</body>
</html>
