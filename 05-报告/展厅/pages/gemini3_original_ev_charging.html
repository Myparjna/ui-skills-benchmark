<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging - Gemini Original</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #1677ff;
            --success: #52c41a;
            --warning: #faad14;
            --error: #ff4d4f;
            --bg: #f5f7fa;
            --surface: #ffffff;
            --text: #1f1f1f;
            --text-secondary: #8c8c8c;
            --border: #f0f0f0;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: 80px; }

        /* Header */
        header { background: var(--surface); padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .location-info { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }

        /* Search Box */
        .search-container { padding: 16px; background: var(--surface); }
        .search-input { width: 100%; height: 44px; background: #f0f2f5; border: none; border-radius: var(--radius); padding: 0 16px; display: flex; align-items: center; gap: 10px; color: var(--text-secondary); cursor: pointer; }

        /* Map Preview */
        .map-preview { height: 260px; background: #e8e8e8; margin: 16px; border-radius: 12px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
        .map-marker { position: absolute; width: 32px; height: 32px; background: var(--primary); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(22,119,255,0.3); border: 2px solid #fff; }
        .map-marker i { transform: rotate(45deg); color: #fff; }

        /* Station List */
        .station-list { padding: 0 16px; }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .list-header h3 { font-size: 16px; font-weight: 700; }

        .station-item { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s; }
        .station-item:active { transform: scale(0.98); }
        .station-main h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .station-sub { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; margin-bottom: 8px; }
        .tags { display: flex; gap: 6px; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        .tag-fast { background: #e6f7ff; color: #1890ff; }
        .tag-parking { background: #f6ffed; color: #52c41a; }

        .station-price { text-align: right; }
        .price-num { font-size: 18px; font-weight: 700; color: var(--primary); }
        .price-unit { font-size: 11px; color: var(--text-secondary); }
        .distance { font-size: 12px; margin-top: 4px; color: var(--text-secondary); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 70px; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding: 5px 0; z-index: 100; }
        .nav-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-secondary); font-size: 10px; cursor: pointer; }
        .nav-tab.active { color: var(--primary); }
        .scan-tab { transform: translateY(-15px); }
        .scan-circle { width: 56px; height: 56px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 4px 12px rgba(22,119,255,0.4); border: 4px solid var(--surface); }

        /* Status Overlay */
        .charging-screen { position: fixed; inset: 0; background: #fff; z-index: 1000; display: none; flex-direction: column; }
        .charging-screen.active { display: flex; }
        .charging-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }

        .visual-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        .battery-visual { width: 120px; height: 220px; border: 4px solid #eee; border-radius: 12px; position: relative; padding: 6px; margin-bottom: 30px; }
        .battery-visual::after { content: ''; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 40px; height: 10px; background: #eee; border-radius: 4px 4px 0 0; }
        .battery-fill { background: var(--success); width: 100%; border-radius: 6px; transition: height 1s; position: absolute; bottom: 6px; left: 6px; right: 6px; }
        .charging-info { text-align: center; }
        .charging-info h2 { font-size: 48px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
        
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; width: 100%; gap: 16px; margin-top: 40px; }
        .stat-card { background: #f9f9f9; padding: 16px; border-radius: 12px; }
        .stat-card span { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
        .stat-card strong { font-size: 18px; font-weight: 700; }

        .btn-stop { background: var(--error); color: #fff; border: none; height: 54px; margin: 20px; border-radius: var(--radius); font-size: 16px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="location-info">
                <i data-lucide="map-pin" size="18" color="var(--primary)"></i>
                杭州 · 滨江区
                <i data-lucide="chevron-down" size="14"></i>
            </div>
            <i data-lucide="bell" size="20"></i>
        </header>

        <div class="search-container">
            <div class="search-input">
                <i data-lucide="search" size="18"></i>
                输入目的地查找充电站
            </div>
        </div>

        <div class="map-preview">
            <div class="map-marker" style="top: 30%; left: 40%;">
                <i data-lucide="zap" size="14"></i>
            </div>
            <div class="map-marker" style="top: 60%; left: 70%; opacity: 0.6;">
                <i data-lucide="zap" size="14"></i>
            </div>
            <span>点击查看完整地图</span>
        </div>

        <div class="station-list">
            <div class="list-header">
                <h3>推荐站点</h3>
                <span style="font-size: 13px; color: var(--primary);">更多</span>
            </div>

            <!-- Item 1 -->
            <div class="station-item" onclick="toggleCharging(true)">
                <div class="station-main">
                    <h4>特来电滨江超充中心</h4>
                    <div class="station-sub">
                        <span>4.9分</span>
                        <span>快 12/16</span>
                    </div>
                    <div class="tags">
                        <span class="tag tag-fast">极速充</span>
                        <span class="tag tag-parking">2小时免费停车</span>
                    </div>
                </div>
                <div class="station-price">
                    <div class="price-num">¥1.18</div>
                    <div class="price-unit">/ 度 (起)</div>
                    <div class="distance">1.2km</div>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="station-item">
                <div class="station-main">
                    <h4>星星充电·星耀城站</h4>
                    <div class="station-sub">
                        <span>4.7分</span>
                        <span>快 4/8</span>
                    </div>
                    <div class="tags">
                        <span class="tag tag-fast">直流快充</span>
                    </div>
                </div>
                <div class="station-price">
                    <div class="price-num">¥0.98</div>
                    <div class="price-unit">/ 度 (起)</div>
                    <div class="distance">2.5km</div>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="station-item">
                <div class="station-main">
                    <h4>云快充物联网大厦站</h4>
                    <div class="station-sub">
                        <span>4.5分</span>
                        <span>快 20/24</span>
                    </div>
                    <div class="tags">
                        <span class="tag tag-parking">停车优惠</span>
                    </div>
                </div>
                <div class="station-price">
                    <div class="price-num">¥1.25</div>
                    <div class="price-unit">/ 度 (起)</div>
                    <div class="distance">3.1km</div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-tab active">
                <i data-lucide="home" size="22"></i>
                <span>首页</span>
            </div>
            <div class="nav-tab">
                <i data-lucide="ticket" size="22"></i>
                <span>优惠</span>
            </div>
            <div class="nav-tab scan-tab">
                <div class="scan-circle" onclick="toggleCharging(true)">
                    <i data-lucide="qr-code" size="28"></i>
                </div>
                <span>扫码充电</span>
            </div>
            <div class="nav-tab">
                <i data-lucide="file-text" size="22"></i>
                <span>订单</span>
            </div>
            <div class="nav-tab">
                <i data-lucide="user" size="22"></i>
                <span>我的</span>
            </div>
        </nav>
    </div>

    <!-- Charging Overlay -->
    <div id="charging-screen" class="charging-screen">
        <div class="charging-header">
            <i data-lucide="chevron-left" size="24" onclick="toggleCharging(false)"></i>
            <span style="font-weight: 700;">充电中</span>
            <i data-lucide="info" size="24"></i>
        </div>
        <div class="visual-container">
            <div class="battery-visual">
                <div class="battery-fill" style="height: 65%;"></div>
            </div>
            <div class="charging-info">
                <h2>65<span>%</span></h2>
                <p style="color: var(--text-secondary);">正在极速补能中...</p>
            </div>
            <div class="grid-stats">
                <div class="stat-card">
                    <span>已充电量</span>
                    <strong>32.40 kWh</strong>
                </div>
                <div class="stat-card">
                    <span>当前电费</span>
                    <strong>¥ 45.20</strong>
                </div>
                <div class="stat-card">
                    <span>充电功率</span>
                    <strong>62.5 kW</strong>
                </div>
                <div class="stat-card">
                    <span>已用时长</span>
                    <strong>00:24:12</strong>
                </div>
            </div>
        </div>
        <button class="btn-stop" onclick="stopCharging()">结束充电</button>
    </div>

    <script>
        lucide.createIcons();

        function toggleCharging(show) {
            const screen = document.getElementById('charging-screen');
            if(show) screen.classList.add('active');
            else screen.classList.remove('active');
        }

        function stopCharging() {
            if(confirm('确认停止充电并结算？')) {
                toggleCharging(false);
                alert('充电结束，结算金额 ¥45.20');
            }
        }
    </script>
</body>
</html>
