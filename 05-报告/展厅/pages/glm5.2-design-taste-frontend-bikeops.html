  tailwind.config = {

<style>
  :root { --ease: cubic-bezier(0.16, 1, 0.3, 1); }
  html { scroll-behavior: smooth; }
  body { background: #fafafa; color: #18181b; -webkit-font-smoothing: antialiased; }
  ::selection { background: #047857; color: #fff; }

  /* Bento surface */
  .bento {
    background: #ffffff;
    border: 1px solid rgba(228, 228, 231, 0.7);
    border-radius: 2rem;
    box-shadow: 0 20px 40px -20px rgba(9, 9, 11, 0.05);
  }
  .bento-tight { border-radius: 1.25rem; }

  /* Load-in stagger */
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .rise { opacity: 0; animation: riseIn 0.7s var(--ease) forwards; }
  .rise-1 { animation-delay: 0.04s; } .rise-2 { animation-delay: 0.10s; }
  .rise-3 { animation-delay: 0.16s; } .rise-4 { animation-delay: 0.22s; }
  .rise-5 { animation-delay: 0.28s; } .rise-6 { animation-delay: 0.34s; }

  /* Perpetual micro-animations */
  @keyframes breathe { 0%,100% { opacity: 0.5; transform: scale(0.9) } 50% { opacity: 1; transform: scale(1.2) } }
  .breathe { animation: breathe 2.4s ease-in-out infinite; }

  @keyframes pulseRing { 0% { transform: scale(0.6); opacity: 0.7 } 100% { transform: scale(2.2); opacity: 0 } }
  .pulse-ring { animation: pulseRing 2.2s ease-out infinite; }

  @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
  .marquee { animation: marquee 26s linear infinite; }

  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  .floaty { animation: floaty 4s ease-in-out infinite; }

  /* Typewriter caret */
  @keyframes caret { 50% { opacity: 0 } }
  .caret { animation: caret 1s step-end infinite; }

  /* Auto-sorted list shimmer */
  @keyframes listSwap { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1px) } }

  /* Skeleton shimmer */
  @keyframes shimmer { 0% { background-position: -200% 0 } 100% { background-position: 200% 0 } }
  .shimmer { background: linear-gradient(90deg, #f4f4f5 25%, #fafafa 50%, #f4f4f5 75%); background-size: 200% 100%; animation: shimmer 2.4s linear infinite; }

  /* Overshoot badge pop */
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0 }
    60% { transform: scale(1.12); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  .pop { animation: pop 0.6s var(--ease) forwards; }

  /* Tactile */
  button:active, a[data-tactile]:active { transform: translateY(1px) scale(0.985); }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
  .no-bar::-webkit-scrollbar { display: none; }
  .no-bar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Grain */
  .grain::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03;
    background-image: radial-gradient(rgba(9,9,11,0.6) 0.5px, transparent 0.5px);
    background-size: 4px 4px;
  }

  /* Number cells use Geist Mono per skill rule 95 (Cockpit Mode) — VISUAL_DENSITY 4 is daily app, but data metrics still benefit from tabular */
  .num { font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="font-sans grain">
<div id="root" class="relative z-10"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Sidebar ---------- */
function Sidebar() {
  const nav = [
    { group: '运营', items: [
      { id: 'dashboard', icon: 'ph-gauge',           label: '运营总览', active: true },
      { id: 'map',       icon: 'ph-map-trifold',     label: '地图调度中心' },
      { id: 'vehicles',  icon: 'ph-bicycle',         label: '车队资产' },
      { id: 'battery',   icon: 'ph-battery-charging',label: '电池与能源' },
    ]},
    { group: '执行', items: [
      { id: 'work',      icon: 'ph-clipboard-list',  label: '运维工单' },
      { id: 'zones',     icon: 'ph-map-pin-line',    label: '规则与区域' },
      { id: 'compliance',icon: 'ph-shield-warning',  label: '合规监管' },
    ]},
    { group: '系统', items: [
      { id: 'analytics', icon: 'ph-chart-line-up',   label: '数据报表' },
      { id: 'org',       icon: 'ph-users-three',     label: '组织与权限' },
      { id: 'settings',  icon: 'ph-gear-six',        label: '配置与对接' },
    ]},
  ];
  return (
    <aside className="hidden lg:flex flex-col w-[240px] bg-ink-950 text-ink-300 sticky top-0 h-screen">
      <div className="h-16 flex items-center gap-2.5 px-5 border-b border-ink-800">
        <span className="w-8 h-8 rounded-xl bg-accent-500 grid place-items-center">
          <i className="ph-fill ph-bicycle text-ink-950 text-base"></i>
        </span>
        <div className="leading-none">
          <div className="font-display font-semibold text-sm tracking-tight text-ink-50">UrbanWheels</div>
          <div className="font-mono text-[9px] text-ink-500 tracking-widest uppercase">ops · v2.4.1</div>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto py-5 px-3 no-bar">
        {nav.map(g => (
          <div key={g.group} className="mb-5">
            <div className="font-mono text-[9px] uppercase tracking-widest text-ink-600 px-3 mb-2">{g.group}</div>
            <ul className="space-y-0.5">
              {g.items.map(it => (
                <li key={it.id}>
                  <a href="#" className={`flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm transition-colors ${it.active ? 'bg-ink-800/80 text-ink-50' : 'text-ink-400 hover:bg-ink-900 hover:text-ink-100'}`}>
                    <i className={`${it.active ? 'ph-bold' : 'ph'} ${it.icon} text-base ${it.active ? 'text-accent-400' : ''}`}></i>
                    <span>{it.label}</span>
                    {it.id === 'compliance' && <span className="ml-auto text-[9px] font-mono bg-crit-500/15 text-crit-500 px-1.5 py-0.5 rounded">3</span>}
                    {it.id === 'work' && <span className="ml-auto text-[9px] font-mono bg-warn-500/15 text-warn-500 px-1.5 py-0.5 rounded">12</span>}
                  </a>
                </li>
              ))}
            </ul>
          </div>
        ))}
      </div>

      <div className="border-t border-ink-800 p-3">
        <div className="flex items-center gap-2.5 px-2 py-2">
          <div className="w-8 h-8 rounded-full bg-gradient-to-br from-accent-400 to-info-500 grid place-items-center text-ink-950 font-display font-semibold text-xs">CY</div>
          <div className="leading-tight flex-1 min-w-0">
            <div className="text-xs text-ink-100 truncate">陈砚秋</div>
            <div className="font-mono text-[9px] text-ink-500">杭州城市运营经理</div>
          </div>
          <button className="w-7 h-7 grid place-items-center text-ink-500 hover:text-ink-100"><i className="ph ph-sign-out"></i></button>
        </div>
      </div>
    </aside>
  );
}

/* ---------- Topbar ---------- */
function Topbar() {
  const [city, setCity] = useState('杭州');
  const [range, setRange] = useState('今日');
  return (
    <header className="sticky top-0 z-30 bg-ink-50/85 backdrop-blur-xl border-b border-ink-200/70">
      <div className="px-5 md:px-8 h-16 flex items-center gap-4">
        {/* Mobile logo */}
        <div className="lg:hidden flex items-center gap-2">
          <span className="w-8 h-8 rounded-xl bg-ink-950 grid place-items-center"><i className="ph-fill ph-bicycle text-accent-400"></i></span>
        </div>

        {/* City selector */}
        <div className="flex items-center gap-2">
          <i className="ph ph-map-pin text-ink-500"></i>
          <select value={city} onChange={e => setCity(e.target.value)} className="bg-transparent text-sm font-medium text-ink-950 outline-none cursor-pointer">
            <option>杭州</option><option>上海</option><option>成都</option><option>深圳</option>
          </select>
          <span className="font-mono text-[10px] text-ink-500 uppercase tracking-widest hidden md:inline">3 个区域 · 8 子车队</span>
        </div>

        <div className="hidden md:block w-px h-5 bg-ink-200 mx-2"></div>

        {/* Time range */}
        <div className="hidden md:flex items-center gap-1">
          {['今日', '昨日', '本周', '本月', '自定义'].map(r => (
            <button key={r} onClick={() => setRange(r)} className={`px-3 py-1 text-xs rounded-full transition-colors ${range === r ? 'bg-ink-950 text-ink-50' : 'text-ink-600 hover:text-ink-950'}`}>{r}</button>
          ))}
        </div>

        {/* Command search */}
        <div className="ml-auto hidden md:flex items-center gap-2 h-9 px-3 rounded-full bg-white border border-ink-200 w-[300px]">
          <i className="ph ph-magnifying-glass text-ink-500"></i>
          <input placeholder="搜索车架号 / 订单号 / 工单号" className="flex-1 bg-transparent text-xs outline-none placeholder:text-ink-400" />
          <span className="font-mono text-[9px] text-ink-400 bg-ink-100 px-1.5 py-0.5 rounded">⌘K</span>
        </div>

        <button className="w-9 h-9 grid place-items-center rounded-full hover:bg-ink-100 text-ink-700 relative">
          <i className="ph ph-bell text-lg"></i>
          <span className="absolute top-1.5 right-2 w-2 h-2 rounded-full bg-crit-500"></span>
        </button>
        <button className="w-9 h-9 grid place-items-center rounded-full hover:bg-ink-100 text-ink-700">
          <i className="ph ph-question text-lg"></i>
        </button>
      </div>
    </header>
  );
}

/* ---------- KPI Tile (Bento with perpetual motion) ---------- */
function Kpi({ label, value, unit, delta, trend, icon, spark, accent = 'ink', delay = 'rise-1' }) {
  const trendColor = trend === 'up' ? 'text-accent-700' : trend === 'down' ? 'text-crit-600' : 'text-ink-500';
  return (
    <div className={`bento p-6 rise ${delay}`}>
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2">
          <i className={`ph-bold ${icon} text-ink-500`}></i>
          <span className="font-mono text-[10px] uppercase tracking-widest text-ink-500">{label}</span>
        </div>
        <span className="relative flex w-1.5 h-1.5">
          <span className="absolute inset-0 rounded-full bg-accent-500 breathe"></span>
          <span className="relative w-1.5 h-1.5 rounded-full bg-accent-600"></span>
        </span>
      </div>
      <div className="flex items-baseline gap-1.5">
        <span className={`font-display text-4xl font-semibold tracking-tightest tabular-nums text-ink-950`}>{value}</span>
        {unit && <span className="font-mono text-xs text-ink-500">{unit}</span>}
      </div>
      <div className="mt-2 flex items-center gap-2">
        <span className={`num text-xs ${trendColor} flex items-center gap-0.5`}>
          <i className={`ph-bold ${trend === 'up' ? 'ph-trend-up' : trend === 'down' ? 'ph-trend-down' : 'ph-minus'}`}></i>
          {delta}
        </span>
        <span className="font-mono text-[10px] text-ink-400">vs 昨日</span>
      </div>
      {/* Sparkline */}
      <svg viewBox="0 0 100 28" className="mt-3 w-full h-7">
        <polyline points={spark} fill="none" stroke="#10b981" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
        <polyline points={`${spark} 100,28 0,28`} fill="url(#sparkfill)" opacity="0.18" />
        <defs>
          <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#10b981"/>
            <stop offset="100%" stopColor="#10b981" stopOpacity="0"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
  );
}

/* ---------- Live Status (breathing alert badge) ---------- */
function LiveAlerts() {
  const [alerts, setAlerts] = useState([
    { id: 1, level: 'P0', type: '越界', loc: '西湖景区 · 北山街', t: '12:42', assignee: null },
    { id: 2, level: 'P1', type: '低电', loc: '滨江区 · 江陵路', t: '12:38', assignee: '李墨白' },
    { id: 3, level: 'P1', type: '禁停', loc: '余杭区 · 仓前街', t: '12:33', assignee: '王九叙' },
    { id: 4, level: 'P2', type: '倒地', loc: '萧山区 · 市心北路', t: '12:21', assignee: null },
    { id: 5, level: 'P2', type: '聚集堆积', loc: '拱墅区 · 武林广场', t: '12:09', assignee: '李墨白' },
  ]);
  const [pulse, setPulse] = useState(false);
  useEffect(() => {
    const id = setInterval(() => {
      setPulse(true);
      setTimeout(() => setPulse(false), 2400);
    }, 6500);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="bento p-6 rise rise-4 flex flex-col">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2">
          <i className="ph-bold ph-bell-ringing text-ink-500"></i>
          <span className="font-mono text-[10px] uppercase tracking-widest text-ink-500">live alerts · 告警中心</span>
        </div>
        <div className="flex items-center gap-1.5">
          {pulse && <span className="num text-[10px] pop bg-crit-500/15 text-crit-600 px-2 py-0.5 rounded-full font-medium">+1 new</span>}
          <button className="text-[10px] text-ink-500 hover:text-ink-950">全部</button>
        </div>
      </div>
      <div className="divide-y divide-ink-100 -mx-2">
        {alerts.map(a => {
          const color = a.level === 'P0' ? 'bg-crit-500' : a.level === 'P1' ? 'bg-warn-500' : 'bg-ink-400';
          const textColor = a.level === 'P0' ? 'text-crit-600' : a.level === 'P1' ? 'text-warn-600' : 'text-ink-500';
          return (
            <div key={a.id} className="flex items-center gap-3 px-2 py-3 hover:bg-ink-50 rounded-lg cursor-pointer">
              <span className={`w-1.5 h-1.5 rounded-full ${color} ${a.level === 'P0' ? 'breathe' : ''}`}></span>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <span className={`num text-[10px] font-semibold ${textColor}`}>{a.level}</span>
                  <span className="text-xs font-medium text-ink-900">{a.type}</span>
                  <span className="font-mono text-[10px] text-ink-400">· {a.t}</span>
                </div>
                <div className="text-[11px] text-ink-500 truncate mt-0.5">{a.loc}</div>
              </div>
              <div className="text-right">
                {a.assignee ? (
                  <span className="text-[10px] text-ink-600">{a.assignee}</span>
                ) : (
                  <button className="text-[10px] text-accent-700 hover:underline">指派 →</button>
                )}
              </div>
            </div>
          );
        })}
      </div>
      <div className="mt-3 pt-3 border-t border-ink-100 flex items-center justify-between">
        <span className="font-mono text-[10px] text-ink-500">P90 响应 <span className="num text-ink-950 font-semibold">8.2 min</span></span>
        <a href="#" className="text-[11px] text-ink-700 hover:text-ink-950 inline-flex items-center gap-1" data-tactile>查看告警台 <i className="ph ph-arrow-right"></i></a>
      </div>
    </div>
  );
}

/* ---------- Map Bento — Operations Center ---------- */
function OpsMap() {
  // Simulated zones
  const zones = [
    { id: 'westlake', name: '西湖景区', x: 24, y: 32, vehicles: 842, gap: -38, type: 'over' },
    { id: 'binjiang', name: '滨江',     x: 62, y: 58, vehicles: 416, gap: +24, type: 'under' },
    { id: 'xihu',     name: '西溪',     x: 18, y: 60, vehicles: 198, gap: -12, type: 'over' },
    { id: 'xiaoshan', name: '萧山',     x: 78, y: 38, vehicles: 612, gap: +5,  type: 'ok' },
    { id: 'gongshu',  name: '拱墅',     x: 48, y: 22, vehicles: 524, gap: +8,  type: 'ok' },
    { id: 'yuhang',   name: '余杭',     x: 36, y: 78, vehicles: 287, gap: -22, type: 'over' },

  return (
    <div className="bento p-6 rise rise-3 flex flex-col">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2">
          <i className="ph-bold ph-map-trifold text-ink-500"></i>
          <span className="font-mono text-[10px] uppercase tracking-widest text-ink-500">map ops · 地图调度</span>
        </div>
        <div className="flex items-center gap-1">
          {['车辆', '电量', '热力', '供需'].map((t, i) => (
            <button key={t} className={`text-[10px] px-2 py-1 rounded ${i === 0 ? 'bg-ink-950 text-ink-50' : 'text-ink-500 hover:text-ink-950'}`}>{t}</button>
          ))}
        </div>
      </div>

      <div className="relative aspect-[16/9] rounded-xl bg-ink-100 overflow-hidden border border-ink-200">
        {/* Stylized map */}
        <svg viewBox="0 0 320 180" className="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid slice">
          <defs>
            <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e4e4e7" strokeWidth="0.5"/>
            </pattern>
          </defs>
          <rect width="320" height="180" fill="url(#grid2)"/>
          {/* River */}
          <path d="M -20 60 Q 80 80 160 50 T 360 70" stroke="#bae6fd" strokeWidth="10" fill="none" strokeLinecap="round" opacity="0.7"/>

          {/* Heat zones (subtle) */}
          <ellipse cx="76.8" cy="57.6" rx="22" ry="14" fill="#e11d48" opacity="0.06"/>
          <ellipse cx="198.4" cy="104.4" rx="22" ry="14" fill="#0ea5e9" opacity="0.06"/>
        </svg>

        {/* Zone markers */}
        {zones.map(z => {
          const color = z.type === 'over' ? 'bg-warn-500' : z.type === 'under' ? 'bg-info-500' : 'bg-accent-500';
          const textColor = z.type === 'over' ? 'text-warn-600' : z.type === 'under' ? 'text-info-600' : 'text-accent-700';
          return (
            <div key={z.id} className="absolute -translate-x-1/2 -translate-y-1/2 group" style={{ left: `${z.x}%`, top: `${z.y}%` }}>
              <div className="relative">
                {z.type !== 'ok' && <span className={`absolute inset-0 rounded-full ${color} pulse-ring opacity-40`}></span>}
                <div className={`relative w-8 h-8 rounded-full ${color} text-white grid place-items-center font-mono text-[10px] font-semibold shadow-md`}>
                  {z.vehicles}
                </div>
              </div>
              <div className="absolute left-1/2 -translate-x-1/2 mt-1 whitespace-nowrap text-[9px] font-mono">
                <div className="text-ink-700 font-medium">{z.name}</div>
                <div className={`${textColor}`}>{z.gap > 0 ? `缺 ${z.gap}` : z.gap < 0 ? `堆 ${-z.gap}` : '平衡'}</div>
              </div>
            </div>
          );
        })}

        {/* Toolbar */}
        <div className="absolute top-3 left-3 flex flex-col gap-1">
          {['框选', '测距', '围栏'].map((t, i) => (
            <button key={t} className="text-[10px] px-2 py-1 rounded bg-white/95 backdrop-blur shadow text-ink-700 hover:text-ink-950 flex items-center gap-1">
              <i className={`ph ${['ph-frame-corners', 'ph-ruler', 'ph-map-pin'][i]}`}></i> {t}
            </button>

/* ---------- Command Input (Typewriter) ---------- */
function CommandInput() {
  const prompts = [
    '查找萧山区低电车辆并生成换电任务',
    '对比上周与本周武林广场骑行起终点',
    '导出 5 月余杭区禁停违规清单',
    '查看 8:00 早高峰滨江缺车预测',
  ];
  const [idx, setIdx] = useState(0);
  const [text, setText] = useState('');
  const [deleting, setDeleting] = useState(false);
  useEffect(() => {
    const full = prompts[idx];
    let t;
    if (!deleting && text.length < full.length) {
      t = setTimeout(() => setText(full.slice(0, text.length + 1)), 45);
    } else if (!deleting && text.length === full.length) {
      t = setTimeout(() => setDeleting(true), 1600);
    } else if (deleting && text.length > 0) {
      t = setTimeout(() => setText(full.slice(0, text.length - 1)), 25);
    } else {
      setDeleting(false);
      setIdx(i => (i + 1) % prompts.length);
    }
    return () => clearTimeout(t);
  }, [text, deleting, idx]);
  return (
    <div className="bento p-6 rise rise-5 relative overflow-hidden">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2">
          <i className="ph-bold ph-sparkle text-ink-500"></i>
          <span className="font-mono text-[10px] uppercase tracking-widest text-ink-500">ops assistant · 智能指令</span>
        </div>
        <span className="font-mono text-[9px] text-ink-400 uppercase tracking-widest">beta</span>
      </div>
      <div className="relative">
        <div className="flex items-center gap-2 h-12 px-4 rounded-xl bg-ink-100 border border-ink-200">
          <i className="ph ph-magnifying-glass text-ink-500"></i>
          <span className="text-sm text-ink-900">{text}</span>
          <span className="w-0.5 h-4 bg-accent-600 caret"></span>
          <span className="ml-auto font-mono text-[10px] text-ink-500 bg-ink-200 px-1.5 py-0.5 rounded">↵ 执行</span>
        </div>
        {/* Suggested quick actions */}

          {['生成调度', '批量换电', '围栏发布', '导出报表'].map(t => (
            <button key={t} className="text-[10px] px-2.5 py-1 rounded-full border border-ink-200 text-ink-700 hover:bg-ink-950 hover:text-ink-50 hover:border-ink-950 transition-colors">
