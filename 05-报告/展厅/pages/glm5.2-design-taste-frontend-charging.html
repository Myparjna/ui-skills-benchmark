const { useState, useEffect, useRef } = React;

/* Magnetic button (direct DOM) */
function Magnetic({ children, className = '', s = 0.22, ...props }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const x = e.clientX - r.left - r.width / 2;
    const y = e.clientY - r.top - r.height / 2;
    el.style.transform = `translate(${x * s}px, ${y * s}px)`;
  };
  const onLeave = () => { if (ref.current) ref.current.style.transform = 'translate(0,0)'; };
  return <button ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} className={`transition-transform duration-300 will-change-transform ${className}`} {...props}>{children}</button>;
}

function ChargingMock() {
  const [pct, setPct] = useState(62);
  useEffect(() => {
    const id = setInterval(() => setPct(p => p >= 100 ? 12 : p + 0.4), 200);
    return () => clearInterval(id);
  }, []);
  const R = 64, C = 2 * Math.PI * R, off = C * (1 - pct / 100);
  return (
    <div className="flex-1 flex flex-col items-center justify-center">
      <div className="relative w-40 h-40">
        <svg viewBox="0 0 160 160" className="w-full h-full -rotate-90">

          <circle cx="80" cy="80" r={R} fill="none" stroke="#0a84ff" strokeWidth="8" strokeLinecap="round"
                  strokeDasharray={C} strokeDashoffset={off} style={{ transition: 'stroke-dashoffset 0.2s linear' }}/>

        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <i className="ph-fill ph-lightning text-volt-500 text-2xl"></i>

          <div className="font-mono text-[9px] text-ink-500 uppercase tracking-widest">charging</div>
        </div>
      </div>
      <div className="mt-4 w-full grid grid-cols-3 gap-1 text-center">
        {[
          { k: '62.4', v: 'kW', l: '功率' },
          { k: '18.7', v: 'kWh', l: '已充' },
          { k: '00:24', v: 'min', l: '剩余' },
        ].map(s => (
          <div key={s.l} className="bg-ink-100 rounded-lg py-1.5">
