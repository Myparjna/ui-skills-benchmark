<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>城市运营后台 · 共享两轮运营管理系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  /* ===== Nuxt UI v4 语义色 token（运营后台：primary=emerald，neutral=slate） ===== */
  @theme {
    --font-sans: 'Noto Sans SC', 'Inter', system-ui, sans-serif;
    --color-primary-50: #ecfdf5;
    --color-primary-100: #d1fae5;
    --color-primary-200: #a7f3d0;
    --color-primary-300: #6ee7b7;
    --color-primary-400: #34d399;
    --color-primary-500: #10b981;
    --color-primary-600: #059669;
    --color-primary-700: #047857;
    --color-primary-800: #065f46;
    --color-primary-900: #064e3b;
    --color-primary-950: #022c22;
    --color-secondary-500: #0ea5e9;
    --color-info-500: #3b82f6;
    --color-warning-500: #f59e0b;
    --color-error-500: #ef4444;
    --color-neutral-50: #f8fafc;
    --color-neutral-100: #f1f5f9;
    --color-neutral-200: #e2e8f0;
    --color-neutral-300: #cbd5e1;
    --color-neutral-400: #94a3b8;
    --color-neutral-500: #64748b;
    --color-neutral-600: #475569;
    --color-neutral-700: #334155;
    --color-neutral-800: #1e293b;
    --color-neutral-900: #0f172a;
    --color-neutral-950: #020617;
  }
  :root {
    --ui-radius: 0.375rem;
    --ui-container: 96rem;
    --ui-header-height: 3.5rem;
    --ui-bg: #f8fafc;
    --ui-bg-muted: #f1f5f9;
    --ui-bg-elevated: #ffffff;
    --ui-bg-accented: #e2e8f0;
    --ui-bg-inverted: #0f172a;
    --ui-text: #0f172a;
    --ui-text-muted: #64748b;
    --ui-text-toned: #475569;
    --ui-text-dimmed: #94a3b8;
    --ui-text-highlighted: #020617;
    --ui-text-inverted: #ffffff;
    --ui-border: #e2e8f0;
    --ui-border-muted: #f1f5f9;
    --ui-border-accented: #cbd5e1;
    --ui-primary: var(--color-primary-500);
  }
  html, body { background: var(--ui-bg); color: var(--ui-text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .text-default { color: var(--ui-text); }
  .text-muted { color: var(--ui-text-muted); }
  .text-toned { color: var(--ui-text-toned); }
  .text-dimmed { color: var(--ui-text-dimmed); }
  .text-highlighted { color: var(--ui-text-highlighted); }
  .text-inverted { color: var(--ui-text-inverted); }
  .text-primary { color: var(--ui-primary); }
  .text-secondary { color: var(--color-secondary-500); }
  .bg-default { background-color: var(--ui-bg); }
  .bg-muted { background-color: var(--ui-bg-muted); }
  .bg-elevated { background-color: var(--ui-bg-elevated); }
  .bg-accented { background-color: var(--ui-bg-accented); }
  .bg-inverted { background-color: var(--ui-bg-inverted); }
  .bg-primary { background-color: var(--ui-primary); }
  .border-default { border-color: var(--ui-border); }
  .border-muted { border-color: var(--ui-border-muted); }
  .border-accented { border-color: var(--ui-border-accented); }
  .nui-btn { @apply inline-flex items-center justify-center gap-1.5 font-medium rounded-md transition-colors select-none whitespace-nowrap; }
  .nui-btn-solid-primary { background-color: var(--ui-primary); color: #fff; }
  .nui-btn-solid-primary:hover { background-color: var(--color-primary-600); }
  .nui-btn-solid-neutral { background-color: var(--ui-bg-inverted); color: #fff; }
  .nui-btn-outline { border: 1px solid var(--ui-border); background: transparent; color: var(--ui-text); }
  .nui-btn-outline:hover { background-color: var(--ui-bg-muted); }
  .nui-btn-soft-primary { background-color: var(--color-primary-100); color: var(--color-primary-700); }
  .nui-btn-subtle { background-color: var(--ui-bg-muted); color: var(--ui-text); }
  .nui-btn-subtle:hover { background-color: var(--ui-bg-accented); }
  .nui-btn-ghost { background: transparent; color: var(--ui-text); }
  .nui-btn-ghost:hover { background-color: var(--ui-bg-muted); }
  .nui-card { @apply rounded-lg bg-elevated border border-muted; }
  .nui-input { @apply rounded-md border border-default bg-default px-3 py-1.5 text-default text-sm w-full outline-none transition-colors; }
  .nui-input:focus { border-color: var(--ui-primary); box-shadow: 0 0 0 1px var(--ui-primary); }
  [v-cloak] { display: none; }
  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  /* 地图 */
  .map-bg {
    background:
      radial-gradient(circle at 25% 30%, rgba(16,185,129,.15) 0, transparent 12%),
      radial-gradient(circle at 70% 65%, rgba(245,158,11,.15) 0, transparent 10%),
      radial-gradient(circle at 55% 20%, rgba(59,130,246,.12) 0, transparent 10%),
      radial-gradient(circle at 40% 80%, rgba(239,68,68,.1) 0, transparent 8%),
      linear-gradient(135deg, #f1f5f9 0%, #ffffff 100%);
  }
  .map-grid {
    background-image:
      linear-gradient(rgba(15,23,42,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .ring-pulse::after { content:''; position:absolute; inset:-4px; border-radius:50%; border:2px solid currentColor; opacity:.4; animation: ring 1.5s infinite; }
  @keyframes ring { 0%{ transform: scale(.8); opacity:.7;} 100%{ transform: scale(2); opacity:0; } }
  /* 侧栏导航 hover */
  .nav-item { @apply flex items-center gap-2.5 px-3 py-2 rounded-md text-sm text-toned hover:bg-muted hover:text-highlighted transition-colors cursor-pointer; }
  .nav-item-active { @apply bg-primary-50 text-primary-700 hover:bg-primary-50 hover:text-primary-700 font-medium; }
  .nav-group-label { @apply px-3 pt-4 pb-1 text-[10px] font-semibold uppercase tracking-wider text-dimmed; }
  /* 表格 */
  .nui-table th { @apply text-xs font-semibold text-muted text-left px-3 py-2 border-b border-muted whitespace-nowrap; }
  .nui-table td { @apply text-sm text-default px-3 py-2.5 border-b border-muted whitespace-nowrap; }
  .nui-table tbody tr:hover { background-color: var(--ui-bg-muted); }
  /* 趋势图 */
  .bar-chart-bar { transition: height .3s ease; }
</style>
</head>
<body>
<div id="app" v-cloak></div>

<script>
const { createApp, computed, ref, reactive, onMounted, h, watch } = Vue;

/* ========== Nuxt UI 等效组件 ========== */
const UButton = {
  name:'UButton', props:{ label:String, icon:String, trailingIcon:String, size:{default:'sm'}, color:{default:'primary'}, variant:{default:'solid'}, to:String, disabled:Boolean },
  setup(p,{ slots }){
    const size = computed(()=>({ xs:'text-xs px-2 py-1', sm:'text-sm px-2.5 py-1.5', md:'text-sm px-3 py-2', lg:'text-base px-4 py-2.5' }[p.size]));
    const v = computed(()=>{
      const m = {
        primary:{ solid:'nui-btn-solid-primary', soft:'nui-btn-soft-primary', outline:'nui-btn-outline', ghost:'nui-btn-ghost', subtle:'nui-btn-subtle' },
        neutral:{ solid:'nui-btn-solid-neutral', soft:'nui-btn-subtle', outline:'nui-btn-outline', ghost:'nui-btn-ghost', subtle:'nui-btn-subtle' },
        error:{ solid:'bg-red-500 text-white hover:bg-red-600', soft:'bg-red-100 text-red-700', outline:'border border-red-300 text-red-700', ghost:'text-red-600 hover:bg-red-50', subtle:'bg-red-100 text-red-700' }
      };
      return (m[p.color]||m.primary)[p.variant] || 'nui-btn-solid-primary';
    });
    return () => h(p.to?'a':'button', { href:p.to, disabled:p.disabled, class:['nui-btn', size.value, v.value] }, [
      p.icon?h('i',{'data-lucide':p.icon,class:'size-4 shrink-0'}):null,
      slots.default?slots.default():p.label,
      p.trailingIcon?h('i',{'data-lucide':p.trailingIcon,class:'size-4 shrink-0'}):null,
    ]);
  }
};
const UBadge = { name:'UBadge', props:{ color:{default:'primary'}, variant:{default:'subtle'}, label:String, icon:String }, setup(p){
  const c = { primary:'bg-emerald-100 text-emerald-700', neutral:'bg-slate-100 text-slate-700', success:'bg-emerald-100 text-emerald-700', warning:'bg-amber-100 text-amber-700', error:'bg-red-100 text-red-700', info:'bg-blue-100 text-blue-700' };
  return () => h('span', { class:['inline-flex items-center gap-1 rounded-md px-1.5 py-0.5 text-xs font-medium', c[p.color]||c.primary] }, [ p.icon?h('i',{'data-lucide':p.icon,class:'size-3'}):null, p.label ]);
}};
const UCard = { name:'UCard', props:{ ui:Object }, setup(p,{ slots }){ return () => h('div', { class: ['nui-card overflow-hidden', p.ui?.root] }, [
  slots.header?h('div',{class:['px-4 py-3 border-b border-muted flex items-center justify-between', p.ui?.header]}, slots.header()):null,
  h('div', { class: ['p-4', p.ui?.body] }, slots.default?.()),
  slots.footer?h('div',{class:['px-4 py-3 border-t border-muted bg-muted/30', p.ui?.footer]}, slots.footer()):null,
]); }};
const UInput = { name:'UInput', props:{ modelValue:String, placeholder:String, icon:String, type:{default:'text'} }, emits:['update:modelValue'], setup(p,{ emit }){ return () => h('div',{class:'relative w-full'},[ p.icon?h('i',{'data-lucide':p.icon,class:'size-4 absolute left-3 top-1/2 -translate-y-1/2 text-dimmed'}):null, h('input',{ type:p.type, value:p.modelValue, placeholder:p.placeholder, onInput:e=>emit('update:modelValue',e.target.value), class:['nui-input', p.icon?'pl-9':''] }) ]); }};

/* ========== 应用 ========== */
const App = {
  components: { UButton, UBadge, UCard, UInput },
  setup() {
    // 侧栏导航
    const navGroups = [
      { label:'运营', items:[
        { key:'overview', label:'运营总览', icon:'layout-dashboard' },
        { key:'mapops', label:'地图调度中心', icon:'map' },
        { key:'vehicles', label:'车队资产', icon:'bike' },
        { key:'battery', label:'电池与能源', icon:'battery-charging' },
        { key:'workorders', label:'运维工单', icon:'clipboard-list' },
      ]},
      { label:'治理', items:[
        { key:'zones', label:'规则与区域', icon:'shield' },
        { key:'compliance', label:'合规监管', icon:'landmark' },
        { key:'analytics', label:'数据报表', icon:'bar-chart-3' },
      ]},
      { label:'系统', items:[
        { key:'org', label:'组织与权限', icon:'users' },
        { key:'settings', label:'配置与对接', icon:'settings' },
      ]},
    ];
    const activeNav = ref('overview');

    // 时间范围 & 城市
    const timeRange = ref('today');
    const timeRanges = [{k:'today',l:'今日'},{k:'yesterday',l:'昨日'},{k:'week',l:'本周'},{k:'month',l:'本月'}];
    const city = ref('上海');

    // KPI 数据
    const kpis = [
      { label:'订单数', value:'48,392', delta:'+12.4%', up:true, icon:'receipt', color:'primary', sub:'较昨日 +5,324' },
      { label:'GMV 收入', value:'¥186,420', delta:'+8.7%', up:true, icon:'wallet', color:'primary', sub:'较昨日 +¥14,920' },
      { label:'单车日均骑行', value:'4.6 次', delta:'+0.3', up:true, icon:'trending-up', color:'info', sub:'目标 5.0 次' },
      { label:'可用率', value:'92.3%', delta:'-1.2%', up:false, icon:'activity', color:'warning', sub:'目标 ≥ 90%' },
    ];

    // 车辆状态
    const vehicleStatus = [
      { label:'可用', value:21834, color:'#10b981' },
      { label:'使用中', value:4521, color:'#0ea5e9' },
      { label:'低电', value:1820, color:'#f59e0b' },
      { label:'故障', value:423, color:'#ef4444' },
      { label:'离线', value:678, color:'#94a3b8' },
      { label:'回收中', value:124, color:'#6366f1' },
    ];
    const totalVehicles = vehicleStatus.reduce((s, i) => s + i.value, 0);

    // 电池分布
    const batteryDist = [
      { range:'0-10%', value:182, color:'#ef4444' },
      { range:'10-30%', value:1245, color:'#f59e0b' },
      { range:'30-60%', value:3680, color:'#eab308' },
      { range:'60-100%', value:5163, color:'#10b981' },
    ];

    // 告警
    const alerts = [
      { level:'P0', title:'浦东陆家嘴聚集堆积', area:'浦东 · 世纪大道', time:'2 分钟前', type:'聚集堆积', color:'error' },
      { level:'P0', title:'静安寺禁停区违规', area:'静安 · 南京西路', time:'5 分钟前', type:'禁停违规', color:'error' },
      { level:'P1', title:'徐汇区低电车辆聚集', area:'徐汇 · 衡山路', time:'12 分钟前', type:'低电风险', color:'warning' },
      { level:'P1', title:'闵行车辆离线超 1 小时', area:'闵行 · 莘庄', time:'25 分钟前', type:'离线告警', color:'warning' },
      { level:'P2', title:'长宁疑似盗损车辆', area:'长宁 · 中山公园', time:'38 分钟前', type:'疑似盗损', color:'info' },
    ];

    // 工单
    const workorders = [
      { id:'WO-20260617-001', type:'换电', station:'浦东 · 世纪公园西门', assignee:'李伟', status:'执行中', priority:'P1', eta:'15 分钟' },
      { id:'WO-20260617-002', type:'调度搬运', station:'静安 · 静安寺地铁站', assignee:'张磊', status:'待接单', priority:'P1', eta:'30 分钟' },
      { id:'WO-20260617-003', type:'故障维修', station:'徐汇 · 徐家汇', assignee:'王芳', status:'待派单', priority:'P2', eta:'1 小时' },
      { id:'WO-20260617-004', type:'违停处置', station:'黄浦 · 人民广场', assignee:'陈刚', status:'执行中', priority:'P0', eta:'10 分钟' },
      { id:'WO-20260617-005', type:'巡检', station:'虹口 · 四川北路', assignee:'刘洋', status:'已完成', priority:'P3', eta:'已完成' },
    ];

    // 24h 订单趋势
    const hourlyOrders = [
      320, 180, 120, 90, 70, 110, 380, 920, 1450, 1280, 1100, 1340,
      1520, 1380, 1220, 1180, 1340, 1820, 2240, 1980, 1560, 1240, 880, 560
    ];
    const maxOrder = Math.max(...hourlyOrders);

    // 供需缺口
    const supplyDemand = [
      { area:'陆家嘴', gap:-340, type:'缺车' },
      { area:'静安寺', gap:-220, type:'缺车' },
      { area:'徐家汇', gap:-180, type:'缺车' },
      { area:'人民广场', gap:-150, type:'缺车' },
      { area:'南京西路', gap:280, type:'堆车' },
      { area:'世纪公园', gap:190, type:'堆车' },
      { area:'莘庄', gap:160, type:'堆车' },
    ];

    // 地图车辆点
    const mapVehicles = [
      { x:22, y:28, type:'available', count:34 },
      { x:48, y:35, type:'cluster', count:120 },
      { x:65, y:22, type:'low', count:8 },
      { x:35, y:55, type:'available', count:42 },
      { x:72, y:48, type:'cluster', count:86 },
      { x:55, y:68, type:'alert', count:3 },
      { x:28, y:75, type:'available', count:18 },
      { x:80, y:72, type:'low', count:12 },
      { x:18, y:50, type:'alert', count:5 },
    ];

    const selectedVehicle = ref(null);

    onMounted(() => { window.lucide && window.lucide.createIcons(); });
    watch(activeNav, () => setTimeout(() => window.lucide && window.lucide.createIcons(), 50));

    const formatNum = (n) => n.toLocaleString('zh-CN');
    const pct = (n) => (n / totalVehicles * 100).toFixed(1) + '%';

    return {
      navGroups, activeNav, timeRange, timeRanges, city,
      kpis, vehicleStatus, totalVehicles, batteryDist,
      alerts, workorders, hourlyOrders, maxOrder, supplyDemand, mapVehicles, selectedVehicle,
      formatNum, pct,
    };
  },
  template: `
  <UApp>
    <div class="flex h-screen overflow-hidden bg-default">

      <!-- ============ 左侧 DashboardSidebar ============ -->
      <aside class="w-60 shrink-0 bg-elevated border-r border-muted flex flex-col">
        <!-- Sidebar Header (Logo + Search) -->
        <div class="h-14 px-4 flex items-center gap-2 border-b border-muted">
          <span class="inline-flex size-8 items-center justify-center rounded-md bg-gradient-to-br from-primary-500 to-emerald-700 text-white">
            <i data-lucide="bike" class="size-5"></i>
          </span>
          <div class="leading-tight">
            <p class="text-sm font-bold text-highlighted">城市运营后台</p>
            <p class="text-[10px] text-muted">v2.4 · 上海站</p>
          </div>
        </div>

        <!-- Search Button -->
        <div class="p-3">
          <button class="w-full flex items-center gap-2 px-3 py-1.5 rounded-md border border-muted bg-muted/50 text-xs text-muted hover:bg-muted transition">
            <i data-lucide="search" class="size-3.5"></i>
            <span>搜索车辆、工单、区域</span>
            <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-elevated border border-muted">⌘K</span>
          </button>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto px-2 pb-4">
          <template v-for="g in navGroups" :key="g.label">
            <div class="nav-group-label">{{ g.label }}</div>
            <a v-for="i in g.items" :key="i.key" @click="activeNav=i.key"
              :class="['nav-item', activeNav===i.key?'nav-item-active':'']">
              <i :data-lucide="i.icon" class="size-4 shrink-0"></i>
              <span>{{ i.label }}</span>
              <span v-if="i.key==='workorders'" class="ml-auto"><UBadge label="6" color="error" variant="subtle" /></span>
              <span v-if="i.key==='mapops'" class="ml-auto"><UBadge label="3" color="warning" variant="subtle" /></span>
            </a>
          </template>
        </nav>

        <!-- Sidebar Footer (User) -->
        <div class="border-t border-muted p-3">
          <div class="flex items-center gap-2 px-2 py-2 rounded-md hover:bg-muted cursor-pointer">
            <div class="size-8 rounded-full bg-gradient-to-br from-slate-700 to-slate-900 text-white flex items-center justify-center text-xs font-bold">运</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-highlighted truncate">运营经理 · 周航</p>
              <p class="text-[10px] text-muted truncate">上海城市站 · 全权限</p>
            </div>
            <i data-lucide="chevron-up" class="size-4 text-muted"></i>
          </div>
        </div>
      </aside>

      <!-- ============ 右侧 DashboardPanel ============ -->
      <div class="flex-1 flex flex-col overflow-hidden">

        <!-- DashboardNavbar -->
        <header class="h-14 bg-elevated border-b border-muted flex items-center justify-between px-5 shrink-0">
          <div class="flex items-center gap-3">
            <button class="size-8 rounded-md hover:bg-muted flex items-center justify-center text-muted"><i data-lucide="panel-left" class="size-4"></i></button>
            <div class="flex items-center gap-1.5 text-sm">
              <span class="text-muted">运营总览</span>
              <i data-lucide="chevron-right" class="size-3 text-dimmed"></i>
              <span class="text-highlighted font-medium">上海城市站</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <!-- 时间范围切换 -->
            <div class="flex items-center bg-muted rounded-md p-0.5">
              <button v-for="t in timeRanges" :key="t.k" @click="timeRange=t.k"
                :class="['px-2.5 py-1 text-xs rounded transition', timeRange===t.k?'bg-elevated text-highlighted shadow-sm':'text-muted']">{{ t.l }}</button>
            </div>
            <UButton icon="refresh-cw" color="neutral" variant="ghost" size="sm" />
            <UButton icon="download" color="neutral" variant="outline" size="sm" label="导出" />
            <UButton icon="plus" color="primary" variant="solid" size="sm" label="创建工单" />
          </div>
        </header>

        <!-- DashboardToolbar -->
        <div class="h-12 bg-elevated border-b border-muted flex items-center justify-between px-5 shrink-0">
          <div class="flex items-center gap-2">
            <UBadge :label="city" color="primary" variant="soft" icon="map-pin" />
            <UBadge label="全车型" color="neutral" variant="subtle" icon="bike" />
            <UBadge label="自然日" color="neutral" variant="subtle" icon="calendar" />
            <button class="text-xs text-primary hover:underline ml-2">+ 添加筛选</button>
          </div>
          <div class="flex items-center gap-3 text-xs text-muted">
            <span class="flex items-center gap-1"><span class="size-1.5 rounded-full bg-emerald-500"></span>数据实时（10 秒前同步）</span>
            <span>时区：UTC+8</span>
          </div>
        </div>

        <!-- Body -->
