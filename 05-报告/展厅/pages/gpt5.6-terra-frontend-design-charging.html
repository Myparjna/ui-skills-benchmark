<!doctype html>
<html lang="zh-CN">
<head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2310a37f'/%3E%3C/svg%3E">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>充好电｜附近好桩一图看全</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@500;600;700;800&display=swap');
:root{--blue:#1677ff;--cyan:#15cdb0;--navy:#0b1f3a;--paper:#f4f7fb;--muted:#7790ab;--orange:#fa8c16;--green:#25b35c;--red:#e94d5f}*{box-sizing:border-box}body{margin:0;background:#dce5ef;color:var(--navy);font-family:Manrope,"PingFang SC",sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--paper);position:relative;overflow:hidden;padding-bottom:82px}.top{height:166px;background:linear-gradient(145deg,#126ae5,#1ac7b2);color:white;padding:19px 20px 0;position:relative;overflow:hidden}.top:after{content:"";position:absolute;width:210px;height:210px;border:1px solid rgba(255,255,255,.4);border-radius:50%;right:-83px;top:-77px;box-shadow:0 0 0 34px rgba(255,255,255,.08),0 0 0 68px rgba(255,255,255,.05)}.topline{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;font-size:13px}.loc{display:flex;gap:5px;align-items:center}.pin{width:11px;height:11px;background:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}.pin:after{content:"";display:block;width:4px;height:4px;margin:3.5px;background:#1677ff;border-radius:50%}.notice{border:0;background:rgba(255,255,255,.18);border-radius:20px;color:#fff;padding:7px 10px;font-size:11px}.top h1{position:relative;z-index:1;margin:28px 0 4px;font-size:27px;letter-spacing:-.06em}.top p{position:relative;z-index:1;margin:0;font-size:12px;opacity:.85}.map{height:268px;background:#d8edf0;position:relative;overflow:hidden}.roads{position:absolute;inset:-45px;background:repeating-linear-gradient(24deg,transparent 0 41px,rgba(255,255,255,.92) 42px 48px,transparent 49px 91px),repeating-linear-gradient(111deg,transparent 0 63px,rgba(255,255,255,.78) 64px 70px,transparent 71px 123px)}.water{position:absolute;width:268px;height:145px;border-radius:45% 55% 30% 55%;background:#b9e7ea;right:-40px;bottom:-20px;transform:rotate(-20deg)}.street{position:absolute;font:10px DM Mono;color:#6595a3}.station-dot{position:absolute;z-index:2;display:grid;place-items:center;width:42px;height:42px;border:3px solid #fff;border-radius:50%;background:var(--green);color:#fff;font:800 12px Manrope;box-shadow:0 5px 11px rgba(7,71,70,.22);transition:.2s}.station-dot.hot{background:var(--orange)}.station-dot:hover{transform:scale(1.16)}.mypos{position:absolute;z-index:3;left:46%;top:42%;width:17px;height:17px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 6px rgba(22,119,255,.17)}.locate{position:absolute;z-index:3;right:15px;top:16px;border:0;background:#fff;width:38px;height:38px;border-radius:12px;color:var(--blue);font-size:20px;box-shadow:0 3px 10px #8bb0ba}.sheet{position:relative;margin-top:-69px;z-index:5;background:var(--paper);border-radius:25px 25px 0 0;padding:18px 16px 10px}.grab{width:34px;height:4px;border-radius:8px;background:#c9d4df;margin:0 auto 15px}.station-card{background:#fff;border-radius:17px;padding:15px;box-shadow:0 7px 22px rgba(29,68,107,.08);display:grid;grid-template-columns:1fr auto;gap:6px}.station-card h2{font-size:15px;margin:0 0 5px}.station-card p{margin:0;color:#7a8ca3;font-size:11px}.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#238a51;margin-right:7px}.tag i{width:6px;height:6px;background:var(--green);border-radius:50%}.price{font:700 18px Manrope;color:var(--blue);align-self:center}.price small{font-size:10px;color:#7a8ca3;font-weight:500}.rowhead{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 11px}.rowhead b{font-size:15px}.rowhead span{font-size:11px;color:var(--blue)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{border:0;border-radius:13px;background:#fff;color:#405875;padding:12px 4px;font-size:11px;box-shadow:0 4px 15px rgba(29,68,107,.05)}.quick strong{display:block;color:var(--blue);font:18px DM Mono;margin-bottom:5px}.charge{margin:19px 0 0;background:var(--navy);border-radius:19px;padding:16px;color:#fff;display:flex;align-items:center;gap:16px}.ring{width:72px;height:72px;flex:none;border-radius:50%;background:conic-gradient(var(--cyan) 0 71%,#24415f 71%);display:grid;place-items:center}.ring:before{content:"";position:absolute;width:58px;height:58px;border-radius:50%;background:var(--navy)}.ring b{z-index:1;font-size:15px}.charge-info{min-width:0}.charge-info h3{margin:0 0 4px;font-size:14px}.charge-info p{font-size:11px;line-height:1.7;color:#a8bed2;margin:0}.charge button{border:1px solid #4a6a87;background:transparent;border-radius:8px;padding:8px;color:#fff;font-size:11px;margin-left:auto}.payment{margin-top:16px;background:#e4f8f2;border-radius:17px;padding:14px;display:flex;align-items:center;gap:10px}.coin{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--cyan);color:#073a35;font-weight:800}.payment b{font-size:13px}.payment span{display:block;font-size:10px;color:#4e8075;margin-top:2px}.payment button{margin-left:auto;border:0;background:transparent;color:#087e72;font-size:12px;font-weight:800}.nav{height:73px;position:absolute;bottom:0;inset-inline:0;background:rgba(255,255,255,.96);border-top:1px solid #e5edf5;display:flex;align-items:center;justify-content:space-around;z-index:7}.tab{border:0;background:transparent;color:#8496ac;font-size:10px;padding:4px 8px;min-width:50px}.tab i{display:block;height:23px;font-style:normal;font:20px/21px DM Mono}.tab.active{color:var(--blue);font-weight:800}.scan{transform:translateY(-17px);border-radius:50%;width:57px;height:57px;background:linear-gradient(140deg,#1677ff,#16cbb3);color:#fff;box-shadow:0 8px 18px #8bcfc8;font-size:10px}.scan i{font-size:22px;line-height:18px}.modal{position:fixed;inset:0;background:rgba(4,17,33,.62);z-index:20;display:none;align-items:end;justify-content:center}.modal.on{display:flex}.dialog{width:min(100%,430px);background:#fff;border-radius:26px 26px 0 0;padding:26px 20px 36px;text-align:center;animation:up .25s ease}.scanbox{margin:14px auto 18px;width:174px;height:174px;border:2px solid var(--blue);border-radius:16px;background:repeating-linear-gradient(0deg,#f0f7ff 0 11px,#fff 11px 22px);display:grid;place-items:center;position:relative}.scanbox:before,.scanbox:after{content:"";position:absolute;width:22px;height:22px;border-color:#1677ff;border-style:solid}.scanbox:before{left:-2px;top:-2px;border-width:4px 0 0 4px}.scanbox:after{right:-2px;bottom:-2px;border-width:0 4px 4px 0}.dialog p{font-size:12px;color:#72869d;line-height:1.7}.dialog input{width:100%;padding:13px;border:1px solid #d8e3ee;border-radius:10px;margin:8px 0 10px;outline-color:var(--blue)}.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800}.toast{position:fixed;z-index:30;left:50%;bottom:88px;transform:translate(-50%,20px);padding:11px 16px;border-radius:10px;background:#102d50;color:#fff;font-size:12px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes up{from{transform:translateY(100%)}to{transform:none}}@media(min-width:600px){body{padding:20px}.app{min-height:840px;border-radius:24px;box-shadow:0 24px 70px rgba(32,63,100,.22)}}
</style>
</head>
<body><main class="app"><section class="top"><div class="topline"><span class="loc"><i class="pin"></i>杭州 · 西湖区</span><button class="notice">消息 2</button></div><h1>附近有 28 个空闲快充桩</h1><p>已为你的比亚迪海豹匹配国标快充</p></section><section class="map" aria-label="充电站地图"><div class="roads"></div><div class="water"></div><span class="street" style="left:11%;top:18%">文三路</span><span class="street" style="left:56%;top:75%">天目山路</span><button class="station-dot" style="left:19%;top:38%">6</button><button class="station-dot hot" style="left:69%;top:25%">2</button><button class="station-dot" style="left:63%;top:59%">12</button><button class="station-dot" style="left:28%;top:73%">8</button><i class="mypos"></i><button class="locate" aria-label="定位">⌖</button></section><section class="sheet"><div class="grab"></div><article class="station-card"><div><h2>黄龙万科中心充电站</h2><p>距你 620m · 地下 B2 层 · 24 小时营业</p><p style="margin-top:8px"><span class="tag"><i></i>快充 6 空闲</span><span class="tag"><i></i>停车 2 小时免费</span></p></div><div class="price">¥1.26<small>/度起</small></div></article><div class="rowhead"><b>常用操作</b><span>查看全部电站</span></div><div class="quick"><button><strong>+ 5</strong>今日碳积分</button><button><strong>38</strong>我的优惠券</button><button><strong>100°</strong>能量包余额</button></div><section class="charge"><div class="ring"><b>71%</b></div><div class="charge-info"><h3>正在充电 · A03-2</h3><p>已充 31.6 kWh　¥ 43.52<br>当前功率 86 kW · 预计 18:42 完成</p></div><button onclick="stopCharge()">停止充电</button></section><section class="payment"><div class="coin">¥</div><div><b>免密支付已开启</b><span>优先使用 PLUS 8 折权益和最优优惠券</span></div><button onclick="showToast('已进入支付设置')">管理</button></section></section><nav class="nav"><button class="tab active" onclick="setTab(this,'附近充电站已为你刷新')"><i>⌖</i>找桩</button><button class="tab" onclick="setTab(this,'本周可领取 3 张优惠券')"><i>¥</i>省钱</button><button class="tab scan" onclick="openScan()"><i>⌗</i>扫码</button><button class="tab" onclick="setTab(this,'你有 1 笔充电订单进行中')"><i>≡</i>订单</button><button class="tab" onclick="setTab(this,'我的：PLUS 银卡 · 余额 ¥86.00')"><i>◌</i>我的</button></nav></main><div class="modal" id="modal"><section class="dialog"><h2>扫描充电桩二维码</h2><div class="scanbox">对准桩体二维码</div><p>识别后将为你确认桩号、枪号与支付方式。</p><input id="pile" placeholder="扫码失败？输入桩编号"><button class="primary" onclick="beginCharge()">确认启动充电</button></section></div><div class="toast" id="toast"></div><script>const modal=document.querySelector('#modal');function openScan(){modal.classList.add('on')}modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('on')});function beginCharge(){modal.classList.remove('on');showToast('已识别 A03-2，充电已开始')}function stopCharge(){showToast('为避免误触，请在充电桩旁确认停止')}function setTab(el,msg){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');showToast(msg)}function showToast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}</script></body></html>
