<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广知科技 - Linear风格仪表板</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f11;
            color: #e1e1e3;
        }
        
        .linear-gradient {
            background: linear-gradient(135deg, #5e6ad2 0%, #8b5cf6 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-card {
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(94, 106, 210, 0.2);
        }
        
        .sidebar-item {
            transition: all 0.2s ease;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        
        .sidebar-item.active {
            background: rgba(94, 106, 210, 0.2);
            border-left: 3px solid #5e6ad2;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex">
        <!-- 侧边栏 -->
        <aside class="w-64 glass-effect h-screen fixed left-0 top-0 border-r border-gray-800">
            <div class="p-6">
                <h1 class="text-xl font-bold mb-8">广知科技</h1>
                
                <nav class="space-y-2">
                    <a href="#" class="sidebar-item active flex items-center px-4 py-3 rounded-lg">
                        <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
                        仪表板
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="folder" class="w-5 h-5 mr-3"></i>
                        项目
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="users" class="w-5 h-5 mr-3"></i>
                        团队
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="calendar" class="w-5 h-5 mr-3"></i>
                        日历
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i>
                        分析
                    </a>
                    <a href="#" class="sidebar-item flex items-center px-4 py-3 rounded-lg text-gray-400">
                        <i data-lucide="settings" class="w-5 h-5 mr-3"></i>
                        设置
                    </a>
                </nav>
            </div>
            
            <div class="absolute bottom-0 left-0 right-0 p-6">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 mr-3"></div>
                    <div>
                        <div class="text-sm font-medium">张三</div>
                        <div class="text-xs text-gray-400">管理员</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- 主内容 -->
        <main class="flex-1 ml-64 p-8">
            <!-- 顶部导航 -->
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl font-bold mb-1">仪表板</h2>
                    <p class="text-gray-400">欢迎回来，张三</p>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <input type="text" placeholder="搜索..." class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 pl-10 w-64 focus:outline-none focus:border-purple-500">
                        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-2.5 text-gray-400"></i>
                    </div>
                    <button class="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            
            <!-- 统计卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="stat-card glass-effect rounded-xl p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-gray-400 text-sm">总项目</p>
                            <h3 class="text-3xl font-bold mt-1">24</h3>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-purple-500/20 flex items-center justify-center">
                            <i data-lucide="folder" class="w-5 h-5 text-purple-500"></i>
                        </div>
                    </div>
                    <p class="text-green-400 text-sm">+12% <span class="text-gray-400">较上月</span></p>
                </div>
                
                <div class="stat-card glass-effect rounded-xl p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-gray-400 text-sm">活跃任务</p>
                            <h3 class="text-3xl font-bold mt-1">128</h3>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center">
                            <i data-lucide="check-square" class="w-5 h-5 text-blue-500"></i>
                        </div>
                    </div>
                    <p class="text-green-400 text-sm">+8% <span class="text-gray-400">较上周</span></p>
                </div>
                
                <div class="stat-card glass-effect rounded-xl p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-gray-400 text-sm">团队成员</p>
                            <h3 class="text-3xl font-bold mt-1">12</h3>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-green-500/20 flex items-center justify-center">
                            <i data-lucide="users" class="w-5 h-5 text-green-500"></i>
                        </div>
                    </div>
                    <p class="text-gray-400 text-sm">+2 <span class="text-gray-400">本月新增</span></p>
                </div>
                
                <div class="stat-card glass-effect rounded-xl p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-gray-400 text-sm">完成率</p>
                            <h3 class="text-3xl font-bold mt-1">87%</h3>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-orange-500/20 flex items-center justify-center">
                            <i data-lucide="trending-up" class="w-5 h-5 text-orange-500"></i>
                        </div>
                    </div>
                    <p class="text-green-400 text-sm">+5% <span class="text-gray-400">较上月</span></p>
                </div>
            </div>
            
            <!-- 图表和最近活动 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 glass-effect rounded-xl p-6">
                    <h3 class="text-lg font-semibold mb-4">项目进度</h3>
                    <canvas id="progressChart" height="200"></canvas>
                </div>
                
                <div class="glass-effect rounded-xl p-6">
                    <h3 class="text-lg font-semibold mb-4">最近活动</h3>
                    <div class="space-y-4">
                        <div class="flex items-start">
                            <div class="w-8 h-8 rounded-full bg-purple-500/20 flex items-center justify-center mr-3 mt-1">
                                <i data-lucide="message-square" class="w-4 h-4 text-purple-500"></i>
                            </div>
                            <div>
                                <p class="text-sm">李四 在 <span class="text-purple-400">AI视觉识别项目</span> 中添加了评论</p>
                                <p class="text-xs text-gray-400 mt-1">2小时前</p>
                            </div>
                        </div>
                        
                        <div class="flex items-start">
                            <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center mr-3 mt-1">
                                <i data-lucide="check-circle" class="w-4 h-4 text-blue-500"></i>
                            </div>
                            <div>
                                <p class="text-sm">王五 完成了 <span class="text-blue-400">API设计</span> 任务</p>
                                <p class="text-xs text-gray-400 mt-1">4小时前</p>
                            </div>
                        </div>
                        
                        <div class="flex items-start">
                            <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center mr-3 mt-1">
                                <i data-lucide="user-plus" class="w-4 h-4 text-green-500"></i>
                            </div>
                            <div>
                                <p class="text-sm">赵六 加入了 <span class="text-green-400">大模型应用</span> 项目</p>
                                <p class="text-xs text-gray-400 mt-1">昨天</p>
                            </div>
                        </div>
                        
                        <div class="flex items-start">
                            <div class="w-8 h-8 rounded-full bg-orange-500/20 flex items-center justify-center mr-3 mt-1">
                                <i data-lucide="upload" class="w-4 h-4 text-orange-500"></i>
                            </div>
                            <div>
                                <p class="text-sm">张三 上传了 <span class="text-orange-400">设计稿V2</span></p>
                                <p class="text-xs text-gray-400 mt-1">昨天</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // 创建图表
        const ctx = document.getElementById('progressChart').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, 'rgba(94, 106, 210, 0.5)');
        gradient.addColorStop(1, 'rgba(94, 106, 210, 0)');
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
                datasets: [{
                    label: '完成率',
                    data: [65, 70, 75, 82, 87, 92],
                    borderColor: '#5e6ad2',
                    backgroundColor: gradient,
                    tension: 0.4,
                    fill: true
                }, {
                    label: '目标',
                    data: [70, 75, 80, 85, 90, 95],
                    borderColor: '#8b5cf6',
                    borderDash: [5, 5],
                    tension: 0.4,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#e1e1e3'
                        }
                    }
                },
                scales: {
                    y: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        ticks: {
                            color: '#9ca3af'
                        }
                    },
                    x: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        ticks: {
                            color: '#9ca3af'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
