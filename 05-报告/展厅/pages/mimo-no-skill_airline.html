<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广知科技 - 英雄区域组件</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            overflow-x: hidden;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero-gradient {
            background: radial-gradient(ellipse at top, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at bottom right, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
        }
        
        .floating {
            animation: floating 6s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        .glow {
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
        }
        
        .text-glow {
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.5);
        }
        
        .mesh-gradient {
            background-image: 
                linear-gradient(45deg, rgba(139, 92, 246, 0.1) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(139, 92, 246, 0.1) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(139, 92, 246, 0.1) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(139, 92, 246, 0.1) 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(139, 92, 246, 0.5);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- 粒子背景 -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 40%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 3s;"></div>
        <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 1s;"></div>
    </div>
    
    <!-- 英雄区域 -->
    <section class="relative min-h-screen flex items-center justify-center hero-gradient mesh-gradient">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-[#0a0a0f]"></div>
        
        <div class="container mx-auto px-6 py-20 relative z-10">
            <div class="flex flex-col lg:flex-row items-center justify-between gap-12">
                <!-- 左侧内容 -->
                <div class="flex-1 max-w-2xl text-center lg:text-left">
                    <div class="inline-flex items-center px-4 py-2 rounded-full glass mb-6">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                        <span class="text-sm text-gray-300">全新 AI 引擎 2.0 已发布</span>
                    </div>
                    
                    <h1 class="text-5xl lg:text-7xl font-bold text-white mb-6 leading-tight">
                        用<span class="gradient-text text-glow">AI</span>重新定义<br>
                        <span class="text-gray-400">企业智能化</span>
                    </h1>
                    
                    <p class="text-xl text-gray-400 mb-8 leading-relaxed max-w-xl">
                        广知科技提供前沿的 AI 解决方案，包括大模型应用、视觉识别和具身智能。让您的企业拥抱 AI，实现数字化转型。
                    </p>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                        <button class="px-8 py-4 bg-gradient-to-r from-purple-600 to-blue-500 text-white rounded-xl font-semibold hover:shadow-lg hover:shadow-purple-500/30 transition-all duration-300 flex items-center justify-center">
                            <i data-lucide="rocket" class="w-5 h-5 mr-2"></i>
                            免费开始
                        </button>
                        <button class="px-8 py-4 glass text-white rounded-xl font-semibold hover:bg-white/10 transition-all duration-300 flex items-center justify-center">
                            <i data-lucide="play-circle" class="w-5 h-5 mr-2"></i>
                            观看演示
                        </button>
                    </div>
                    
                    <div class="flex items-center justify-center lg:justify-start space-x-8 mt-10 text-gray-400">
                        <div class="flex items-center">
                            <i data-lucide="check-circle" class="w-5 h-5 mr-2 text-green-500"></i>
                            <span>免费试用14天</span>
                        </div>
                        <div class="flex items-center">
                            <i data-lucide="check-circle" class="w-5 h-5 mr-2 text-green-500"></i>
                            <span>无需信用卡</span>
                        </div>
                    </div>
                </div>
                
                <!-- 右侧3D元素 -->
                <div class="flex-1 flex justify-center lg:justify-end">
                    <div class="relative">
                        <!-- 外层旋转容器 -->
                        <div class="floating glow relative w-80 h-80 lg:w-96 lg:h-96">
                            <!-- 中心球体 -->
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="w-48 h-48 lg:w-64 lg:h-64 rounded-full bg-gradient-to-br from-purple-600 via-blue-500 to-cyan-400 opacity-80 blur-xl"></div>
                            </div>
                            
                            <!-- 内部球体 -->
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="w-40 h-40 lg:w-52 lg:h-52 rounded-full bg-gradient-to-br from-purple-500 via-blue-400 to-cyan-300"></div>
                            </div>
                            
                            <!-- 高光 -->
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="w-32 h-32 lg:w-40 lg:h-40 rounded-full bg-gradient-to-br from-white/30 to-transparent"></div>
                            </div>
                            
                            <!-- 环绕轨道 -->
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="w-72 h-72 lg:w-80 lg:h-80 rounded-full border border-purple-500/30 animate-spin" style="animation-duration: 20s;"></div>
                            </div>
                            
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="w-64 h-64 lg:w-72 lg:h-72 rounded-full border border-blue-500/20 animate-spin" style="animation-duration: 15s; animation-direction: reverse;"></div>
                            </div>
                            
                            <!-- 浮动图标 -->
                            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                <div class="w-12 h-12 glass rounded-xl flex items-center justify-center">
                                    <i data-lucide="brain" class="w-6 h-6 text-purple-400"></i>
                                </div>
                            </div>
                            
                            <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/2">
                                <div class="w-12 h-12 glass rounded-xl flex items-center justify-center">
                                    <i data-lucide="cpu" class="w-6 h-6 text-blue-400"></i>
                                </div>
                            </div>
                            
                            <div class="absolute left-0 top-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                <div class="w-12 h-12 glass rounded-xl flex items-center justify-center">
                                    <i data-lucide="eye" class="w-6 h-6 text-cyan-400"></i>
                                </div>
                            </div>
                            
                            <div class="absolute right-0 top-1/2 transform translate-x-1/2 -translate-y-1/2">
                                <div class="w-12 h-12 glass rounded-xl flex items-center justify-center">
                                    <i data-lucide="sparkles" class="w-6 h-6 text-pink-400"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 滚动指示器 -->
            <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2">
                <div class="flex flex-col items-center animate-bounce">
                    <span class="text-gray-500 text-sm mb-2">向下滚动</span>
                    <i data-lucide="chevron-down" class="w-6 h-6 text-gray-500"></i>
                </div>
            </div>
        </div>
    </section>
    
    <!-- 信任标志 -->
    <section class="py-16 bg-gradient-to-b from-[#0a0a0f] to-[#0f0f15]">
        <div class="container mx-auto px-6">
            <p class="text-center text-gray-500 mb-8">受到全球领先企业信赖</p>
            <div class="flex flex-wrap justify-center items-center gap-12 opacity-50">
                <div class="text-2xl font-bold text-gray-400">腾讯</div>
                <div class="text-2xl font-bold text-gray-400">阿里巴巴</div>
                <div class="text-2xl font-bold text-gray-400">百度</div>
                <div class="text-2xl font-bold text-gray-400">字节跳动</div>
                <div class="text-2xl font-bold text-gray-400">华为</div>
                <div class="text-2xl font-bold text-gray-400">小米</div>
            </div>
        </div>
    </section>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const hero = document.querySelector('.hero-gradient');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            hero.style.background = `
                radial-gradient(ellipse at ${x * 100}% ${y * 100}%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at ${100 - x * 100}% ${100 - y * 100}%, rgba(59, 130, 246, 0.1) 0%, transparent 50%)
            `;
        });
        
        // 滚动时渐变效果
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const hero = document.querySelector('.hero-gradient');
            const opacity = 1 - (scrolled / 500);
            hero.style.opacity = Math.max(opacity, 0.3);
        });
    </script>
</body>
</html>
