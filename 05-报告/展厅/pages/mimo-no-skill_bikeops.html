<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广知科技 - 卡片组件</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .gradient-text {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold text-white text-center mb-12">响应式卡片组件</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- 卡片1 -->
            <div class="card-hover bg-white rounded-2xl p-6 shadow-xl">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center mb-4">
                    <i data-lucide="zap" class="w-6 h-6 text-white"></i>
                </div>
                <h3 class="text-xl font-semibold mb-2">高性能</h3>
                <p class="text-gray-600 mb-4">我们的解决方案经过优化，提供卓越的性能和响应速度。</p>
                <a href="#" class="text-blue-600 font-medium hover:text-blue-800 transition-colors">了解更多 →</a>
            </div>
            
            <!-- 卡片2 -->
            <div class="card-hover bg-white rounded-2xl p-6 shadow-xl">
                <div class="w-12 h-12 bg-gradient-to-br from-green-500 to-teal-600 rounded-xl flex items-center justify-center mb-4">
                    <i data-lucide="shield" class="w-6 h-6 text-white"></i>
                </div>
                <h3 class="text-xl font-semibold mb-2">安全可靠</h3>
                <p class="text-gray-600 mb-4">企业级安全防护，确保您的数据始终安全无虞。</p>
                <a href="#" class="text-green-600 font-medium hover:text-green-800 transition-colors">了解更多 →</a>
            </div>
            
            <!-- 卡片3 -->
            <div class="card-hover bg-white rounded-2xl p-6 shadow-xl">
                <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-red-600 rounded-xl flex items-center justify-center mb-4">
                    <i data-lucide="layers" class="w-6 h-6 text-white"></i>
                </div>
                <h3 class="text-xl font-semibold mb-2">易于集成</h3>
                <p class="text-gray-600 mb-4">简单的API接口，轻松集成到您现有的技术栈中。</p>
                <a href="#" class="text-orange-600 font-medium hover:text-orange-800 transition-colors">了解更多 →</a>
            </div>
            
            <!-- 卡片4 -->
            <div class="card-hover bg-white rounded-2xl p-6 shadow-xl">
                <div class="w-12 h-12 bg-gradient-to-br from-pink-500 to-rose-600 rounded-xl flex items-center justify-center mb-4">
                    <i data-lucide="users" class="w-6 h-6 text-white"></i>
                </div>
                <h3 class="text-xl font-semibold mb-2">团队协作</h3>
                <p class="text-gray-600 mb-4">强大的协作功能，让团队更高效地共同工作。</p>
                <a href="#" class="text-pink-600 font-medium hover:text-pink-800 transition-colors">了解更多 →</a>
            </div>
            
            <!-- 卡片5 -->
            <div class="card-hover bg-white rounded-2xl p-6 shadow-xl">
                <div class="w-12 h-12 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center mb-4">
                    <i data-lucide="bar-chart-2" class="w-6 h-6 text-white"></i>
                </div>
                <h3 class="text-xl font-semibold mb-2">数据分析</h3>
                <p class="text-gray-600 mb-4">深入的数据洞察，帮助您做出更明智的决策。</p>
                <a href="#" class="text-cyan-600 font-medium hover:text-cyan-800 transition-colors">了解更多 →</a>
            </div>
            
            <!-- 卡片6 -->
            <div class="card-hover bg-white rounded-2xl p-6 shadow-xl">
                <div class="w-12 h-12 bg-gradient-to-br from-violet-500 to-purple-600 rounded-xl flex items-center justify-center mb-4">
                    <i data-lucide="globe" class="w-6 h-6 text-white"></i>
                </div>
                <h3 class="text-xl font-semibold mb-2">全球化支持</h3>
                <p class="text-gray-600 mb-4">多语言支持，全球部署，让您的业务覆盖世界。</p>
                <a href="#" class="text-violet-600 font-medium hover:text-violet-800 transition-colors">了解更多 →</a>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
