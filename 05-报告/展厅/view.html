<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查看页面 - 前端设计 Skills 大横评</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: #0f0f10; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
  <!-- Top Bar -->
  <header class="h-14 bg-[#18181b] border-b border-[#27272a] flex items-center justify-between px-4 shrink-0 z-10">
    <div class="flex items-center gap-3">
      <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#27272a] text-white text-sm font-medium hover:bg-[#3f3f46] transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回展厅
      </a>
      <div class="h-6 w-px bg-[#27272a]"></div>
      <h1 id="pageTitle" class="text-sm text-white/90 font-medium truncate max-w-[200px] md:max-w-md">加载中...</h1>
    </div>
    <div class="flex items-center gap-3">
      <a id="openNewTab" href="#" target="_blank" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-[#27272a] text-white text-sm hover:bg-[#3f3f46] transition">
        <i data-lucide="external-link" class="w-4 h-4"></i>
        <span class="hidden sm:inline">新标签页打开</span>
      </a>
    </div>
  </header>

  <!-- Frame Container -->
  <main class="flex-1 relative overflow-hidden flex items-center justify-center bg-[#0f0f10]">
    <!-- Desktop view container -->
    <div id="desktopWrapper" class="w-full h-full hidden">
      <iframe id="desktopFrame" src="" class="w-full h-full border-0"></iframe>
    </div>
    
    <!-- Mobile view container (centered phone) -->
    <div id="mobileWrapper" class="hidden h-full flex items-center justify-center p-6">
      <div class="relative h-[90%] aspect-[390/844] rounded-[44px] border-[8px] border-[#27272a] shadow-2xl overflow-hidden bg-black">
        <iframe id="mobileFrame" src="" class="w-full h-full border-0 rounded-[36px]"></iframe>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    let src = params.get('src');
    const title = params.get('title') || '页面预览';
    
    // Normalize old paths for self-contained deployment
    if (src && src.startsWith('../kimi/')) {
      src = src.replace('../kimi/', './pages/');
    }
    
    document.getElementById('pageTitle').textContent = title;
    
    if (src) {
      const openLink = document.getElementById('openNewTab');
      openLink.href = src;
      
      // Determine if mobile page
      const isMobile = src.includes('charging');
      
      if (isMobile) {
        document.getElementById('mobileWrapper').classList.remove('hidden');
        document.getElementById('mobileFrame').src = src;
      } else {
        document.getElementById('desktopWrapper').classList.remove('hidden');
        document.getElementById('desktopFrame').src = src;
      }
    } else {
      document.getElementById('pageTitle').textContent = '缺少页面参数';
    }
    
    lucide.createIcons();
  </script>
</body>
</html>
