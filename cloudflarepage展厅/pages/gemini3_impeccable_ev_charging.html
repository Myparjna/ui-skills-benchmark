<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EV Charging Mini - Impeccable Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* OKLCH Colors - Baseline 2026 */
            --bg: oklch(15% 0.02 260);
            --surface: oklch(22% 0.03 260 / 0.8);
            --surface-bright: oklch(28% 0.04 260 / 0.9);
            --primary: oklch(75% 0.18 150); /* Mint Green */
            --primary-glow: oklch(75% 0.18 150 / 0.4);
            --accent: oklch(65% 0.22 280); /* Electric Blue */
            --fg: oklch(98% 0.01 260);
            --fg-muted: oklch(75% 0.02 260);
            --border: oklch(100% 0 0 / 0.1);
            
            --font: 'Outfit', sans-serif;
            --r-xl: 32px;
            --r-lg: 24px;
            --r-md: 16px;
            
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --dur: 0.4s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* --- Physical Texture & Glass --- */
        .glass {
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border);
            box-shadow: 
                inset 0 1px 1px oklch(100% 0 0 / 0.1),
                0 8px 32px oklch(0% 0 0 / 0.4);
        }

        /* --- Map Background (Simulated) --- */
        #map-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, oklch(25% 0.05 260), var(--bg));
            overflow: hidden;
        }

        .map-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary-glow);
            cursor: pointer;
            transition: transform 0.3s var(--ease);
        }

        .map-dot::after {
            content: '';
            position: absolute;
            inset: -8px;
            border: 1px solid var(--primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* --- UI Layers --- */
        header {
            position: relative;
            z-index: 10;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            flex: 1;
            margin-right: 16px;
            height: 54px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-radius: var(--r-md);
            gap: 12px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: 16px;
            outline: none;
            width: 100%;
        }

        .profile-btn {
            width: 54px;
            height: 54px;
            border-radius: var(--r-md);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Bottom Sheet --- */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60vh;
            z-index: 100;
            border-radius: var(--r-xl) var(--r-xl) 0 0;
            padding: 24px;
            transform: translateY(calc(60vh - 120px));
            transition: transform 0.6s var(--ease);
        }

        .bottom-sheet.expanded {
            transform: translateY(0);
        }

        .handle {
            width: 40px;
            height: 4px;
            background: oklch(100% 0 0 / 0.2);
            border-radius: 2px;
            margin: -8px auto 24px;
        }

        .sheet-content {
            height: 100%;
            overflow-y: auto;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Station Card --- */
        .station-card {
            margin-bottom: 16px;
            padding: 20px;
            border-radius: var(--r-lg);
            display: flex;
            gap: 16px;
            transition: background 0.3s;
            cursor: pointer;
        }

        .station-card:active {
            transform: scale(0.98);
        }

        .station-info {
            flex: 1;
        }

        .station-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .station-meta {
            font-size: 13px;
            color: var(--fg-muted);
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .badge-row {
            display: flex;
            gap: 8px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.fast { background: oklch(70% 0.2 250 / 0.2); color: oklch(70% 0.2 250); border: 1px solid oklch(70% 0.2 250 / 0.3); }
        .badge.free { background: oklch(80% 0.12 100 / 0.2); color: oklch(80% 0.12 100); border: 1px solid oklch(80% 0.12 100 / 0.3); }

        .price-tag {
            text-align: right;
        }

        .price-val {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .price-unit {
            font-size: 11px;
            color: var(--fg-muted);
        }

        /* --- Scan Action --- */
        .scan-action {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 110;
        }

        .scan-btn {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 40px var(--primary-glow);
            border: none;
            color: var(--bg);
            cursor: pointer;
            transition: all 0.3s var(--ease);
        }

        .scan-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 20px 50px var(--primary-glow);
        }

        .scan-btn:active {
            transform: scale(0.92);
        }

        /* --- Charging Status Overlay --- */
        #charging-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: var(--bg);
            display: none;
            flex-direction: column;
            padding: 40px 24px;
            animation: slideUp 0.6s var(--ease);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .charge-progress {
            width: 240px;
            height: 240px;
            margin: 60px auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 8px solid oklch(100% 0 0 / 0.05);
        }

        .progress-ring-fill {
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 10px solid var(--primary);
            clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 50% 0%);
            mask: radial-gradient(transparent 60%, black 61%);
            transform: rotate(45deg);
        }

        .charge-val {
            text-align: center;
        }

        .charge-val h2 { font-size: 64px; font-weight: 800; line-height: 1; }
        .charge-val span { font-size: 18px; color: var(--fg-muted); }

        .charge-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .stat-item {
            padding: 24px;
            border-radius: var(--r-lg);
        }

        .stat-item h3 { font-size: 14px; color: var(--fg-muted); margin-bottom: 8px; }
        .stat-item p { font-size: 24px; font-weight: 600; }

        .stop-btn {
            margin-top: auto;
            height: 64px;
            background: oklch(60% 0.2 25);
            border-radius: var(--r-md);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Hide scrollbar */
        .sheet-content::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="map-bg">
        <!-- Mock Dots -->
        <div class="map-dot" style="top: 20%; left: 30%;"></div>
        <div class="map-dot" style="top: 45%; left: 60%;"></div>
        <div class="map-dot" style="top: 70%; left: 20%;"></div>
        <div class="map-dot" style="top: 35%; left: 80%;"></div>
        <div class="map-dot" style="top: 15%; left: 55%;"></div>
    </div>

    <header>
        <div class="search-bar glass">
            <i data-lucide="search" size="20" color="oklch(75% 0.02 260)"></i>
            <input type="text" placeholder="查找附近充电站...">
        </div>
        <div class="profile-btn glass">
            <i data-lucide="user" size="24"></i>
        </div>
    </header>

    <div class="bottom-sheet glass" id="main-sheet">
        <div class="handle"></div>
        <div class="sheet-content">
            <div class="section-title">
                附近站点
                <i data-lucide="sliders-horizontal" size="20"></i>
            </div>

            <!-- Station 1 -->
            <div class="station-card glass" onclick="showStation()">
                <div class="station-info">
                    <div class="station-name">特来电超充站 (滨江店)</div>
                    <div class="station-meta">
                        <span><i data-lucide="map-pin" size="12"></i> 1.2km</span>
                        <span><i data-lucide="star" size="12"></i> 4.9</span>
                    </div>
                    <div class="badge-row">
                        <span class="badge fast">快充 × 12</span>
                        <span class="badge free">免费停车</span>
                    </div>
                </div>
                <div class="price-tag">
                    <div class="price-val">¥1.28</div>
                    <div class="price-unit">/ 度 (起)</div>
                </div>
            </div>

            <!-- Station 2 -->
            <div class="station-card glass">
                <div class="station-info">
                    <div class="station-name">星星充电综合站</div>
                    <div class="station-meta">
                        <span><i data-lucide="map-pin" size="12"></i> 2.5km</span>
                        <span><i data-lucide="star" size="12"></i> 4.7</span>
                    </div>
                    <div class="badge-row">
                        <span class="badge fast">超充 × 4</span>
                        <span class="badge">慢充 × 8</span>
                    </div>
                </div>
                <div class="price-tag">
                    <div class="price-val">¥0.98</div>
                    <div class="price-unit">/ 度 (起)</div>
                </div>
            </div>

            <!-- Station 3 -->
            <div class="station-card glass">
                <div class="station-info">
                    <div class="station-name">云快充滨河路站</div>
                    <div class="station-meta">
                        <span><i data-lucide="map-pin" size="12"></i> 3.1km</span>
                        <span><i data-lucide="star" size="12"></i> 4.5</span>
                    </div>
                    <div class="badge-row">
                        <span class="badge fast">快充 × 20</span>
                    </div>
                </div>
                <div class="price-tag">
                    <div class="price-val">¥1.15</div>
                    <div class="price-unit">/ 度 (起)</div>
                </div>
            </div>
        </div>
    </div>

    <div class="scan-action">
        <button class="scan-btn" onclick="startCharging()">
            <i data-lucide="qr-code" size="32"></i>
        </button>
    </div>

    <div id="charging-overlay">
        <div class="section-title">
            正在充电...
            <i data-lucide="info" size="20"></i>
        </div>

        <div class="charge-progress">
            <div class="progress-ring"></div>
            <div class="progress-ring-fill"></div>
            <div class="charge-val">
                <h2>82<span>%</span></h2>
                <span>已充电量 42.5kWh</span>
            </div>
        </div>

        <div class="charge-stats">
            <div class="stat-item glass">
                <h3>当前功率</h3>
                <p>60.2 kW</p>
            </div>
            <div class="stat-item glass">
                <h3>预计费用</h3>
                <p>¥ 54.40</p>
            </div>
            <div class="stat-item glass">
                <h3>已用时间</h3>
                <p>32:15</p>
            </div>
            <div class="stat-item glass">
                <h3>剩余时间</h3>
                <p>12 min</p>
            </div>
        </div>

        <button class="stop-btn" onclick="stopCharging()">停止充电</button>
    </div>

    <script>
        lucide.createIcons();

        const sheet = document.getElementById('main-sheet');
        const handle = document.querySelector('.handle');

        handle.addEventListener('click', () => {
            sheet.classList.toggle('expanded');
        });

        function startCharging() {
            document.getElementById('charging-overlay').style.display = 'flex';
        }

        function stopCharging() {
            if(confirm('确定要结束本次充电吗？')) {
                document.getElementById('charging-overlay').style.display = 'none';
                alert('充电完成！已自动从账户扣除 ¥54.40');
            }
        }

        function showStation() {
            sheet.classList.add('expanded');
        }

        // Draggable Sheet Mockup
        let startY;
        handle.addEventListener('touchstart', e => startY = e.touches[0].pageY);
        handle.addEventListener('touchmove', e => {
            const moveY = e.touches[0].pageY;
            if (startY - moveY > 50) sheet.classList.add('expanded');
            if (moveY - startY > 50) sheet.classList.remove('expanded');
        });
    </script>
</body>
</html>
