<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪充 - EV Charging Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #1677FF;
            --success: #52C41A;
            --warning: #FA8C16;
            --danger: #FF4D4F;
            --background: #F4F7FA;
            --card: #FFFFFF;
            --text-main: #1A1C1E;
            --text-secondary: #6B7280;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            padding-bottom: 90px;
        }
        .map-container {
            height: 45vh;
            background: #E5E7EB;
            position: relative;
        }
        .bottom-sheet {
            background: var(--card);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.05);
            margin-top: -24px;
            position: relative;
            z-index: 10;
        }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #E5E7EB;
            border-radius: 2px;
            margin: 0 auto 20px;
        }
        .station-card {
            border: 1px solid #F3F4F6;
            border-radius: 16px;
            transition: all 0.2s ease;
        }
        .station-card:active {
            transform: scale(0.98);
            background: #F9FAFB;
        }
        .scan-btn {
            background: linear-gradient(135deg, #1677FF 0%, #00B2FF 100%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 8px 20px rgba(22, 119, 255, 0.4);
            position: absolute;
            left: 50%;
            transform: translate(-50%, -40px);
            z-index: 50;
            border: 4px solid white;
        }
        .tab-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 84px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px;
            border-top: 1px solid #F3F4F6;
            z-index: 100;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
        }
        .tab-item.active {
            color: var(--primary);
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .bg-free { background-color: var(--success); }
        .bg-busy { background-color: var(--warning); }
        
        /* Skeleton Map Markers */
        .marker {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
        }
        .marker::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid white;
        }
    </style>
</head>
<body>

    <!-- Map View -->
    <div class="map-container">
        <!-- Mock Map Markers -->
        <div class="marker" style="top: 20%; left: 30%;">
            <div class="flex flex-col items-center">
                <span class="text-[10px] font-extrabold text-success">8</span>
                <i class="ph-fill ph-lightning text-success text-xs"></i>
            </div>
        </div>
        <div class="marker" style="top: 45%; left: 65%;">
            <div class="flex flex-col items-center">
                <span class="text-[10px] font-extrabold text-warning">2</span>
                <i class="ph-fill ph-lightning text-warning text-xs"></i>
            </div>
        </div>
        <div class="marker" style="top: 60%; left: 20%;">
            <div class="flex flex-col items-center">
                <span class="text-[10px] font-extrabold text-success">12</span>
                <i class="ph-fill ph-lightning text-success text-xs"></i>
            </div>
        </div>

        <!-- Top Search Bar -->
        <div class="absolute top-6 left-0 w-full px-4 flex gap-3">
            <div class="flex-1 bg-white h-12 rounded-2xl shadow-lg flex items-center px-4 gap-3">
                <i class="ph ph-magnifying-glass text-slate-400"></i>
                <input type="text" placeholder="查找充电站..." class="text-sm bg-transparent border-none focus:ring-0 w-full">
            </div>
            <div class="w-12 h-12 bg-white rounded-2xl shadow-lg flex items-center justify-center text-primary">
                <i class="ph-bold ph-sliders-horizontal"></i>
            </div>
        </div>
    </div>

    <!-- Bottom Sheet -->
    <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-extrabold">附近充电站</h2>
            <div class="flex gap-2">
                <span class="px-3 py-1.5 bg-blue-50 text-primary text-[10px] font-bold rounded-full">快充优先</span>
                <span class="px-3 py-1.5 bg-slate-100 text-slate-500 text-[10px] font-bold rounded-full">距离最近</span>
            </div>
        </div>

        <!-- Station List -->
        <div class="space-y-4">
            <!-- Station 1 -->
            <div class="station-card p-4 flex flex-col gap-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-base mb-1">特来电旗舰站 (西湖区)</h3>
                        <p class="text-xs text-text-secondary flex items-center gap-1">
                            <i class="ph ph-map-pin"></i> 距离您 850m · 免费停车
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-primary">¥ 0.98<span class="text-[10px] font-medium text-slate-400">/度</span></p>
                        <p class="text-[10px] text-slate-400 line-through">¥ 1.45</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <div class="status-dot bg-free"></div>
                        <span class="text-xs font-bold text-slate-700">快充空闲 8/12</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="status-dot bg-slate-300"></div>
                        <span class="text-xs font-bold text-slate-500">慢充 4/4</span>
                    </div>
                </div>
            </div>

            <!-- Station 2 -->
            <div class="station-card p-4 flex flex-col gap-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-base mb-1">星星充电超级站 (滨江)</h3>
                        <p class="text-xs text-text-secondary flex items-center gap-1">
                            <i class="ph ph-map-pin"></i> 距离您 2.4km · PLUS优惠
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-primary">¥ 1.12<span class="text-[10px] font-medium text-slate-400">/度</span></p>
                        <p class="text-[10px] text-slate-400">当前峰值电价</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <div class="status-dot bg-busy"></div>
                        <span class="text-xs font-bold text-slate-700">快充空闲 2/10</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="status-dot bg-free"></div>
                        <span class="text-xs font-bold text-slate-700">慢充 6/8</span>
                    </div>
                </div>
            </div>

            <!-- Station 3 -->
            <div class="station-card p-4 flex flex-col gap-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-base mb-1">云快充枢纽站</h3>
                        <p class="text-xs text-text-secondary flex items-center gap-1">
                            <i class="ph ph-map-pin"></i> 距离您 3.1km · 24h营业
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-primary">¥ 0.85<span class="text-[10px] font-medium text-slate-400">/度</span></p>
                        <p class="text-[10px] text-success font-bold text-[10px]">特惠时段</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <div class="status-dot bg-free"></div>
                        <span class="text-xs font-bold text-slate-700">快充空闲 15/20</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <nav class="tab-bar">
        <a href="#" class="tab-item active">
            <i class="ph-fill ph-lightning text-2xl"></i>
            <span>找桩</span>
        </a>
        <a href="#" class="tab-item">
            <i class="ph ph-ticket text-2xl"></i>
            <span>优惠</span>
        </a>
        
        <div class="relative">
            <div class="scan-btn">
                <i class="ph-bold ph-qr-code text-2xl"></i>
            </div>
            <span class="absolute top-10 left-1/2 -translate-x-1/2 text-[10px] font-bold text-primary mt-2">扫码充电</span>
        </div>

        <a href="#" class="tab-item">
            <i class="ph ph-article text-2xl"></i>
            <span>订单</span>
        </a>
        <a href="#" class="tab-item">
            <i class="ph ph-user text-2xl"></i>
            <span>我的</span>
        </a>
    </nav>

</body>
</html>
