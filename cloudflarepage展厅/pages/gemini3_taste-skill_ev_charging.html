<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪充 - 电动汽车充电管家</title>
    <!-- 
      TASTE-SKILL RULES APPLIED:
      - DESIGN_VARIANCE: 6 (Functional layout)
      - MOTION_INTENSITY: 5 (Standard transitions)
      - VISUAL_DENSITY: 5 (Information rich)
      - ZERO em-dashes (Used colons or periods)
      - Single accent color: Emerald Green (#10B981)
      - Mobile Shell (max-w-md)
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F9FAFB;
            color: #111827;
        }
        .mobile-shell {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100dvh;
            background: white;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
        }
        .accent-bg {
            background-color: #10B981;
        }
        .status-pill {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* No em-dash allowed */
    </style>
</head>
<body class="antialiased">
    <div class="mobile-shell flex flex-col">
        <!-- Status Bar -->
        <div class="h-10 flex justify-between items-center px-8 text-xs font-bold opacity-40">
            <span>9:41</span>
            <div class="flex items-center gap-1.5">
                <i class="ri-signal-tower-fill"></i>
                <i class="ri-wifi-fill"></i>
                <i class="ri-battery-2-fill text-lg"></i>
            </div>
        </div>

        <!-- Header -->
        <header class="px-6 py-4 flex justify-between items-center bg-white sticky top-0 z-40 border-b border-slate-50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 accent-bg rounded-lg flex items-center justify-center text-white">
                    <i class="ri-flashlight-fill"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">闪充中心</span>
            </div>
            <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-emerald-500">
                <img src="https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&w=100" class="w-full h-full object-cover" alt="User">
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto hide-scrollbar pb-32">
            <!-- Hero Map Card -->
            <section class="p-6">
                <div class="relative rounded-[32px] overflow-hidden aspect-[4/3] shadow-xl shadow-emerald-900/5">
                    <img src="https://images.pexels.com/photos/1051075/pexels-photo-1051075.jpeg?auto=compress&cs=tinysrgb&w=800" class="w-full h-full object-cover opacity-80" alt="Map">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                    
                    <!-- Marker -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                        <div class="w-12 h-12 accent-bg rounded-full flex items-center justify-center text-white border-4 border-white shadow-2xl animate-bounce">
                            <i class="ri-flashlight-fill text-xl"></i>
                        </div>
                    </div>

                    <div class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-md rounded-2xl p-4 border border-white/50">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-sm">滨江龙湖天街充电站</h3>
                                <p class="text-[10px] text-slate-500 mt-0.5">距您 850m : 24小时营业</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-black text-emerald-600">¥ 1.25/度</span>
                                <div class="flex gap-1 mt-1">
                                    <span class="status-pill bg-emerald-100 text-emerald-700">快充 6</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Quick Actions -->
            <section class="px-6 grid grid-cols-4 gap-4 mb-10">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600">
                        <i class="ri-map-pin-2-line text-2xl"></i>
                    </div>
                    <span class="text-[10px] font-bold text-slate-500">附近</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-600">
                        <i class="ri-coupon-3-line text-2xl"></i>
                    </div>
                    <span class="text-[10px] font-bold text-slate-500">优惠</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600">
                        <i class="ri-car-line text-2xl"></i>
                    </div>
                    <span class="text-[10px] font-bold text-slate-500">车辆</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-purple-50 rounded-2xl flex items-center justify-center text-purple-600">
                        <i class="ri-vip-crown-line text-2xl"></i>
                    </div>
                    <span class="text-[10px] font-bold text-slate-500">会员</span>
                </div>
            </section>

            <!-- Charging Status (Visual Variation) -->
            <section class="px-6 mb-10">
                <div class="bg-slate-900 rounded-[32px] p-8 text-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/20 blur-3xl rounded-full"></div>
                    <div class="relative z-10 flex items-center gap-6">
                        <div class="relative w-20 h-20">
                            <svg class="w-full h-full -rotate-90">
                                <circle cx="40" cy="40" r="36" fill="transparent" stroke="rgba(255,255,255,0.1)" stroke-width="6"></circle>
                                <circle cx="40" cy="40" r="36" fill="transparent" stroke="#10B981" stroke-width="6" stroke-dasharray="226" stroke-dashoffset="56"></circle>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-xl font-black">75</span>
                                <span class="text-[8px] font-bold opacity-50 uppercase tracking-widest mt-0.5">%</span>
                            </div>
                        </div>
                        <div class="flex-1 space-y-1">
                            <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">正在充电</div>
                            <h4 class="font-bold text-lg">滨江龙湖天街 02号桩</h4>
                            <p class="text-[10px] text-slate-400">已充 32.5 kWh : 预计 15min 后充满</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Station List (Density 5) -->
            <section class="px-6 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="font-extrabold text-base">推荐站点</h2>
                    <button class="text-xs font-bold text-emerald-600">查看更多</button>
                </div>
                <div class="flex items-center gap-4 group">
                    <div class="w-16 h-16 bg-slate-100 rounded-2xl overflow-hidden flex-shrink-0">
                        <img src="https://images.pexels.com/photos/1103970/pexels-photo-1103970.jpeg?auto=compress&cs=tinysrgb&w=100" class="w-full h-full object-cover" alt="Station">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-sm truncate">远洋乐堤港充电站</h4>
                        <div class="flex items-center gap-3 mt-1">
                            <span class="text-[10px] font-bold text-slate-400 flex items-center gap-1"><i class="ri-map-pin-2-line"></i> 1.2km</span>
                            <span class="text-[10px] font-bold text-emerald-500 flex items-center gap-1"><i class="ri-flashlight-line"></i> 快充 12</span>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <div class="text-xs font-black">¥ 1.32</div>
                        <div class="flex items-center gap-1 justify-end mt-1">
                            <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                            <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest">空闲</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4 group">
                    <div class="w-16 h-16 bg-slate-100 rounded-2xl overflow-hidden flex-shrink-0">
                        <img src="https://images.pexels.com/photos/1051075/pexels-photo-1051075.jpeg?auto=compress&cs=tinysrgb&w=100" class="w-full h-full object-cover" alt="Station">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-sm truncate">高教园智慧充电中心</h4>
                        <div class="flex items-center gap-3 mt-1">
                            <span class="text-[10px] font-bold text-slate-400 flex items-center gap-1"><i class="ri-map-pin-2-line"></i> 2.4km</span>
                            <span class="text-[10px] font-bold text-emerald-500 flex items-center gap-1"><i class="ri-flashlight-line"></i> 快充 8</span>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <div class="text-xs font-black">¥ 0.98</div>
                        <div class="flex items-center gap-1 justify-end mt-1">
                            <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                            <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest">空闲</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Navigation Bar -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-slate-50 px-8 pt-4 pb-10 flex justify-between items-center z-50">
            <div class="flex flex-col items-center gap-1 text-emerald-600">
                <i class="ri-home-5-fill text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-widest">首页</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-slate-300">
                <i class="ri-wallet-3-line text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-widest">钱包</span>
            </div>
            
            <!-- Central Scan Button -->
            <div class="absolute -top-6 left-1/2 -translate-x-1/2">
                <button class="w-14 h-14 rounded-2xl bg-slate-900 flex flex-col items-center justify-center text-white shadow-xl">
                    <i class="ri-qr-scan-2-line text-xl"></i>
                    <span class="text-[8px] font-bold uppercase tracking-widest mt-1">扫码</span>
                </button>
            </div>
            
            <div class="w-14"></div> <!-- Spacer -->
            
            <div class="flex flex-col items-center gap-1 text-slate-300">
                <i class="ri-file-list-3-line text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-widest">订单</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-slate-300">
                <i class="ri-user-6-line text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-widest">我的</span>
            </div>
        </nav>
    </div>
</body>
</html>
