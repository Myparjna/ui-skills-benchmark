<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Mini - Vercel Design Guidelines</title>
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('https://vercel.com/font/geist-regular.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://vercel.com/font/geist-medium.woff2') format('woff2');
            font-weight: 500;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://vercel.com/font/geist-bold.woff2') format('woff2');
            font-weight: 700;
        }

        :root {
            --geist-foreground: #000;
            --geist-background: #fff;
            --accents-1: #fafafa;
            --accents-2: #eaeaea;
            --accents-3: #999;
            --accents-5: #666;
            --geist-success: #0070f3;
            --geist-border: #eaeaea;
            --geist-radius: 8px;
            --line-height-ratio: 1.6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Geist', -apple-system, sans-serif; background: var(--geist-background); color: var(--geist-foreground); line-height: var(--line-height-ratio); }

        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--accents-1); }

        /* Typography Mastery */
        h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.05em; line-height: 1.2; margin-bottom: 8px; }
        p { font-size: 16px; color: var(--accents-5); margin-bottom: 24px; }

        /* Card Layout */
        .header { padding: 48px 24px 24px; background: white; border-bottom: 1px solid var(--geist-border); }
        .card-list { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        
        .card { background: white; border: 1px solid var(--geist-border); border-radius: var(--geist-radius); padding: 24px; transition: box-shadow 0.2s ease, border-color 0.2s ease; cursor: pointer; position: relative; overflow: hidden; }
        .card:hover { border-color: var(--geist-foreground); box-shadow: 0 4px 14px 0 rgba(0,0,0,0.05); }
        .card:active { transform: scale(0.985); }

        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .card-meta { font-size: 14px; color: var(--accents-5); display: flex; gap: 12px; margin-bottom: 16px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-available { background: #0070f3; }
        
        .price-tag { font-size: 20px; font-weight: 700; color: var(--geist-foreground); }
        .price-unit { font-size: 12px; color: var(--accents-3); font-weight: 400; margin-left: 4px; }

        /* Hardware Accelerated Scroll Hint */
        .scroll-hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: black; color: white; padding: 12px 24px; border-radius: 32px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); pointer-events: none; }

        /* Unified Button */
        .btn-scan { position: fixed; bottom: 100px; right: 24px; width: 64px; height: 64px; background: black; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(0,0,0,0.3); border: none; cursor: pointer; transition: transform 0.2s; }
        .btn-scan:hover { transform: scale(1.1); }

        /* Navigation Bar (Vercel Style) */
        .nav-bar { height: 72px; background: white; border-top: 1px solid var(--geist-border); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--accents-3); text-decoration: none; font-size: 11px; font-weight: 500; }
        .nav-item.active { color: var(--geist-foreground); }

        svg { width: 20px; height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>附近充电站</h1>
            <p>为您找到 12 个空闲充电桩</p>
            <div style="display: flex; gap: 8px;">
                <div style="padding: 6px 12px; background: var(--accents-2); border-radius: 4px; font-size: 12px; font-weight: 500;">快充 (120kW+)</div>
                <div style="padding: 6px 12px; background: white; border: 1px solid var(--geist-border); border-radius: 4px; font-size: 12px;">免费停车</div>
            </div>
        </div>

        <div class="card-list">
            <div class="card">
                <div class="card-title">特来电超充站 · 萧山大厦 <span class="price-tag">¥1.28<span class="price-unit">/度</span></span></div>
                <div class="card-meta">
                    <span><span class="status-dot status-available"></span>8/10 空闲</span>
                    <span>1.2km</span>
                </div>
                <div style="font-size: 13px; color: var(--accents-5);">📍 萧山区市心中路 128 号 (地下 B2)</div>
            </div>

            <div class="card">
                <div class="card-title">星星充电 · 钱江世纪城 <span class="price-tag">¥0.98<span class="price-unit">/度</span></span></div>
                <div class="card-meta">
                    <span><span class="status-dot status-available"></span>4/12 空闲</span>
                    <span>2.5km</span>
                </div>
                <div style="font-size: 13px; color: var(--accents-5);">📍 盈丰街道鸿宁路 352 号</div>
            </div>

            <div class="card">
                <div class="card-title">云快充 · 滨江物联网园 <span class="price-tag">¥1.45<span class="price-unit">/度</span></span></div>
                <div class="card-meta">
                    <span><span class="status-dot status-available"></span>15/20 空闲</span>
                    <span>3.8km</span>
                </div>
                <div style="font-size: 13px; color: var(--accents-5);">📍 滨江区江南大道 1001 号</div>
            </div>

            <div class="card">
                <div class="card-title">特斯拉超级充电站 <span class="price-tag">¥1.85<span class="price-unit">/度</span></span></div>
                <div class="card-meta">
                    <span><span class="status-dot status-available"></span>2/8 空闲</span>
                    <span>4.1km</span>
                </div>
                <div style="font-size: 13px; color: var(--accents-5);">📍 万象城 2 期地面停车场</div>
            </div>
        </div>

        <button class="btn-scan" aria-label="扫码充电">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line><line x1="12" y1="3" x2="12" y2="21"></line></svg>
        </button>

        <nav class="nav-bar">
            <a href="#" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>地图</a>
            <a href="#" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>省钱</a>
            <a href="#" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>订单</a>
            <a href="#" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>我的</a>
        </nav>
    </div>
</body>
</html>
