<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空航空 Skystar Airlines - Vercel Design Guidelines</title>
    <style>
        :root {
            --geist-foreground: #000;
            --geist-background: #fff;
            --gray-100: #fafafa;
            --gray-200: #eaeaea;
            --gray-900: #111;
            --radius: 0; /* Minimalist brand edge */
            --font-main: -apple-system, system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-main); background: var(--geist-background); color: var(--geist-foreground); line-height: 1.5; -webkit-font-smoothing: antialiased; }

        /* Navigation */
        nav { height: 64px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; padding: 0 40px; background: white; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.05em; margin-right: 60px; }
        .nav-links { display: flex; gap: 40px; list-style: none; font-size: 14px; font-weight: 500; }
        .nav-links a { text-decoration: none; color: var(--geist-foreground); opacity: 0.6; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 1; }

        /* Hero Image Section - Balance Brand and Function */
        .hero { position: relative; height: 70vh; min-height: 500px; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .hero-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .hero-content { position: relative; z-index: 10; text-align: center; color: white; max-width: 800px; padding: 0 24px; }
        .hero-content h1 { font-size: clamp(40px, 8vw, 72px); font-weight: 800; letter-spacing: -0.06em; line-height: 1; margin-bottom: 24px; }
        
        /* Functional Search Overlay */
        .search-container { max-width: 1000px; margin: -40px auto 80px; position: relative; z-index: 20; padding: 0 24px; }
        .search-box { background: white; border: 1px solid var(--gray-200); box-shadow: 0 20px 50px rgba(0,0,0,0.1); padding: 40px; display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 24px; }
        
        .field-label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: var(--gray-900); }
        .field-input { width: 100%; border: none; border-bottom: 1px solid var(--gray-200); padding: 12px 0; font-size: 18px; font-weight: 500; outline: none; transition: border-color 0.2s; }
        .field-input:focus { border-color: black; }
        
        .btn-search { background: black; color: white; border: none; padding: 0 48px; font-size: 14px; font-weight: 600; cursor: pointer; height: 56px; margin-top: 20px; transition: transform 0.2s; }
        .btn-search:hover { transform: scale(1.02); }

        /* Featured Content */
        .section { padding: 120px 40px; max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray-900); margin-bottom: 60px; border-top: 1px solid black; padding-top: 16px; display: inline-block; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
        .destination-card { cursor: pointer; position: relative; overflow: hidden; }
        .dest-img-wrap { aspect-ratio: 16/9; overflow: hidden; margin-bottom: 16px; background: var(--gray-100); }
        .dest-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .destination-card:hover .dest-img { transform: scale(1.05); }
        .dest-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .dest-price { font-size: 14px; color: var(--gray-900); }

        /* Footer */
        footer { border-top: 1px solid var(--gray-200); padding: 80px 40px; text-align: center; font-size: 13px; color: var(--gray-900); }

        @media (max-width: 768px) {
            .search-box { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">SKYSTAR</div>
        <ul class="nav-links">
            <li><a href="#">航班查询</a></li>
            <li><a href="#">目的地</a></li>
            <li><a href="#">常旅客</a></li>
            <li><a href="#">关于我们</a></li>
        </ul>
        <div style="margin-left: auto; font-size: 14px; font-weight: 600; cursor: pointer;">登录</div>
    </nav>

    <section class="hero">
        <img src="https://images.unsplash.com/photo-1542296332-2e4473faf563?auto=format&fit=crop&w=1920&q=80" alt="Mountain View" class="hero-img">
        <div class="hero-content">
            <h1>飞向更远的地方</h1>
            <p style="font-size: 18px; opacity: 0.8; font-weight: 400;">星空航空成立于2008年，以安全、舒适、准时为核心承诺，连接世界枢纽。</p>
        </div>
    </section>

    <div class="search-container">
        <form class="search-box">
            <div>
                <label class="field-label">从哪里出发</label>
                <input type="text" class="field-input" placeholder="城市或机场">
            </div>
            <div>
                <label class="field-label">去哪里</label>
                <input type="text" class="field-input" placeholder="城市或机场">
            </div>
            <div>
                <label class="field-label">出发日期</label>
                <input type="text" class="field-input" placeholder="选择日期">
            </div>
            <button class="btn-search">搜索航班</button>
        </form>
    </div>

    <section class="section">
        <div class="section-title">精选目的地</div>
        <div class="grid">
            <div class="destination-card">
                <div class="dest-img-wrap">
                    <img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=800&q=80" alt="Tokyo" class="dest-img">
                </div>
                <div class="dest-title">东京 · Tokyo</div>
                <div class="dest-price">每日 2 班 · 赏樱季特惠 ¥1,299 起</div>
            </div>
            <div class="destination-card">
                <div class="dest-img-wrap">
                    <img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=800&q=80" alt="London" class="dest-img">
                </div>
                <div class="dest-title">伦敦 · London</div>
                <div class="dest-price">每周 5 班 · 商务舱特惠 ¥8,899 起</div>
            </div>
        </div>
    </section>

    <footer>
        <div style="font-weight: 700; margin-bottom: 24px; letter-spacing: -0.05em; font-size: 18px;">SKYSTAR AIRLINES</div>
        <div style="opacity: 0.5; margin-bottom: 40px;">杭州萧山国际机场运营基地 | 客服热线：400-800-9988</div>
        <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.3;">© 2026 Skystar Airlines Co., Ltd. All Rights Reserved.</div>
    </footer>
</body>
</html>
