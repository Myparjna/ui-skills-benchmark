/* ---------- Magnetic Button (direct DOM, no React state) ---------- */
function MagneticButton({ children, className = '', strength = 0.25, ...props }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const x = e.clientX - r.left - r.width / 2;
    const y = e.clientY - r.top - r.height / 2;
    el.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
  };
  const onLeave = () => {
    const el = ref.current; if (el) el.style.transform = 'translate(0,0)';
  };
  return (
    <button
      ref={ref}
      onMouseMove={onMove}
      onMouseLeave={onLeave}
      className={`transition-transform duration-300 will-change-transform ${className}`}
      {...props}
    >
      {children}
    </button>
  );
}

function CountdownClock() {
  const [t, setT] = useState({ d: 14, h: 7, m: 32, s: 18 });
  useEffect(() => {
    const id = setInterval(() => {
      setT(prev => {
        let { d, h, m, s } = prev;
        s -= 1;
        if (s < 0) { s = 59; m -= 1; }
        if (m < 0) { m = 59; h -= 1; }
        if (h < 0) { h = 23; d -= 1; }
        if (d < 0) { d = 14; h = 7; m = 32; s = 18; }
        return { d, h, m, s };
      });
    }, 1000);
    return () => clearInterval(id);
  }, []);
  const Cell = ({ v, l }) => (
    <div className="inline-block">
      <div className="font-mono text-3xl md:text-4xl font-medium tabular-nums text-ink-50">{String(v).padStart(2, '0')}</div>
      <div className="font-mono text-[10px] uppercase tracking-widest text-ink-500">{l}</div>
    </div>
  );
  return (
    <div className="flex items-end gap-3">
      <Cell v={t.d} l="days" />
      <span className="font-mono text-2xl text-ink-700 pb-5">:</span>
      <Cell v={t.h} l="hrs" />
      <span className="font-mono text-2xl text-ink-700 pb-5">:</span>
      <Cell v={t.m} l="min" />
      <span className="font-mono text-2xl text-ink-700 pb-5">:</span>
      <Cell v={t.s} l="sec" />
    </div>
  );
}
