<script>
const { createApp, computed, ref, reactive, onMounted, h } = Vue;

/* ========== Nuxt UI 等效组件（按 @nuxt/ui v4 API 重建） ========== */
// UButton
const UButton = {
  name: 'UButton',
  props: {
    label: String, icon: String, trailingIcon: String, size: { type: String, default: 'md' },
    color: { type: String, default: 'primary' }, variant: { type: String, default: 'solid' },
    to: String, block: Boolean, disabled: Boolean

  setup(p, { slots }) {
    const sizeCls = computed(() => ({
      xs: 'text-xs px-2 py-1', sm: 'text-sm px-2.5 py-1.5', md: 'text-sm px-3 py-2',
      lg: 'text-base px-4 py-2.5', xl: 'text-base px-5 py-3'

      const map = {

      href: p.to, disabled: p.disabled,

// UIcon
const UIcon = { name: 'UIcon', props: { name: String, class: String }, setup(p){ return () => h('i', { 'data-lucide': (p.name||'').replace('i-lucide-',''), class: p.class }); } };
// UCard
const UCard = { name:'UCard', props:{ ui:Object }, setup(p,{ slots }){ return () => h('div', { class: ['nui-card overflow-hidden', p.ui?.root] }, [

  h('div', { class: ['p-5', p.ui?.body] }, slots.default?.()),
  slots.footer ? h('div', { class: ['px-5 py-3 border-t border-muted bg-muted/50', p.ui?.footer] }, slots.footer()) : null,

// UBadge
const UBadge = { name:'UBadge', props:{ color:{default:'primary'}, variant:{default:'subtle'}, label:String, icon:String }, setup(p){ const c = { primary:'bg-primary-100 text-primary-700', neutral:'bg-neutral-100 text-neutral-700', success:'bg-emerald-100 text-emerald-700', warning:'bg-amber-100 text-amber-700', error:'bg-red-100 text-red-700', info:'bg-sky-100 text-sky-700' }; const v = { solid: p.color==='primary'?'bg-primary text-white':'bg-neutral-800 text-white', soft: c[p.color]||c.primary, outline:'border border-current', subtle: c[p.color]||c.primary }; return () => h('span',{class:['inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-medium', v[p.variant]||v.subtle]},[ p.icon?h('i',{'data-lucide':p.icon,class:'size-3'}):null, p.label ]); }};
// UInput
const UInput = { name:'UInput', props:{ modelValue:String, placeholder:String, icon:String, type:{default:'text'} }, emits:['update:modelValue'], setup(p,{ emit }){ return () => h('div',{class:'relative w-full'},[ p.icon?h('i',{'data-lucide':p.icon,class:'size-4 absolute left-3 top-1/2 -translate-y-1/2 text-dimmed'}):null, h('input',{ type:p.type, value:p.modelValue, placeholder:p.placeholder, onInput:e=>emit('update:modelValue', e.target.value), class:['nui-input', p.icon?'pl-9':''] }) ]); }};
// USelect
const USelect = { name:'USelect', props:{ modelValue:String, items:Array }, emits:['update:modelValue'], setup(p,{ emit }){ return () => h('div',{class:'relative'},[ h('select',{ value:p.modelValue, onChange:e=>emit('update:modelValue', e.target.value), class:'nui-input appearance-none pr-9 cursor-pointer' }, (p.items||[]).map(i => h('option',{ value: typeof i==='string'?i:i.value }, typeof i==='string'?i:i.label))), h('i',{'data-lucide':'chevron-down', class:'size-4 absolute right-3 top-1/2 -translate-y-1/2 text-dimmed pointer-events-none'}) ]); }};

// UPageSection

// UFooter
const UFooter = { name:'UFooter', setup(p,{ slots }){ return () => h('footer',{class:'border-t border-muted bg-muted/40 mt-8'},[ h('div',{class:'mx-auto max-w-6xl px-6 py-12'},[ slots.default?.() ]) ]); }};

/* ========== 应用 ========== */
const App = {

  template: `
