<style>

ont-size:13px;color:#526078}.price b{font-size:18px;color:var(--ink)}.go{border:0;color:#fff;background:var(--blue);border-radius:10px;padding:10px 15px;font-weight:700}.charge-card{margin-top:13px;padding:13px 15px;border-radius:var(--r);background:linear-gradient(105deg,#072a62,#1166cb);color:#fff;display:flex;justify-content:space-between;align-items:center}.charge-card small{color:#c6e2ff}.charge-card b{display:block;font-size:15px}.charge-card button{border:1px solid #ffffff54;background:#fff1;color:#fff;padding:8px 11px;border-radius:9px}.tabbar{position:absolute;z-index:2;bottom:0;left:0;right:0;height:84px;background:#fffffff2;backdrop-filter:blur(15px);border-top:1px solid #e5edf5;display:flex;justify-content:space-around;align-items:center}.tab{height:64px;min-width:56px;border:0;background:transparent;color:#7c899e;font-size:11px;display:flex;gap:4px;flex-direction:column;align-items:center;justify-content:center}.tab i{width:21px;height:18px;border:2px solid currentColor;border-radius:6px;display:block}.tab.active{color:var(--blue);font-weight:700}.scan{margin-top:-28px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#16c6ba,#1677ff);color:#fff;border:5px solid #f6f9fd;box-shadow:0 7px 17px #1677ff66;display:grid;place-items:center;font-size:26px}.scan:before{content:"";width:20px;height:20px;border:2px solid #fff;border-radius:4px}.modal{position:absolute;inset:0;background:#071a3bbd;z-index:5;display:none;align-items:end}.modal.open{display:flex}.modal-card{width:100%;background:#fff;border-radius:26px 26px 0 0;padding:24px 20px 34px;animation:up .3s var(--ease)}@keyframes up{from{transform:translateY(80px);opacity:0}}.modal-card h2{font-size:22px;margin:0 0 8px}.modal-card p{color:var(--muted);font-size:14px}.fake-camera{height:160px;border-radius:16px;background:repeating-linear-gradient(90deg,#132846 0 2px,transparent 2px 13px),repeating-linear-gradient(#132846 0 2px,transparent 2px 13px),#092250;position:relative;margin:2 </style></head><body><main class="phone" aria-label="闪充小程序首页"><section class="top"><div class="head"><span class="loc">杭州·滨江区</span><button class="bell" aria-label="消息"></button></div><div class="greeting">附近有 26 个空闲快充桩<small>已根据您的车型筛选国标接口</small></div></section><section class="map" aria-label="附近充电站地图"><i class="river"></i><i class="road"></i><i class="road two"></i><button class="pin p1" aria-label="绿洲充电站，8个空闲"><b>8</b></button><button class="pin p2" aria-label="星途快充，2个空闲"><b>2</b></button><button class="pin p3" aria-label="杭州之门充电站，6个空闲"><b>6</b></button><button class="locate" aria-label="定位">◎</button></section><section class="sheet"><div class="grab"></div><div class="mini-tabs"><button class="chip active">综合排序</button><button class="chip">快充优先</button><button class="chip">免费停车</button><button class="chip">PLUS 优惠</button></div><article class="station"><div class="station-head"><div><h2>绿洲充电站 · 星耀城</h2><p>江南大道 228 号 B2 停车场 · 全天营业</p></div><span class="distance">0.6 km</span></div><div class="stations"><span class="slot">快充 空闲 8</span><span class="slot busy">充电中 4</span><span class="slot">停车 2 小时免费</span></div><div class="station-foot"><span class="price">低谷价 <b>¥0.86</b> / 度</span><button class="go">去充电</button></div></article><article class="charge-card"><div><small>进行中的充电</small><b>杭州之门 2 号桩 · 已充 18.6 kWh</b></div><button id="viewCharge">查看进度</button></article></section><nav class="tabbar" aria-label="底部导航"><button class="tab active" data-name="找桩"><i></i>找桩</button><button class="tab" data-name="省钱"><i></i>省钱</button><button class="tab scan" id="scan" aria-label="扫码充电"></button><button class="tab" data-name="订单"><i></i>订单</button><button class="tab" data-name="我的"><i></i>我的</button></nav><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="扫码启动充电"><div class="modal-card"><h2>扫码启动充电</h2><p>请将桩体二维码置于取景框内，识别后将展示充电模式与支付方式。</p><div class="fake-camera"></div><div class="modal-actions"><button class="cancel" id="cancel">取消</button><button class="confirm" id="confirm">模拟识别并启动</button></div></div></div><div class="toast" role="status" aria-live="polite" id="toast"></div></main><script>const modal=document.getElementById('modal'),toast=document.getElementById('toast');const say=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2300)};document.getElementById('scan').onclick=()=>modal.classList.add('open');document.getElementById('cancel').onclick=()=>modal.classList.remove('open');document.getElementById('confirm').onclick=()=>{modal.classList.remove('open');say('已识别 3 号直流桩，充电已启动');};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{document.querySelector('.chip.active').classList.remove('active');x.classList.add('active');say('已按“'+x.textContent+'”更新站点');});document.querySelectorAll('.tab:not(.scan)').forEach(x=>x.onclick=()=>{document.querySelector('.tab.active').classList.remove('active');x.classList.add('active');say(x.dataset.name+'功能已就绪');});document.querySelector('.go').onclick=()=>say('已为您规划前往绿洲充电站的路线');document.getElementById('viewCharge').onclick=()=>say('当前功率 58 kW，预计 18:42 充满');</script></body></html>
