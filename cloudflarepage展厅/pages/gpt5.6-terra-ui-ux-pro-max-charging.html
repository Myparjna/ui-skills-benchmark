bsolute;top:14px;left:16px;right:16px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);border-radius:12px;padding:12px 13px;box-shadow:0 4px 15px rgba(34,67,50,.12);color:#70809a}.search svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}.chiprow{position:absolute;top:69px;left:16px;right:16px;display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid #dbe5ed;background:#fff;border-radius:18px;padding:7px 12px;color:#43526a;font-size:12px}.chip.active{background:#eaf3ff;color:var(--blue);border-color:#b9d6ff}.pin{position:absolute;width:44px;height:44px;border-radius:50% 50% 50% 0;background:var(--blue);color:#fff;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 6px 15px rgba(22,119,255,.35)}.pin b{transform:rotate(45deg);font-size:12px}.pin.orange{background:var(--orange)}.pin.green{background:var(--green)}.pin.one{top:142px;left:51%}.pin.two{top:214px;left:20%}.pin.three{top:112px;right:18%}.map-tools{position:absolute;right:16px;bottom:21px;display:grid;gap:10px}.tool{border:0;width:40px;height:40px;border-radius:11px;background:#fff;color:#426180;box-shadow:0 3px 12px rgba(30,55,45,.15);display:grid;place-items:center}.tool svg{width:20px;stroke:currentColor;fill:none;stroke-width:2}.sheet{background:#fff;border-radius:22px 22px 0 0;position:relative;margin-top:-22px;padding:13px 16px 16px;min-height:360px}.grip{width:40px;height:4px;background:#d7dee8;border-radius:4px;margin:0 auto 12px}.sheet-top{display:flex;justify-content:space-between;align-items:center}.sheet-top h1{font-size:18px;margin:0}.sheet-top button{border:0;background:none;color:var(--blue);padding:8px;font-weight:600}.sort{display:flex;gap:15px;color:#65728a;font-size:13px;margin:13px 0 10px}.sort button{border:0;background:none;padding:0;color:inherit}.sort button.active{color:var(--blue);font-weight:700}.station{width:100%;text-align:left;background:#fff;border:0;border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:48px 1fr auto;gap:11px}.station:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}.logo{height:48px;border-radius:12px;display:grid;place-items:center;background:#eef5ff;color:var(--blue);font-weight:800;font-size:19px}.station h2{font-size:15px;margin:0 0 3px}.station p{margin:0;color:var(--muted);font-size:12px}.state{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-size:12px;margin-top:4px}.state i{width:7px;height:7px;background:currentColor;border-radius:50%}.price{text-align:right;color:var(--orange);font-weight:750}.price small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:4px}.nav{position:fixed;z-index:4;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);height:82px;background:rgba(255,255,255,.98);border-top:1px solid #e5eaf1;display:flex;align-items:center;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}.tab{min-width:52px;height:58px;border:0;background:none;color:#7b879c;display:grid;place-items:center;gap:2px;font-size:11px}.tab svg{width:21px}.tab.active{color:var(--blue);font-weight:650}.scan{width:58px;height:58px;border:0;border-radius:50%;margin-top:-32px;background:linear-gradient(135deg,#1e97ff,#18bd91);color:#fff;box-shadow:0 8px 20px rgba(22,119,255,.35);display:grid;place-items:center}.scan svg{width:27px}.modal{position:fixed;inset:0;background:rgba(10,22,44,.5);z-index:8;display:none;align-items:end;justify-content:center}.modal.show{display:flex}.dialog{width:min(100%,440px);background:#fff;border-radius:22px 22px 0 0;padding:22px 20px 32px;animation:up .22s ease-out}.dialog h2{margin:0 0 5px;font-size:21px}.dialog>p{margin:0;color:var(--muted);font-size:13px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.mode{padding:13px 6px;border:1px solid #dfe5ee;border-radius:10px;text-align:center;color:#53617a;font-size:13px}.mode.active{background:#edf5ff;color:var(--blue);border-color:#90c2ff;font-weight:700}.charge-panel{background:#f5f9ff;border-radius:14px;padding:16px;margin:14px 0}.charge-panel strong{font-size:25px;color:#132b56}.charge-panel p{margin:4px 0 0;color:var(--muted);font-size:13px}.primary{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700}.secondary{background:#fff;color:var(--blue);border:1px solid #b9d6ff;margin-top:9px}.qr{width:170px;height:170px;margin:18px auto;background:repeating-linear-gradient(90deg,#14233a 0 6px,#fff 6px 10px),repeating-linear-gradient(0deg,transparent 0 8px,rgba(255,255,255,.85) 8px 12px);background-blend-mode:multiply;border:11px solid #fff;box-shadow:0 0 0 1px #e1e7f0}@keyframes up{from{transform:translateY(25px);opacity:0}to{transform:none;opacity:1}}.toast{position:fixed;z-index:10;left:50%;bottom:98px;transform:translate(-50%,14px);background:#152c51;color:white;padding:11px 14px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:720px){body{padding:25px 0}.shell{border-radius:25px;box-shadow:0 18px 55px rgba(33,54,80,.18);min-height:820px}.nav{border-radius:0 0 25px 25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="shell"><header class="top"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2310a37f'/%3E%3C/svg%3E"><button class="loc" aria-label="定位到当前位置" data-toast="已定位到杭州市西湖区"><svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12Z"/><circle cx="12" cy="9" r="2"/></svg></button><div class="address"><b>杭州市西湖区</b><span>已为您展示 5km 内可用充电站</span></div><button class="head-btn" aria-label="消息中心" data-toast="暂无未读服务通知"><i></i><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button></header><section class="map" aria-label="附近充电站地图"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><span>搜索充电站、商圈或桩编号</span></div><div class="chiprow"><button class="chip active">附近</button><button class="chip">超充</button><button class="chip">空闲较多</button><button class="chip">免费停车</button></div><button class="pin one" aria-label="西溪印象城充电站，空闲18枪"><b>18</b></button><button class="pin orange two" aria-label="黄龙万科中心充电站，空闲4枪"><b>4</b></button><button class="pin green three" aria-label="西湖文化广场充电站，空闲12枪"><b>12</b></button><div class="map-tools"><button class="tool" aria-label="切换地图图层" data-toast="已切换至桩位图层"><svg viewBox="0 0 24 24"><path d="m3 6 9-3 9 3-9 3-9-3Zm0 6 9 3 9-3m-18 6 9 3 9-3"/></svg></button><button class="tool" aria-label="定位" data-toast="地图已回到当前位置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg></button></div></section><section class="sheet"><div class="grip"></div><div class="sheet-top"><h1>附近充电站 <span style="color:#8895a9;font-size:13px;font-weight:400">共 36 个</span></h1><button data-toast="筛选面板已打开">筛选</button></div><div class="sort"><button class="active">综合排序</button><button>距离最近</button><button>价格最低</button></div><button class="station" data-station="西溪印象城地下停车场"><div class="logo">电</div><div><h2>西溪印象城地下停车场</h2><p>文二西路 551 号 · 距您 680m</p><span class="state"><i></i>快充 18 / 慢充 6 空闲</span></div><div class="price">¥1.24<small>元/度起</small></div></button><button class="station" data-station="黄龙万科中心充电站"><div class="logo" style="background:#f0f8ee;color:#249b57">能</div><div><h2>黄龙万科中心充电站</h2><p>学院路 77 号 · 距您 1.2km</p><span class="state" style="color:#e97917"><i></i>快充 4 / 慢充 2 空闲</span></div><div class="price">¥1.18<small>停车减免</small></div></button></section></main><nav class="nav" aria-label="底部导航"><button class="tab active" data-toast="已在找桩首页"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-7h6v7"/></svg><span>首页</span></button><button class="tab" data-toast="优惠活动：本周充电满 30 减 5"><svg viewBox="0 0 24 24"><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7m16 0H4m16 0 1-5H3l1 5m5-5V4h6v3"/></svg><span>省钱</span></button><button class="scan" aria-label="扫码充电"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V4h4m8 0h4v4M4 16v4h4m12-4v4h-4M8 8h3v3H8zm5 5h3v3h-3zM8 13h3v3H8z"/></svg></button><button class="tab" data-toast="您有 1 笔充电中订单"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 7h6m-6 4h6m-6 4h4"/></svg><span>订单</span></button><button class="tab" data-toast="我的：PLUS 会员本月已省 ¥26.4"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>我的</span></button></nav><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><section class="dialog"><div class="grip"></div><h2 id="mTitle">扫码充电</h2><p>请扫描充电桩面板二维码，或输入桩编号。</p><div class="qr" aria-label="模拟二维码"></div><button class="primary" id="start">模拟扫码并启动</button><button class="primary secondary" id="close">手动输入桩编号</button></section></div><div class="modal" id="stationModal" role="dialog" aria-modal="true"><section class="dialog"><div class="grip"></div><h2 id="stationTitle">充电站</h2><p>国标快充 · 24 小时营业 · 进场后可扫码即充</p><div class="modes"><button class="mode active">按金额<br><b>¥20</b></button><button class="mode">按电量<br><b>20 度</b></button><button class="mode">充满为止<br><b>智能推荐</b></button></div><div class="charge-panel"><strong>预计可补能 18.2kWh</strong><p>约 38 分钟 · 已自动匹配 PLUS 折扣与最优券</p></div><button class="primary" id="goCharge">导航并开始充电</button><button class="primary secondary closeStation">返回地图</button></section></div><div class="toast" role="status" aria-live="polite"></div><script>const toast=document.querySelector('.toast');let timer;function say(x){toast.textContent=x;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}document.querySelectorAll('[data-toast]').forEach(x=>x.onclick=()=>say(x.dataset.toast));document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('.chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');say('已应用「'+x.textContent+'」筛选')});document.querySelectorAll('.sort button').forEach(x=>x.onclick=()=>{document.querySelectorAll('.sort button').forEach(y=>y.classList.remove('active'));x.classList.add('active');say('已按'+x.textContent+'排序')});const modal=document.querySelector('#modal'),sm=document.querySelector('#stationModal');document.querySelector('.scan').onclick=()=>modal.classList.add('show');document.querySelector('#close').onclick=()=>say('请输入桩编号，例如 HZ-XS-018');document.querySelector('#start').onclick=()=>{modal.classList.remove('show');say('桩编号识别成功，正在发送启动指令')};document.querySelectorAll('.station').forEach(x=>x.onclick=()=>{document.querySelector('#stationTitle').textContent=x.dataset.station;sm.classList.add('show')});document.querySelectorAll('.closeStation').forEach(x=>x.onclick=()=>sm.classList.remove('show'));document.querySelector('#goCharge').onclick=()=>{sm.classList.remove('show');say('已启动导航，到站后可扫码充电')};document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{document.querySelectorAll('.mode').forEach(y=>y.classList.remove('active'));x.classList.add('active')});[modal,sm].forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show')});</script></body></html>
