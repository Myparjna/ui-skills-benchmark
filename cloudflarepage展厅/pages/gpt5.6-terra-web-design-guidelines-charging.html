<body><div class="phone"><a class="skip" href="#main">跳到主要内容</a><header class="top"><div class="location"><b>杭州</b>西湖区 · 已定位</div><label class="search" for="station-search">⌕<input id="station-search" name="station-search" autocomplete="off" placeholder="搜索充电站、商圈或地址…"></label></header><main id="main"><section class="map" aria-label="附近充电站地图"><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><button class="station s1" aria-label="文三路星充站，快充空闲 8 个"></button><button class="station s2" aria-label="黄龙万科中心站，快充空闲 2 个"></button><button class="station s3" aria-label="西溪印象城站，快充空闲 6 个"></button><button class="locate" aria-label="重新定位">◎</button></section><section class="sheet" aria-labelledby="nearby-title"><div class="handle" aria-hidden="true"></div><div class="row"><h1 id="nearby-title">附近可充电</h1><a href="#station-list">查看列表</a></div><div class="filters" aria-label="充电站筛选"><button type="button" aria-pressed="true">综合排序</button><button type="button" aria-pressed="false">快充优先</button><button type="button" aria-pressed="false">空闲最多</button><button type="button" aria-pressed="false">停车减免</button></div><p class="notice" id="filter-status" aria-live="polite"></p><div id="station-list"><article class="station-card"><h2>文三路星充站</h2><p>距您 480 米 · 文三路 90 号地库 B2</p><div class="detail"><span class="available">快充空闲 8</span><span>4.8 分 · 停车前 2 小时免费</span><span class="price">¥1.24/度</span></div><button type="button" class="charge-button">去充电</button></article><article class="station-card"><h2>黄龙万科中心充电站</h2><p>距您 1.2 公里 · 曙光路 122 号</p><div class="detail"><span class="available">超充空闲 2</span><span>4.7 分 · 24小时营业</span><span class="price">¥1.38/度</span></div><button type="button" class="charge-button">去充电</button></article></div></section><section class="live" aria-label="充电中订单"><small>正在充电 · 杭州文三路星充站 A-06</small><strong>62%　38.6 kW</strong><div class="progress" aria-label="当前电量 62%"><i></i></div><div class="pay"><span>已充 24.8 度 · 00:38:16</span><span>预计 ¥31.20</span></div></section></main><nav class="nav" aria-label="底部导航"><button type="button" aria-current="page"><span>⌖</span>找桩</button><button type="button"><span>□</span>优惠</button><button type="button" class="scan" aria-label="扫码充电">▣</button><button type="button"><span>◷</span>订单</button><button type="button"><span>◯</span>我的</button></nav></div><dialog class="dialog" id="charge-dialog"><article><h2>启动充电</h2><p>扫描桩上二维码，或输入充电桩编号后继续。</p><label for="pile-number">充电桩编号</label><input id="pile-number" name="pile-number" inputmode="numeric" autocomplete="off" placeholder="例如：HZ-XS-10086…"><menu><button type="button" id="close-dialog">取消</button><button type="button" id="start-charge">确认启动</button></menu><p id="dialog-status" aria-live="polite"></p></article></dialog><script>const d=document.getElementById('charge-dialog'),s=document.getElementById('dialog-status');document.querySelector('.scan').addEventListener('click',()=>d.showModal());document.querySelectorAll('.charge-button').forEach(b=>b.addEventListener('click',()=>d.showModal()));document.getElementById('close-dialog').addEventListener('click',()=>d.close());document.getElementById('start-charge').addEventListener('click',()=>{const n=document.getElementById('pile-number');if(!n.value.trim()){s.textContent='请输入充电桩编号后继续。';n.focus();return}s.textContent='正在发送启动请求…'});document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.getElementById('filter-status').textContent='已按“'+b.textContent+'”更新附近充电站。'}));</script></body></html>
