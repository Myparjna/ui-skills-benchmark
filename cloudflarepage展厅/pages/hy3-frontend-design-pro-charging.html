<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>闪充 EV · 电动车充电桩小程序</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: { 900: '#0F172A', 800: '#1E293B', 700: '#334155' },
          mist: '#F5F7FA',
          brand: { 500: '#1677FF', 600: '#0E5FD8', 700: '#0B4CB0' },
          free: '#52C41A',
          charging: '#FA8C16',
          danger: '#F5222D',
        },
        fontFamily: { sans: ['"Noto Sans SC"', 'system-ui', 'sans-serif'] },
        borderRadius: { card: '12px', btn: '8px', tag: '4px' },
        boxShadow: { sheet: '0 -8px 30px -12px rgba(0,0,0,.18)' },
      },
    },
  };
</script>
<style>
  html, body { margin: 0; background: #EAECEF; -webkit-font-smoothing: antialiased; }
  .phone { max-width: 430px; width: 100%; height: 100vh; min-height: 100vh; margin: 0 auto; background: #F5F7FA; position: relative; box-shadow: 0 0 60px -20px rgba(0,0,0,.25); }
  @media (min-width: 480px) { .phone-wrap { padding: 28px 0; } .phone { height: 860px; min-height: 860px; border-radius: 40px; overflow: hidden; border: 10px solid #111; } }
  .sheet { transition: transform .35s cubic-bezier(.22,1,.36,1); }
  .tabbar-h { height: 64px; padding-bottom: env(safe-area-inset-bottom); }
  .nav-blur { backdrop-filter: saturate(160%) blur(14px); }
  .ring-track { stroke: #E6EAF0; } .ring-fill { stroke: #FA8C16; transition: stroke-dashoffset .9s linear; }
  ::-webkit-scrollbar { width: 0; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="font-sans">
<div class="phone-wrap"><div class="phone" id="root"></div></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STATIONS = [
  { id: 'S1', name: '西湖文化广场充电站', op: '特来电', dist: '320m', free: 8, total: 12, price: 0.98, park: '免费停车2h', x: 22, y: 30, score: 4.8 },
  { id: 'S2', name: '黄龙体育中心超充站', op: '星星充电', dist: '680m', free: 2, total: 20, price: 1.15, park: '¥5/时', x: 58, y: 22, score: 4.6 },
  { id: 'S3', name: '滨江星光大道站', op: '云快充', dist: '1.2km', free: 15, total: 18, price: 0.89, park: '免费停车', x: 72, y: 55, score: 4.9 },
  { id: 'S4', name: '城西银泰快充站', op: '特来电', dist: '1.8km', free: 0, total: 10, price: 1.05, park: '¥6/时', x: 35, y: 68, score: 4.3 },
  { id: 'S5', name: '运河亚运公园站', op: '星星充电', dist: '2.3km', free: 5, total: 14, price: 0.95, park: '免费停车1h', x: 14, y: 52, score: 4.7 },
];

const OP_COLOR = { '特来电': '#1677FF', '星星充电': '#52C41A', '云快充': '#FA8C16' };

function MapPins({ onPick, active }) {
  return (
    <div className="absolute inset-0">
      {/* 路网装饰 */}
      <svg className="absolute inset-0 w-full h-full opacity-60" preserveAspectRatio="none" viewBox="0 0 100 100">
        <path d="M0 40 H100 M0 70 H100 M30 0 V100 M65 0 V100" stroke="#D9E0EA" strokeWidth="1.2" fill="none"/>
        <path d="M10 0 L40 100 M90 0 L60 100" stroke="#E4EAF2" strokeWidth="1" fill="none"/>
      </svg>
      <div className="absolute left-[8%] top-[18%] w-24 h-16 rounded-full bg-brand-500/10 blur-xl"></div>
      <div className="absolute right-[10%] bottom-[18%] w-28 h-20 rounded-full bg-free/10 blur-xl"></div>
      {STATIONS.map((s) => (
        <button key={s.id} onClick={() => onPick(s)} className="absolute -translate-x-1/2 -translate-y-1/2 group" style={{ left: s.x + '%', top: s.y + '%' }}>
          <span className={'relative grid place-items-center h-9 px-2.5 rounded-full text-white text-[11px] font-bold shadow-md transition-transform ' + (active === s.id ? 'scale-110 ring-2 ring-white' : 'group-hover:scale-105')}
            style={{ background: OP_COLOR[s.op] }}>
            {s.free}<span className="ml-0.5 opacity-80">空闲</span>
          </span>
        </button>
      ))}
    </div>
  );
}

function Home({ onScan }) {
  const [active, setActive] = useState('S3');
  const [sheetUp, setSheetUp] = useState(false);
  const cur = STATIONS.find((s) => s.id === active);
  const list = [...STATIONS].sort((a, b) => parseFloat(a.dist) - parseFloat(b.dist));
  return (
    <div className="relative h-full">
      {/* 顶部状态栏 + 搜索 */}
      <div className="absolute top-0 inset-x-0 z-20 px-4 pt-3">
        <div className="flex items-center gap-2">
          <div className="flex-1 bg-white/95 rounded-btn shadow-sm px-3 py-2 flex items-center gap-2 text-sm text-ink-900/70">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1677FF" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            找附近充电站
          </div>
          <button className="bg-white/95 rounded-btn shadow-sm p-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1677FF" strokeWidth="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></button>
        </div>
        <div className="mt-2 flex gap-2 overflow-x-auto">
          {['全部', '快充', '超充', '免费停车', 'PLUS站'].map((c, i) => (
            <span key={c} className={'shrink-0 text-[12px] px-3 py-1.5 rounded-full ' + (i === 0 ? 'bg-brand-500 text-white' : 'bg-white/90 text-ink-900/65')}>{c}</span>
          ))}
        </div>
      </div>

      {/* 地图 */}
      <div className="absolute inset-0 bg-gradient-to-br from-[#EAF1FB] to-[#E7F6EC]">
        <MapPins onPick={(s) => { setActive(s.id); setSheetUp(false); }} active={active} />
      </div>

      {/* 定位按钮 */}
      <button className="absolute right-4 bottom-[280px] z-20 bg-white rounded-full shadow-md p-2.5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1677FF" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>

      {/* 底部上滑面板 */}
      <div className={'sheet absolute inset-x-0 bottom-0 z-30 bg-white rounded-t-[16px] shadow-sheet ' + (sheetUp ? 'translate-y-0' : 'translate-y-[calc(100%-300px)]')}>
        <div className="px-4 pt-2.5" onClick={() => setSheetUp(!sheetUp)}>
          <div className="mx-auto w-10 h-1 rounded-full bg-gray-300"></div>
          <div className="mt-3 flex items-center justify-between">
            <div>
              <h3 className="font-bold text-ink-900">{cur.name}</h3>
              <p className="text-[12px] text-ink-900/50 mt-0.5">{cur.dist} · {cur.op} · ★{cur.score}</p>
            </div>
            <span className="text-[12px] text-brand-500 font-medium">{sheetUp ? '收起 ▾' : '展开列表 ▴'}</span>
          </div>
          <div className="mt-3 flex gap-3 text-[12px]">
            <span className="text-free font-semibold">● {cur.free}/{cur.total} 空闲</span>
            <span className="text-ink-900/60">¥{cur.price}/度</span>
            <span className="text-ink-900/60">{cur.park}</span>
          </div>
        </div>
        <div className="px-4 mt-3 max-h-[210px] overflow-y-auto">
          {list.map((s) => (
            <button key={s.id} onClick={() => { setActive(s.id); }} className={'w-full text-left py-3 flex items-center gap-3 border-t border-gray-100 ' + (active === s.id ? 'bg-brand-500/5 -mx-2 px-2 rounded-btn' : '')}>
              <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: OP_COLOR[s.op] }}></span>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium text-ink-900 truncate">{s.name}</div>
                <div className="text-[11px] text-ink-900/45">{s.dist} · {s.op} · ★{s.score}</div>
              </div>
              <div className="text-right">
                <div className="text-[13px] font-semibold" style={{ color: s.free ? '#52C41A' : '#F5222D' }}>{s.free}空闲</div>
                <div className="text-[11px] text-ink-900/45">¥{s.price}</div>
              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function Coupons() {
  const data = [
    ['满20减8', '全城快充通用 · 7天有效', 'free', '领取'],
    ['超充8折券', '星星充电超充站专享', 'brand', '已领'],
    ['免费停车2h', '合作停车场核销', 'free', '领取'],
    ['能量包 100度', '锁定低价 ¥89 · 适合高频', 'charge', '¥89购'],
    ['PLUS月卡', '充电6折起 + 5张满减券', 'gold', '¥9.9开通'],
  ];
  const c = { free: 'bg-free/10 text-free', brand: 'bg-brand-500/10 text-brand-600', charge: 'bg-charging/10 text-charging', gold: 'bg-yellow-500/10 text-yellow-600' };
  return (
    <div className="px-4 pt-5 pb-4 space-y-3">
      <h2 className="font-bold text-lg text-ink-900">省钱 · 活动中心</h2>
      <div className="rounded-card bg-gradient-to-r from-brand-500 to-brand-700 text-white p-4">
        <div className="text-sm opacity-80">PLUS 会员（银）</div>
        <div className="font-bold text-xl mt-1">充电低至 6 折 · 月省约 ¥50</div>
        <button className="mt-3 bg-white text-brand-600 text-sm font-medium px-4 py-1.5 rounded-btn">¥9.9/月 开通</button>
      </div>
      {data.map(([t, d, k, btn]) => (
        <div key={t} className="flex items-center gap-3 bg-white rounded-card p-3 shadow-sm">
          <div className={'w-14 h-14 rounded-btn grid place-items-center text-center text-[11px] font-bold leading-tight ' + c[k]}>{t}</div>
          <div className="flex-1">
            <div className="text-sm font-medium text-ink-900">{t.includes('能量包') || t.includes('PLUS') ? d : d}</div>
            <div className="text-[11px] text-ink-900/45 mt-0.5">{t.includes('能量包') || t.includes('PLUS') ? '限时特惠' : d}</div>
          </div>
          <button className="text-[12px] font-medium text-brand-600 border border-brand-500 rounded-btn px-3 py-1.5">{btn}</button>
        </div>
      ))}
    </div>
  );
}

function Scan({ onStart }) {
  return (
    <div className="h-full flex flex-col items-center justify-center px-8 bg-gradient-to-b from-ink-900 to-ink-800 text-white">
      <div className="w-56 h-56 rounded-2xl border-2 border-white/30 relative overflow-hidden grid place-items-center">
        <div className="absolute inset-3 border border-brand-500/60 rounded-xl"></div>
        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-10 h-0.5 bg-brand-500 animate-pulse"></div>
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.5" opacity=".7"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M4 12h16"/></svg>
      </div>
      <p className="mt-6 text-sm text-white/70">将二维码放入框内，即可自动识别启动</p>
      <button onClick={onStart} className="mt-8 bg-brand-500 hover:bg-brand-600 px-8 py-3 rounded-btn font-medium transition-colors">模拟扫码启动</button>
      <button onClick={onStart} className="mt-4 text-sm text-white/55 underline">手动输入桩编号</button>
    </div>
  );
}

function Charging() {
  const [p, setP] = useState(0);
  const [stop, setStop] = useState(false);
  const confirmStop = () => { if (window.confirm('确认停止充电？未充满部分将按实际计费。')) setStop(true); };
  useEffect(() => {
    if (stop) return;
    const t = setInterval(() => setP((v) => (v >= 100 ? 100 : v + 1.4)), 900);
    return () => clearInterval(t);
  }, [stop]);
  const kwh = (p * 0.52 / 100).toFixed(2);
  const cost = (parseFloat(kwh) * 1.05 + 0.8).toFixed(2);
  const min = Math.floor((p / 100) * 42);
  const R = 84, C = 2 * Math.PI * R;
  return (
    <div className="h-full flex flex-col bg-mist">
      <div className="bg-ink-900 text-white px-4 pt-4 pb-6">
        <div className="text-sm text-white/60">充电中 · 城西银泰快充站</div>
        <div className="text-xs text-white/40 mt-0.5">桩号 A07 · 枪号 2 · 国标接口</div>
      </div>
      <div className="flex-1 flex flex-col items-center -mt-10">
        <div className="relative w-56 h-56">
          <svg className="w-full h-full -rotate-90" viewBox="0 0 200 200">
            <circle className="ring-track" cx="100" cy="100" r={R} strokeWidth="14" fill="none"/>
            <circle className="ring-fill" cx="100" cy="100" r={R} strokeWidth="14" fill="none" strokeLinecap="round"
              strokeDasharray={C} strokeDashoffset={C * (1 - p / 100)}/>
          </svg>
          <div className="absolute inset-0 grid place-items-center text-center">
            <div>
              <div className="font-bold text-4xl text-charging">{p.toFixed(0)}<span className="text-xl">%</span></div>
              <div className="text-[12px] text-ink-900/50 mt-1">{kwh} kWh</div>
            </div>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-3 mt-6 w-[300px]">
          <Stat label="实时功率" value={(60 - p * 0.3).toFixed(1) + ' kW'} />
          <Stat label="已用时长" value={min + ' min'} />
          <Stat label="实时费用" value={'¥' + cost} />
        </div>
        <p className="text-[12px] text-ink-900/45 mt-6">预计 {Math.max(0, 42 - min)} 分钟后充满 · 完成后自动免密扣费</p>
        <button onClick={confirmStop} className="mt-6 text-sm text-danger border border-danger/40 rounded-btn px-6 py-2.5">停止充电</button>
      </div>
    </div>
  );
}
function Stat({ label, value }) {
  return (<div className="bg-white rounded-card shadow-sm py-3 text-center"><div className="text-[11px] text-ink-900/45">{label}</div><div className="text-sm font-bold text-ink-900 mt-0.5">{value}</div></div>);
}

function Orders() {
  const data = [
    ['城西银泰快充站', '07-12 14:22', '32.4 kWh', '¥34.20', '已完成'],
    ['西湖文化广场站', '07-11 09:10', '18.0 kWh', '¥17.64', '已完成'],
    ['滨江星光大道站', '07-09 20:05', '45.1 kWh', '¥40.10', '已完成'],
  ];
  return (
    <div className="px-4 pt-5 pb-4 space-y-3">
      <h2 className="font-bold text-lg text-ink-900">我的订单</h2>
      {data.map(([s, t, k, c, st]) => (
        <div key={t} className="bg-white rounded-card p-4 shadow-sm">
          <div className="flex items-center justify-between">
            <span className="font-medium text-ink-900 text-sm">{s}</span>
            <span className="text-[11px] text-free bg-free/10 px-2 py-0.5 rounded-tag">{st}</span>
          </div>
          <div className="flex items-center justify-between mt-2 text-[12px] text-ink-900/50">
            <span>{t}</span><span>{k}</span><span className="text-ink-900 font-semibold">{c}</span>
          </div>
        </div>
      ))}
      <button className="w-full text-center text-sm text-brand-600 py-2">申请开票 / 查看电子发票 →</button>
    </div>
  );
}

function Profile() {
  const tools = ['我的订单', '发票管理', '钱包充值', '即插即充', '车辆管理', '收藏电站', '客服中心', '意见反馈'];
  return (
    <div className="pb-4">
      <div className="bg-gradient-to-br from-brand-500 to-brand-700 text-white px-5 pt-6 pb-8">
        <div className="flex items-center gap-3">
          <div className="w-14 h-14 rounded-full bg-white/20 grid place-items-center text-2xl">🙂</div>
          <div>
            <div className="font-bold">138****6688</div>
            <div className="text-[12px] text-white/75 mt-0.5 flex items-center gap-1">PLUS会员（银） <span className="bg-white/20 rounded-tag px-1.5">V2</span></div>
          </div>
          <svg className="ml-auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 00-1.7-1L16.5 3h-4l-.3 2.5a7 7 0 00-1.7 1l-2.4-1-2 3.5L5 11a7 7 0 000 2l-2 1.5 2 3.5 2.4-1a7 7 0 001.7 1l.3 2.5h4l.3-2.5a7 7 0 001.7-1l2.4 1 2-3.5-2-1.5a7 7 0 00.1-1z"/></svg>
        </div>
        <div className="mt-5 grid grid-cols-3 gap-2 text-center">
          {[['余额', '¥128.5'], ['卡券', '6 张'], ['碳积分', '342']].map(([l, v]) => (
            <div key={l} className="bg-white/10 rounded-card py-2.5"><div className="font-bold">{v}</div><div className="text-[11px] text-white/70">{l}</div></div>
          ))}
        </div>
      </div>
      <div className="px-4 -mt-5">
        <div className="bg-white rounded-card shadow-sm p-4">
          <div className="text-sm font-medium text-ink-900">我的车辆</div>
          <div className="mt-2 flex items-center gap-3 bg-mist rounded-btn p-3">
            <span className="text-2xl">🚗</span>
            <div className="flex-1"><div className="text-sm font-medium">浙A·D8890</div><div className="text-[11px] text-ink-900/45">比亚迪 汉EV · 电池 85kWh · 健康度 96%</div></div>
            <span className="text-[11px] text-brand-600">主车</span>
          </div>
        </div>
        <div className="mt-3 grid grid-cols-4 gap-2.5">
          {tools.map((t) => (
            <div key={t} className="bg-white rounded-card shadow-sm py-3 text-center"><div className="text-xl">⚙️</div><div className="text-[11px] text-ink-900/65 mt-1">{t}</div></div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TabBar({ tab, setTab }) {
  const tabs = [
    ['home', '首页', 'M3 11l9-8 9 8M5 10v10h14V10'],
    ['coupon', '省钱', 'M20 12l-8-8-8 8M12 4v16'],
    ['scan', '扫码', 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z'],
    ['order', '订单', 'M4 6h16M4 12h16M4 18h10'],
    ['me', '我的', 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 0116 0'],
  ];
  return (
    <div className="absolute bottom-0 inset-x-0 z-40 bg-white/95 nav-blur border-t border-gray-100 tabbar-h flex items-center px-2">
      {tabs.map(([k, label, path]) => {
        if (k === 'scan') {
          return (
            <button key={k} onClick={() => setTab('scan')} className="flex-1 grid place-items-center -mt-6">
              <span className="w-14 h-14 rounded-full bg-gradient-to-br from-brand-500 to-free text-white grid place-items-center shadow-lg">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={path}/><path d="M3 12h18"/></svg>
              </span>
            </button>
          );
        }
        const on = tab === k;
        return (
          <button key={k} onClick={() => setTab(k)} className="flex-1 flex flex-col items-center gap-1 py-2">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={on ? '#1677FF' : '#9AA4B2'} strokeWidth="2"><path d={path}/></svg>
            <span className={'text-[10px] ' + (on ? 'text-brand-500' : 'text-ink-900/45')}>{label}</span>
          </button>
        );
      })}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('home');
  const [charging, setCharging] = useState(false);
  const render = () => {
    if (charging) return <Charging />;
    switch (tab) {
      case 'home': return <Home onScan={() => setTab('scan')} />;
      case 'coupon': return <Coupons />;
      case 'scan': return <Scan onStart={() => setCharging(true)} />;
      case 'order': return <Orders />;
      case 'me': return <Profile />;
      default: return <Home onScan={() => setTab('scan')} />;
    }
  };
  return (
    <div className="relative h-full flex flex-col">
      <div className="flex-1 overflow-y-auto">{render()}</div>
      {!charging && <TabBar tab={tab} setTab={setTab} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
