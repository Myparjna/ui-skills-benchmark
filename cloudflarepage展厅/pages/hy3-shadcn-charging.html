<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>星充 EV · 电动汽车充电</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          border: "hsl(var(--border))", input: "hsl(var(--input))", ring: "hsl(var(--ring))",
          background: "hsl(var(--background))", foreground: "hsl(var(--foreground))",
          primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
          secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
          muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
          accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
          destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
          card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
          idle: { DEFAULT: "hsl(var(--idle))", foreground: "hsl(var(--idle-foreground))" },
          charging: { DEFAULT: "hsl(var(--charging))", foreground: "hsl(var(--charging-foreground))" },
        },
        borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 4px)", sm: "calc(var(--radius) - 6px)" },
        fontFamily: { sans: ["Inter", "Noto Sans SC", "system-ui", "sans-serif"] },
      },
    },
  };
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --background: 210 40% 98%;
    --foreground: 222 30% 12%;
    --card: 0 0% 100%;
    --card-foreground: 222 30% 12%;
    --primary: 217 91% 55%;          /* 科技蓝 #1677FF */
    --primary-foreground: 0 0% 100%;
    --secondary: 210 40% 94%;
    --secondary-foreground: 222 30% 18%;
    --muted: 210 40% 94%;
    --muted-foreground: 215 16% 47%;
    --accent: 210 40% 94%;
    --accent-foreground: 222 30% 18%;
    --destructive: 0 72% 51%;
    --destructive-foreground: 0 0% 100%;
    --idle: 142 71% 45%;             /* 空闲 绿 #52C41A */
    --idle-foreground: 0 0% 100%;
    --charging: 32 95% 54%;          /* 充电中 橙 #FA8C16 */
    --charging-foreground: 0 0% 100%;
    --border: 214 32% 88%;
    --input: 214 32% 88%;
    --ring: 217 91% 55%;
    --radius: 0.75rem;
  }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: "Inter", "Noto Sans SC", system-ui, sans-serif; }
  [data-lucide] { width: 1.25rem; height: 1.25rem; stroke-width: 2; flex-shrink: 0; }
  .icon-xs { width: 1rem !important; height: 1rem !important; }
  .icon-sm { width: 1.1rem !important; height: 1.1rem !important; }
  .icon-lg { width: 1.75rem !important; height: 1.75rem !important; }
  .sheet { transition: transform .28s cubic-bezier(.32,.72,0,1); }
  .sheet-hidden { transform: translateY(100%); }
  .map-grid {
    background-image:
      linear-gradient(rgba(22,119,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(22,119,255,.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }
</style>
</head>
<body class="bg-muted/60">
<div class="mx-auto flex min-h-screen max-w-[430px] flex-col bg-background shadow-xl sm:my-4 sm:min-h-[860px] sm:rounded-[28px] sm:overflow-hidden">

  <!-- 状态栏占位 -->
  <div class="flex items-center justify-between px-5 pt-3 text-xs font-medium text-foreground">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i data-lucide="signal" class="icon-xs"></i><i data-lucide="wifi" class="icon-xs"></i><i data-lucide="battery-full" class="icon-xs"></i></span>
  </div>

  <!-- 顶部栏 -->
  <header class="flex items-center gap-3 px-4 pb-3 pt-2">

    <div class="flex flex-1 items-center gap-2 rounded-full border border-input bg-card px-3 py-2">

  <!-- 地图视图 -->
  <div class="relative mx-4 h-60 overflow-hidden rounded-xl border border-border map-grid bg-gradient-to-br from-sky-50 to-emerald-50">

    <div class="absolute left-0 top-1/3 h-1.5 w-full bg-white/70"></div>
    <div class="absolute left-1/3 top-0 h-full w-1.5 bg-white/70"></div>

    <!-- 充电站标记 -->
    <button onclick="openStation('西溪银泰城充电站','距您 480m','4.8','8','¥1.05','免费停车 2h')" class="absolute left-[22%] top-[28%] flex flex-col items-center">

    </button>
    <button onclick="openStation('文三路公共充电点','距您 1.2km','4.6','3','¥0.98','收费 ¥5/h')" class="absolute left-[58%] top-[20%] flex flex-col items-center">

    </button>
    <button onclick="openStation('西湖文化广场超充站','距您 2.1km','4.9','12','¥1.18','免费停车')" class="absolute left-[72%] top-[55%] flex flex-col items-center">
      <span class="flex h-7 min-w-7 items-center justify-center rounded-full bg-idle px-1.5 text-xs font-bold text-idle-foreground shadow">12</span>
      <span class="mt-0.5 size-3 rounded-full border-2 border-white bg-idle shadow"></span>
    </button>
    <button class="absolute left-[40%] top-[68%] flex flex-col items-center">
      <span class="size-3 rounded-full border-2 border-white bg-charging shadow"></span>

    <!-- 定位按钮 -->

    <!-- 列表切换 -->
    <button class="absolute bottom-3 left-3 flex items-center gap-1 rounded-full border border-border bg-card px-3 py-1.5 text-xs font-medium shadow"><i data-lucide="list" class="icon-xs"></i>列表</button>
  </div>

  <!-- 筛选 chips -->
  <div class="no-scrollbar mt-3 flex gap-2 overflow-x-auto px-4">
    <span class="shrink-0 rounded-full bg-primary px-3 py-1.5 text-xs font-medium text-primary-foreground">全部</span>
    <span class="shrink-0 rounded-full border border-border bg-card px-3 py-1.5 text-xs font-medium text-muted-foreground">快充</span>
    <span class="shrink-0 rounded-full border border-border bg-card px-3 py-1.5 text-xs font-medium text-muted-foreground">超充</span>
    <span class="shrink-0 rounded-full border border-border bg-card px-3 py-1.5 text-xs font-medium text-muted-foreground">免费停车</span>
    <span class="shrink-0 rounded-full border border-border bg-card px-3 py-1.5 text-xs font-medium text-muted-foreground">高速路站</span>
    <span class="shrink-0 rounded-full border border-border bg-card px-3 py-1.5 text-xs font-medium text-muted-foreground">重卡专用</span>

  <!-- 附近站列表 -->
  <div class="mt-3 flex-1 space-y-3 overflow-y-auto px-4 pb-28">
    <p class="text-xs font-medium text-muted-foreground">附近充电站 · 共 23 个</p>

    <button onclick="openStation('西溪银泰城充电站','距您 480m','4.8','8','¥1.05','免费停车 2h')" class="block w-full rounded-xl border border-border bg-card p-4 text-left shadow-sm">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-base font-bold">西溪银泰城充电站</h3>
          <p class="mt-0.5 text-xs text-muted-foreground">文一西路 522 号 · 距您 480m</p>
        </div>
        <span class="flex items-center gap-0.5 text-xs font-semibold text-amber-500"><i data-lucide="star" class="icon-xs fill-amber-400"></i>4.8</span>
      </div>
      <div class="mt-3 flex items-center gap-3 text-sm">
        <span class="inline-flex items-center gap-1 rounded-full bg-idle/10 px-2 py-1 text-xs font-semibold text-idle"><span class="size-1.5 rounded-full bg-idle"></span>空闲 8</span>
        <span class="text-xs text-muted-foreground">快充 6 · 慢充 4</span>
        <span class="ml-auto text-sm font-bold text-primary">¥1.05<span class="text-xs font-normal text-muted-foreground">/度起</span></span>
      </div>
    </button>

    <button onclick="openStation('西湖文化广场超充站','距您 2.1km','4.9','12','¥1.18','免费停车')" class="block w-full rounded-xl border border-border bg-card p-4 text-left shadow-sm">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-base font-bold">西湖文化广场超充站</h3>
          <p class="mt-0.5 text-xs text-muted-foreground">体育场路 218 号 · 距您 2.1km</p>
        </div>
        <span class="flex items-center gap-0.5 text-xs font-semibold text-amber-500"><i data-lucide="star" class="icon-xs fill-amber-400"></i>4.9</span>
      </div>
      <div class="mt-3 flex items-center gap-3 text-sm">
        <span class="inline-flex items-center gap-1 rounded-full bg-idle/10 px-2 py-1 text-xs font-semibold text-idle"><span class="size-1.5 rounded-full bg-idle"></span>空闲 12</span>
        <span class="text-xs text-muted-foreground">超充 8 · 快充 6</span>
        <span class="ml-auto text-sm font-bold text-primary">¥1.18<span class="text-xs font-normal text-muted-foreground">/度起</span></span>
      </div>
    </button>

    <button onclick="openStation('文三路公共充电点','距您 1.2km','4.6','3','¥0.98','收费 ¥5/h')" class="block w-full rounded-xl border border-border bg-card p-4 text-left shadow-sm">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-base font-bold">文三路公共充电点</h3>
          <p class="mt-0.5 text-xs text-muted-foreground">文三路 90 号 · 距您 1.2km</p>
        </div>
        <span class="flex items-center gap-0.5 text-xs font-semibold text-amber-500"><i data-lucide="star" class="icon-xs fill-amber-400"></i>4.6</span>
      </div>
      <div class="mt-3 flex items-center gap-3 text-sm">
        <span class="inline-flex items-center gap-1 rounded-full bg-idle/10 px-2 py-1 text-xs font-semibold text-idle"><span class="size-1.5 rounded-full bg-idle"></span>空闲 3</span>
        <span class="text-xs text-muted-foreground">快充 4 · 慢充 2</span>
        <span class="ml-auto text-sm font-bold text-primary">¥0.98<span class="text-xs font-normal text-muted-foreground">/度起</span></span>
      </div>
    </button>
  </div>

  <!-- 扫码悬浮按钮 -->
  <button onclick="openScan()" class="absolute bottom-24 left-1/2 flex size-16 -translate-x-1/2 items-center justify-center rounded-full bg-gradient-to-br from-primary to-idle text-white shadow-lg ring-4 ring-background">
    <i data-lucide="scan-line" class="icon-lg"></i>
  </button>

  <!-- 底部 TabBar -->
  <nav class="absolute bottom-0 left-0 right-0 flex items-center justify-around border-t border-border bg-card/95 px-2 py-2 backdrop-blur">
    <button class="flex flex-1 flex-col items-center gap-0.5 py-1 text-primary"><i data-lucide="map" class="icon-sm"></i><span class="text-[11px] font-medium">首页</span></button>
    <button class="flex flex-1 flex-col items-center gap-0.5 py-1 text-muted-foreground"><i data-lucide="gift" class="icon-sm"></i><span class="text-[11px] font-medium">省钱</span></button>
    <button onclick="openScan()" class="flex flex-1 flex-col items-center gap-0.5 py-1 text-muted-foreground"><span class="h-7"></span><span class="text-[11px] font-medium">扫码</span></button>
    <button class="flex flex-1 flex-col items-center gap-0.5 py-1 text-muted-foreground"><i data-lucide="receipt" class="icon-sm"></i><span class="text-[11px] font-medium">订单</span></button>
    <button class="flex flex-1 flex-col items-center gap-0.5 py-1 text-muted-foreground"><i data-lucide="user" class="icon-sm"></i><span class="text-[11px] font-medium">我的</span></button>

<!-- 站点详情 Bottom Sheet -->
<div id="stationSheet" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/40" onclick="closeStation()"></div>
  <div class="sheet sheet-hidden absolute bottom-0 left-1/2 w-full max-w-[430px] -translate-x-1/2 rounded-t-2xl border-t border-border bg-card p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-muted"></div>
    <div class="flex items-start justify-between">
      <div>
        <h3 id="stName" class="text-lg font-bold">充电站</h3>
        <p id="stDist" class="mt-0.5 text-xs text-muted-foreground"></p>
      </div>
      <button onclick="closeStation()" class="flex size-8 items-center justify-center rounded-full bg-secondary"><i data-lucide="x" class="icon-sm"></i></button>
    </div>
    <div class="mt-3 flex items-center gap-3">
      <span id="stRate" class="flex items-center gap-0.5 text-sm font-semibold text-amber-500"></span>
      <span id="stIdle" class="inline-flex items-center gap-1 rounded-full bg-idle/10 px-2 py-1 text-xs font-semibold text-idle"></span>
      <span id="stPrice" class="ml-auto text-sm font-bold text-primary"></span>
    </div>
    <!-- 实时枪状态 -->
    <div class="mt-4 rounded-xl border border-border p-3">
      <p class="text-xs font-semibold text-muted-foreground">实时枪状态</p>
      <div class="mt-2 grid grid-cols-4 gap-2">
        <div class="rounded-md bg-idle/10 py-2 text-center text-xs font-semibold text-idle">#1 空闲</div>
        <div class="rounded-md bg-idle/10 py-2 text-center text-xs font-semibold text-idle">#2 空闲</div>
        <div class="rounded-md bg-charging/10 py-2 text-center text-xs font-semibold text-charging">#3 充电中</div>
        <div class="rounded-md bg-destructive/10 py-2 text-center text-xs font-semibold text-destructive">#4 故障</div>
      </div>
    </div>
    <div class="mt-3 flex items-center gap-2 rounded-lg bg-secondary px-3 py-2 text-xs text-secondary-foreground"><i data-lucide="circle-parking" class="icon-sm"></i><span id="stPark"></span></div>
    <div class="mt-4 flex gap-3">
      <button class="flex h-11 flex-1 items-center justify-center gap-2 rounded-lg border border-input bg-background text-sm font-semibold transition-colors hover:bg-accent"><i data-lucide="navigation" class="icon-sm"></i>导航前往</button>
      <button onclick="closeStation();openScan()" class="flex h-11 flex-1 items-center justify-center gap-2 rounded-lg bg-primary text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90"><i data-lucide="zap" class="icon-sm"></i>立即充电</button>
    </div>
  </div>
</div>

<!-- 扫码 / 充电 Sheet -->
<div id="scanSheet" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/40" onclick="closeScan()"></div>
  <div class="sheet sheet-hidden absolute bottom-0 left-1/2 w-full max-w-[430px] -translate-x-1/2 rounded-t-2xl border-t border-border bg-card p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-muted"></div>
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-bold">扫码启动充电</h3>
      <button onclick="closeScan()" class="flex size-8 items-center justify-center rounded-full bg-secondary"><i data-lucide="x" class="icon-sm"></i></button>
    </div>

    <!-- Step 1: 扫码/输号 -->
    <div id="scanStep1" class="mt-4">
      <div class="flex aspect-[4/3] items-center justify-center rounded-xl border-2 border-dashed border-primary/40 bg-primary/5">
        <div class="text-center"><i data-lucide="scan-line" class="icon-xl mx-auto text-primary"></i><p class="mt-2 text-sm font-medium">将二维码放入框内</p><p class="text-xs text-muted-foreground">识别桩号、枪号后自动跳转</p></div>
      </div>
      <div class="mt-4 flex items-center gap-2 rounded-md border border-input bg-background px-3 py-2.5">
        <i data-lucide="hash" class="icon-sm text-muted-foreground"></i>
        <input id="pileNo" placeholder="或手动输入桩编号" class="w-full bg-transparent text-sm outline-none placeholder:text-muted-foreground" />
      </div>
      <button onclick="goCharge()" class="mt-4 flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-primary text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90"><i data-lucide="camera" class="icon-sm"></i>扫描二维码启动</button>
    </div>

    <!-- Step 2: 充电模式 -->
    <div id="scanStep2" class="mt-4 hidden">
      <div class="rounded-xl bg-secondary p-3 text-sm"><span class="text-muted-foreground">充电桩：</span><span id="cPile" class="font-semibold">#A-207 枪 #3</span><span class="ml-2 inline-flex items-center gap-1 rounded-full bg-idle/10 px-2 py-0.5 text-xs font-semibold text-idle">空闲</span></div>
      <p class="mt-4 text-sm font-semibold">选择充电模式</p>
      <div class="mt-2 grid grid-cols-3 gap-2">
        <button onclick="pickMode(this)" class="mode rounded-lg border-2 border-primary bg-primary/5 py-3 text-sm font-semibold text-primary">按金额</button>
        <button onclick="pickMode(this)" class="mode rounded-lg border border-border py-3 text-sm font-medium text-muted-foreground">按电量</button>
        <button onclick="pickMode(this)" class="mode rounded-lg border border-border py-3 text-sm font-medium text-muted-foreground">充满为止</button>
      </div>
      <div id="amountRow" class="mt-3 flex gap-2">
        <button class="amt flex-1 rounded-lg border border-border py-2 text-sm font-medium">¥5</button>
        <button class="amt flex-1 rounded-lg border border-border py-2 text-sm font-medium">¥10</button>
        <button class="amt flex-1 rounded-lg border border-border py-2 text-sm font-medium">¥20</button>
        <button class="amt flex-1 rounded-lg border border-border py-2 text-sm font-medium">自定义</button>
      </div>
      <button onclick="startCharge()" class="mt-4 flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-primary text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90"><i data-lucide="zap" class="icon-sm"></i>确认启动 · 免密支付</button>
    </div>

    <!-- Step 3: 充电中 -->
    <div id="scanStep3" class="mt-4 hidden text-center">
      <div class="relative mx-auto flex size-44 items-center justify-center">
        <svg class="size-44 -rotate-90" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" fill="none" stroke="hsl(214 32% 88%)" stroke-width="8" />
          <circle id="ring" cx="50" cy="50" r="44" fill="none" stroke="hsl(32 95% 54%)" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.4" stroke-dashoffset="276.4" />
        </svg>
        <div class="absolute text-center"><p id="pct" class="text-3xl font-extrabold text-charging">0%</p><p class="text-xs text-muted-foreground">已充 0.0 kWh</p></div>
      </div>
      <div class="mt-4 grid grid-cols-3 gap-2 text-sm">
        <div class="rounded-lg bg-secondary py-2"><p class="text-xs text-muted-foreground">当前功率</p><p class="font-bold" id="kw">60 kW</p></div>
        <div class="rounded-lg bg-secondary py-2"><p class="text-xs text-muted-foreground">已用时长</p><p class="font-bold" id="dur">00:00</p></div>
        <div class="rounded-lg bg-secondary py-2"><p class="text-xs text-muted-foreground">实时费用</p><p class="font-bold text-primary" id="cost">¥0.0</p></div>
      </div>
      <p class="mt-3 text-xs text-muted-foreground">预计完成时间 14:38</p>
      <button onclick="stopCharge()" class="mt-3 flex h-11 w-full items-center justify-center gap-2 rounded-lg border border-destructive bg-destructive/5 text-sm font-semibold text-destructive transition-colors hover:bg-destructive/10"><i data-lucide="power" class="icon-sm"></i>停止充电</button>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();
  const $ = (s) => document.querySelector(s);

  function openStation(name, dist, rate, idle, price, park) {
    $('#stName').textContent = name;
    $('#stDist').textContent = dist;
    $('#stRate').innerHTML = '<i data-lucide="star" class="icon-xs fill-amber-400"></i>' + rate;
    $('#stIdle').innerHTML = '<span class="size-1.5 rounded-full bg-idle"></span>空闲 ' + idle;
    $('#stPrice').textContent = price + ' 起';
    $('#stPark').textContent = park;
    const sheet = $('#stationSheet').querySelector('.sheet');
    $('#stationSheet').classList.remove('hidden');
    requestAnimationFrame(() => sheet.classList.remove('sheet-hidden'));
    lucide.createIcons();
  }
  function closeStation() {
    const sheet = $('#stationSheet').querySelector('.sheet');
    sheet.classList.add('sheet-hidden');
    setTimeout(() => $('#stationSheet').classList.add('hidden'), 300);
  }

  function openScan() {
    $('#scanStep1').classList.remove('hidden');
    $('#scanStep2').classList.add('hidden');
    $('#scanStep3').classList.add('hidden');
    const sheet = $('#scanSheet').querySelector('.sheet');
    $('#scanSheet').classList.remove('hidden');
    requestAnimationFrame(() => sheet.classList.remove('sheet-hidden'));
  }
  function closeScan() {
    const sheet = $('#scanSheet').querySelector('.sheet');
    sheet.classList.add('sheet-hidden');
    clearInterval(window._chg);
    setTimeout(() => $('#scanSheet').classList.add('hidden'), 300);
  }
  function goCharge() {
    $('#cPile').textContent = '#A-207 枪 #3';
    $('#scanStep1').classList.add('hidden');
    $('#scanStep2').classList.remove('hidden');
  }
  function pickMode(el) {
    document.querySelectorAll('.mode').forEach(m => { m.className = 'mode rounded-lg border border-border py-3 text-sm font-medium text-muted-foreground'; });
    el.className = 'mode rounded-lg border-2 border-primary bg-primary/5 py-3 text-sm font-semibold text-primary';
    $('#amountRow').style.display = el.textContent === '充满为止' ? 'none' : 'flex';
  }
  function startCharge() {
    $('#scanStep2').classList.add('hidden');
    $('#scanStep3').classList.remove('hidden');
    let p = 0; const ring = $('#ring'); const C = 276.4;
    window._chg = setInterval(() => {
      p = Math.min(p + 1.4, 100);
      ring.style.strokeDashoffset = C - (C * p / 100);
      $('#pct').textContent = Math.floor(p) + '%';
      $('#pct').parentElement.querySelector('p:last-child').textContent = '已充 ' + (p * 0.42).toFixed(1) + ' kWh';
      const m = Math.floor(p / 1.4 * 0.3);
      $('#dur').textContent = String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
      $('#cost').textContent = '¥' + (p * 0.42 * 1.05).toFixed(1);
      if (p >= 100) clearInterval(window._chg);
    }, 120);
  }
  function stopCharge() {
    clearInterval(window._chg);
    closeScan();
  }
</script>
</body>
</html>
