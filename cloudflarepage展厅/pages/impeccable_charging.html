<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>极光充电 | AuroraCharge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --ink: #0a0a0b;
      --stone: #f5f5f4;
      --warm-gray: #e7e5e4;
      --accent: #059669;
      --text-primary: #1c1917;
      --text-secondary: #57534e;
      --text-tertiary: #a8a29e;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--stone);
      color: var(--text-primary);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .micro-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 24px); }
  </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-white sticky top-0 z-10">
    <div class="flex items-center justify-between px-5 h-14">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-[var(--accent)] text-white rounded-md flex items-center justify-center">
          <i data-lucide="zap" class="w-4 h-4"></i>
        </div>
        <span class="text-sm font-semibold tracking-tight">AuroraCharge</span>
      </div>
      <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[var(--stone)] transition">
        <i data-lucide="bell" class="w-4 h-4 text-[var(--text-secondary)]"></i>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 px-5 pt-5 pb-24">
    <!-- Status Card -->
    <div class="bg-[var(--ink)] text-white rounded-2xl p-5 mb-5">
      <div class="flex items-center justify-between mb-4">
        <div class="micro-label text-white/50">当前状态</div>
        <div class="flex items-center gap-1.5 px-2 py-1 bg-white/10 rounded text-[10px] font-medium">
          <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
          充电中
        </div>
      </div>
      <div class="flex items-end justify-between">
        <div>
          <div class="text-4xl font-semibold tracking-tight">78<span class="text-lg text-white/60 font-normal">%</span></div>
          <div class="text-xs text-white/50 mt-1">预计 18 分钟后充满</div>
        </div>
        <div class="text-right">
          <div class="text-sm font-medium">¥ 24.60</div>
          <div class="text-[10px] text-white/50">当前费用</div>
        </div>
      </div>
      <div class="mt-5 pt-4 border-t border-white/10 grid grid-cols-3 gap-4">
        <div>
          <div class="text-xs text-white/50">功率</div>
          <div class="text-sm font-medium mt-0.5">85 kW</div>
        </div>
        <div>
          <div class="text-xs text-white/50">电压</div>
          <div class="text-sm font-medium mt-0.5">380 V</div>
        </div>
        <div>
          <div class="text-xs text-white/50">电流</div>
          <div class="text-sm font-medium mt-0.5">124 A</div>
        </div>
      </div>
    </div>

    <!-- Context Info -->
    <div class="bg-white rounded-xl p-4 mb-5">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 bg-[var(--stone)] rounded-lg flex items-center justify-center shrink-0">
          <i data-lucide="map-pin" class="w-4 h-4 text-[var(--accent)]"></i>
        </div>
        <div>
          <div class="text-sm font-medium">杭州滨江银泰超充站</div>
          <div class="text-xs text-[var(--text-tertiary)] mt-0.5">A-07 桩 · 直流快充</div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="mb-6">
      <div class="micro-label mb-3">快捷操作</div>
      <div class="grid grid-cols-4 gap-3">
        <button class="flex flex-col items-center gap-2 p-3 bg-white rounded-xl hover:bg-[var(--warm-gray)] transition">
          <i data-lucide="power" class="w-5 h-5 text-[var(--text-secondary)]"></i>
          <span class="text-[10px] text-[var(--text-secondary)]">停止</span>
        </button>
        <button class="flex flex-col items-center gap-2 p-3 bg-white rounded-xl hover:bg-[var(--warm-gray)] transition">
          <i data-lucide="clock" class="w-5 h-5 text-[var(--text-secondary)]"></i>
          <span class="text-[10px] text-[var(--text-secondary)]">预约</span>
        </button>
        <button class="flex flex-col items-center gap-2 p-3 bg-white rounded-xl hover:bg-[var(--warm-gray)] transition">
          <i data-lucide="receipt" class="w-5 h-5 text-[var(--text-secondary)]"></i>
          <span class="text-[10px] text-[var(--text-secondary)]">发票</span>
        </button>
        <button class="flex flex-col items-center gap-2 p-3 bg-white rounded-xl hover:bg-[var(--warm-gray)] transition">
          <i data-lucide="headphones" class="w-5 h-5 text-[var(--text-secondary)]"></i>
          <span class="text-[10px] text-[var(--text-secondary)]">客服</span>
        </button>
      </div>
    </div>

    <!-- Nearby -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <div class="micro-label">附近站点</div>
        <button class="text-[10px] font-medium text-[var(--accent)]">查看地图</button>
      </div>
      <div class="space-y-3">
        <div class="bg-white p-4 rounded-xl flex items-center justify-between">
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 bg-emerald-50 rounded-lg flex items-center justify-center shrink-0">
              <i data-lucide="zap" class="w-4 h-4 text-[var(--accent)]"></i>
            </div>
            <div>
              <div class="text-sm font-medium">星光大道充电站</div>
              <div class="text-[10px] text-[var(--text-tertiary)] mt-0.5">空闲 6/12 · 距离 1.2km</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs font-medium">¥1.15</div>
            <div class="text-[10px] text-[var(--text-tertiary)]">/度</div>
          </div>
        </div>
        <div class="bg-white p-4 rounded-xl flex items-center justify-between">
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 bg-emerald-50 rounded-lg flex items-center justify-center shrink-0">
              <i data-lucide="zap" class="w-4 h-4 text-[var(--accent)]"></i>
            </div>
            <div>
              <div class="text-sm font-medium">天街地下停车场</div>
              <div class="text-[10px] text-[var(--text-tertiary)] mt-0.5">空闲 2/8 · 距离 2.4km</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs font-medium">¥0.98</div>
            <div class="text-[10px] text-[var(--text-tertiary)]">/度</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-[var(--warm-gray)] safe-bottom z-10" style="max-width:430px;margin:0 auto;">
    <div class="flex items-center justify-around h-[60px]">
      <button class="flex flex-col items-center gap-1 text-[var(--accent)]">
        <i data-lucide="zap" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">充电</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-[var(--text-tertiary)]">
        <i data-lucide="map" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">地图</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-[var(--text-tertiary)]">
        <i data-lucide="file-text" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">订单</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-[var(--text-tertiary)]">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">我的</span>
      </button>
    </div>
  </nav>

  <script>lucide.createIcons();</script>
</body>
</html>
