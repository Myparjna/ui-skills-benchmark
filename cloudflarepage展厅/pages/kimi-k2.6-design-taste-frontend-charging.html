<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪充聚合 — 电动汽车充电小程序</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Outfit', 'PingFang SC', 'system-ui', 'sans-serif'],
        mono: ['JetBrains Mono', 'monospace'],
      },
      colors: {
        tech: {
          50: '#eff6ff',
          100: '#dbeafe',
          200: '#bfdbfe',
          300: '#93c5fd',
          400: '#60a5fa',
          500: '#3b82f6',
          600: '#2563eb',
          700: '#1d4ed8',
          800: '#1e40af',
          900: '#1e3a8a',
          950: '#172554',
        },
        success: '#10b981',
        warning: '#f59e0b',
        danger: '#ef4444',
      }
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Outfit', 'PingFang SC', system-ui, sans-serif;
    background: #e5e5e7;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px;
    margin: 0;
  }

  /* Phone frame */
  .phone-frame {
    width: 100%;
    max-width: 414px;
    height: 852px;
    background: #ffffff;
    border-radius: 48px;
    box-shadow: 0 25px 80px -12px rgba(0,0,0,0.25), 0 0 0 12px #1c1c1e;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 34px;
    background: #1c1c1e;
    border-radius: 0 0 20px 20px;
    z-index: 50;
  }

  /* Scrollable content area */
  .content-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
    position: relative;
  }
  .content-scroll::-webkit-scrollbar { display: none; }

  /* Liquid Glass for top bar */
  .liquid-glass-mini {
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-bottom: 1px solid rgba(0,0,0,0.04);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 8px rgba(0,0,0,0.04);
  }

  /* Map canvas simulation */
  .map-zone {
    position: relative;
    height: 320px;
    background: #f1f5f9;
    overflow: hidden;
  }
  .map-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(203,213,225,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(203,213,225,0.4) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .map-road {
    position: absolute;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .map-poi {
    position: absolute;
    border-radius: 50%;
    transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  }
  .map-poi:hover { transform: scale(1.15); }
  .poi-pulse {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid currentColor;
    opacity: 0;
    animation: poiPulse 2.5s ease-out infinite;
  }
  @keyframes poiPulse {
    0% { transform: scale(0.8); opacity: 0.6; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* Station cards */
  .station-card {
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.04);
    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s;
  }
  .station-card:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  /* Status dots */
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    position: relative;
  }
  .status-dot::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0.4;
    animation: dotBreath 2s ease-in-out infinite;
  }
  @keyframes dotBreath {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.3); opacity: 0.1; }
  }

  /* Tab Bar */
  .tab-bar {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.05);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
  }
  .tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 0;
    color: #9ca3af;
    transition: color 0.2s;
    font-size: 10px;
  }
  .tab-btn.active { color: #2563eb; }
  .scan-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb 0%, #059669 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 6px 20px rgba(37,99,235,0.35);
    margin-top: -24px;
    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s;
    position: relative;
    overflow: hidden;
  }
  .scan-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    animation: scanRing 2.5s ease-out infinite;
  }
  @keyframes scanRing {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .scan-btn:active { transform: scale(0.92); }

  /* Price tag */
  .price-tag {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
  }

  /* Bottom sheet handle */
  .sheet-handle {
    width: 36px;
    height: 4px;
    background: #d1d5db;
    border-radius: 2px;
    margin: 8px auto 12px;
  }

  /* Shimmer loading for map */
  @keyframes mapShimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* Quick action pills */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    color: #475569;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .pill:active { transform: scale(0.96); background: #f1f5f9; }
  .pill-primary {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #2563eb;
  }

  /* Member banner */
  .member-banner {
    background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
    position: relative;
    overflow: hidden;
  }
  .member-banner::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* Reduced motion support */
  @media (prefers-reduced-motion: reduce) {
    .poi-pulse, .status-dot::after, .scan-btn::before, .map-poi { animation: none; }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>

  <!-- Status Bar -->
  <div class="liquid-glass-mini pt-3 pb-2 px-6 flex items-center justify-between z-40 relative">
    <span class="text-xs font-semibold text-zinc-900">9:41</span>
    <div class="flex items-center gap-1.5">
      <i data-lucide="signal" class="w-3.5 h-3.5 text-zinc-900"></i>
      <i data-lucide="wifi" class="w-3.5 h-3.5 text-zinc-900"></i>
      <div class="w-6 h-3 rounded-sm border border-zinc-900 relative">
        <div class="absolute inset-0.5 bg-zinc-900 rounded-sm" style="width: 75%;"></div>
      </div>
    </div>
  </div>

  <!-- Scrollable Content -->
  <div class="content-scroll">
    <!-- Header -->
    <div class="px-4 pt-3 pb-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="map-pin" class="w-4 h-4 text-tech-600"></i>
        <span class="text-sm font-medium text-zinc-800">杭州市 · 萧山区</span>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400"></i>
      </div>
      <div class="flex items-center gap-3">
        <button class="w-8 h-8 rounded-full bg-zinc-50 flex items-center justify-center">
          <i data-lucide="bell" class="w-4 h-4 text-zinc-600"></i>
        </button>
        <button class="w-8 h-8 rounded-full bg-zinc-50 flex items-center justify-center">
          <i data-lucide="message-circle" class="w-4 h-4 text-zinc-600"></i>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="px-4 mb-3">
      <div class="flex items-center gap-2 bg-zinc-50 rounded-xl px-3 py-2.5 border border-zinc-100">
        <i data-lucide="search" class="w-4 h-4 text-zinc-400 shrink-0"></i>
        <input type="text" placeholder="搜索充电站、地点或桩号" class="bg-transparent text-sm text-zinc-800 placeholder-zinc-400 outline-none w-full">
        <button class="shrink-0 p-1">
          <i data-lucide="sliders-horizontal" class="w-4 h-4 text-zinc-500"></i>
        </button>
      </div>
    </div>

    <!-- Quick Filters -->
    <div class="px-4 mb-3">
      <div class="flex gap-2 overflow-x-auto pb-1" style="scrollbar-width: none;">
        <button class="pill pill-primary">
          <i data-lucide="zap" class="w-3 h-3"></i>
          快充
        </button>
        <button class="pill">
          <i data-lucide="car" class="w-3 h-3"></i>
          免费停车
        </button>
        <button class="pill">
          <i data-lucide="award" class="w-3 h-3"></i>
          PLUS站
        </button>
        <button class="pill">
          <i data-lucide="navigation" class="w-3 h-3"></i>
          高速路站
        </button>
        <button class="pill">
          <i data-lucide="battery-charging" class="w-3 h-3"></i>
          超充
        </button>
      </div>
    </div>

    <!-- Map Area -->
    <div class="map-zone mx-4 rounded-2xl mb-3">
      <div class="map-grid"></div>
      <!-- Roads -->
      <div class="map-road" style="top: 20%; left: 0; width: 100%; height: 10px; transform: rotate(-5deg);"></div>
      <div class="map-road" style="top: 0; left: 35%; width: 12px; height: 100%; transform: rotate(3deg);"></div>
      <div class="map-road" style="top: 60%; left: 0; width: 100%; height: 8px; transform: rotate(2deg);"></div>
      <div class="map-road" style="top: 0; left: 70%; width: 10px; height: 100%; transform: rotate(-2deg);"></div>

      <!-- Water area -->
      <div class="absolute bottom-0 right-0 w-1/3 h-1/3 rounded-tl-full" style="background: rgba(191,219,254,0.3);"></div>

      <!-- POIs -->
      <div class="map-poi" style="top: 28%; left: 30%; color: #10b981;">
        <div class="poi-pulse" style="color: #10b981;"></div>
        <div class="w-8 h-8 rounded-full bg-white shadow-md flex items-center justify-center">
          <i data-lucide="zap" class="w-4 h-4 text-emerald-500"></i>
        </div>
      </div>
      <div class="map-poi" style="top: 45%; left: 55%; color: #10b981;">
        <div class="poi-pulse" style="color: #10b981;"></div>
        <div class="w-8 h-8 rounded-full bg-white shadow-md flex items-center justify-center">
          <i data-lucide="zap" class="w-4 h-4 text-emerald-500"></i>
        </div>
      </div>
      <div class="map-poi" style="top: 35%; left: 68%; color: #f59e0b;">
        <div class="w-8 h-8 rounded-full bg-white shadow-md flex items-center justify-center">
          <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i>
        </div>
      </div>
      <div class="map-poi" style="top: 65%; left: 40%; color: #10b981;">
        <div class="poi-pulse" style="color: #10b981;"></div>
        <div class="w-8 h-8 rounded-full bg-white shadow-md flex items-center justify-center">
          <i data-lucide="zap" class="w-4 h-4 text-emerald-500"></i>
        </div>
      </div>
      <div class="map-poi" style="top: 55%; left: 22%; color: #ef4444;">
        <div class="w-8 h-8 rounded-full bg-white shadow-md flex items-center justify-center">
          <i data-lucide="zap" class="w-4 h-4 text-red-500"></i>
        </div>
      </div>

      <!-- Current location -->
      <div class="absolute top-[50%] left-[45%] transform -translate-x-1/2 -translate-y-1/2">
        <div class="w-4 h-4 rounded-full bg-tech-600 border-2 border-white shadow-lg"></div>
        <div class="absolute inset-0 rounded-full bg-tech-600 opacity-30 animate-ping"></div>
      </div>

      <!-- Map controls -->
      <div class="absolute right-3 top-3 flex flex-col gap-2">
        <button class="w-9 h-9 rounded-xl bg-white shadow-md flex items-center justify-center active:scale-95 transition-transform">
          <i data-lucide="navigation" class="w-4 h-4 text-tech-600"></i>
        </button>
        <button class="w-9 h-9 rounded-xl bg-white shadow-md flex items-center justify-center active:scale-95 transition-transform">
          <i data-lucide="plus" class="w-4 h-4 text-zinc-600"></i>
        </button>
        <button class="w-9 h-9 rounded-xl bg-white shadow-md flex items-center justify-center active:scale-95 transition-transform">
          <i data-lucide="minus" class="w-4 h-4 text-zinc-600"></i>
        </button>
      </div>

      <!-- List toggle -->
      <div class="absolute left-3 bottom-3">
        <button class="px-3 py-2 rounded-xl bg-white shadow-md text-xs font-medium text-zinc-700 flex items-center gap-1.5 active:scale-95 transition-transform">
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
          列表
        </button>
      </div>
    </div>

    <!-- Member Banner -->
    <div class="px-4 mb-3">
      <div class="member-banner rounded-2xl px-4 py-4 text-white flex items-center justify-between">
        <div>
          <div class="text-xs text-blue-200 mb-0.5">闪充 PLUS 会员</div>
          <div class="text-sm font-semibold">充电6折起 · 每月5张满减券</div>
        </div>
        <button class="shrink-0 px-3 py-1.5 rounded-lg bg-white/15 text-xs font-medium border border-white/20 active:bg-white/25 transition-colors">
          立即开通
        </button>
      </div>
    </div>

    <!-- Nearby Stations Sheet -->
    <div class="bg-white rounded-t-3xl shadow-[0_-4px_24px_rgba(0,0,0,0.06)] px-4 pt-1 pb-4">
      <div class="sheet-handle"></div>
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-zinc-900">附近充电站</h3>
        <div class="flex items-center gap-2 text-xs text-zinc-500">
          <span>距您</span>
          <select class="bg-transparent text-tech-600 font-medium outline-none">
            <option>3km内</option>
            <option>5km内</option>
            <option>10km内</option>
          </select>
        </div>
      </div>

      <!-- Station 1 -->
      <div class="station-card p-4 mb-3">
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center shrink-0">
              <i data-lucide="zap" class="w-6 h-6 text-emerald-600"></i>
            </div>
            <div>
              <h4 class="text-sm font-bold text-zinc-900 leading-tight">萧山万象汇超充站</h4>
              <p class="text-xs text-zinc-500 mt-1">萧山区市心中路258号</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="inline-flex items-center gap-1 text-xs text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">
                  <span class="status-dot bg-emerald-500"></span>
                  空闲6/8
                </span>
                <span class="text-xs text-zinc-400">0.8km</span>
              </div>
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="price-tag text-lg font-bold text-tech-600">¥0.68</div>
            <div class="text-[10px] text-zinc-400">/度</div>
          </div>
        </div>
        <div class="flex items-center gap-2 pt-3 border-t border-zinc-50">
          <span class="pill text-[10px] py-0.5 px-2">免费停车2h</span>
          <span class="pill text-[10px] py-0.5 px-2">120kW快充</span>
          <span class="pill text-[10px] py-0.5 px-2">PLUS专享价</span>
        </div>
      </div>

      <!-- Station 2 -->
      <div class="station-card p-4 mb-3">
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-xl bg-amber-50 flex items-center justify-center shrink-0">
              <i data-lucide="zap" class="w-6 h-6 text-amber-600"></i>
            </div>
            <div>
              <h4 class="text-sm font-bold text-zinc-900 leading-tight">杭州东站P3停车场充电站</h4>
              <p class="text-xs text-zinc-500 mt-1">上城区全福桥路2号</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="inline-flex items-center gap-1 text-xs text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">
                  <span class="status-dot bg-amber-500"></span>
                  空闲2/12
                </span>
                <span class="text-xs text-zinc-400">2.3km</span>
              </div>
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="price-tag text-lg font-bold text-tech-600">¥0.85</div>
            <div class="text-[10px] text-zinc-400">/度</div>
          </div>
        </div>
        <div class="flex items-center gap-2 pt-3 border-t border-zinc-50">
          <span class="pill text-[10px] py-0.5 px-2">24小时营业</span>
          <span class="pill text-[10px] py-0.5 px-2">60kW快充</span>
        </div>
      </div>

      <!-- Station 3 -->
      <div class="station-card p-4 mb-3">
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center shrink-0">
              <i data-lucide="zap" class="w-6 h-6 text-emerald-600"></i>
            </div>
            <div>
              <h4 class="text-sm font-bold text-zinc-900 leading-tight">星光大道二期充电站</h4>
              <p class="text-xs text-zinc-500 mt-1">滨江区江南大道228号</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="inline-flex items-center gap-1 text-xs text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">
                  <span class="status-dot bg-emerald-500"></span>
                  空闲10/16
                </span>
                <span class="text-xs text-zinc-400">3.5km</span>
              </div>
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="price-tag text-lg font-bold text-tech-600">¥0.59</div>
            <div class="text-[10px] text-zinc-400">/度</div>
          </div>
        </div>
        <div class="flex items-center gap-2 pt-3 border-t border-zinc-50">
          <span class="pill text-[10px] py-0.5 px-2">谷电优惠</span>
          <span class="pill text-[10px] py-0.5 px-2">180kW超充</span>
          <span class="pill text-[10px] py-0.5 px-2">餐饮便利</span>
        </div>
      </div>

      <!-- Station 4 (faulty) -->
      <div class="station-card p-4 mb-3 opacity-70">
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center shrink-0">
              <i data-lucide="zap-off" class="w-6 h-6 text-red-500"></i>
            </div>
            <div>
              <h4 class="text-sm font-bold text-zinc-900 leading-tight">西兴地铁站充电站</h4>
              <p class="text-xs text-zinc-500 mt-1">滨江区西兴路</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="inline-flex items-center gap-1 text-xs text-red-600 bg-red-50 px-1.5 py-0.5 rounded">
                  <span class="status-dot bg-red-500"></span>
                  维护中
                </span>
                <span class="text-xs text-zinc-400">4.1km</span>
              </div>
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="price-tag text-lg font-bold text-zinc-400">--</div>
            <div class="text-[10px] text-zinc-400">/度</div>
          </div>
        </div>
      </div>

      <!-- Load more -->
      <button class="w-full py-3 text-xs text-zinc-500 text-center active:bg-zinc-50 rounded-xl transition-colors">
        查看更多充电站
      </button>
    </div>

    <!-- Spacer for tab bar -->
    <div class="h-20"></div>
  </div>
