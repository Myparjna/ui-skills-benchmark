<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Charging Mini-Program</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .phone-frame {
      box-shadow: 0 0 0 1px #27272a, 0 24px 80px rgba(0,0,0,.55);
    }
    .glow-ring {
      box-shadow: 0 0 0 6px rgba(94,106,210,.12), 0 0 40px rgba(94,106,210,.25);
    }
    .scan-btn {
      box-shadow: 0 0 0 4px #0a0a0c, 0 6px 24px rgba(94,106,210,.45);
    }
  </style>
</head>
<body class="bg-[#0a0a0c] text-[#fafafa]">
  <div class="flex min-h-screen items-center justify-center px-4 py-10">
    <!-- Phone Frame -->
    <div class="phone-frame relative w-[375px] overflow-hidden rounded-[40px] bg-[#0e0e10]">
      <!-- Notch -->
      <div class="absolute left-1/2 top-0 z-20 h-6 w-28 -translate-x-1/2 rounded-b-2xl bg-[#0e0e10]"></div>

      <!-- Status Bar -->
      <div class="relative z-10 flex items-center justify-between px-6 pt-3 pb-2 text-[12px]">
        <span class="font-medium">9:41</span>
        <div class="flex items-center gap-1.5">
          <i data-lucide="signal" class="h-3.5 w-3.5"></i>
          <i data-lucide="wifi" class="h-3.5 w-3.5"></i>
          <i data-lucide="battery-full" class="h-3.5 w-3.5"></i>
        </div>
      </div>

      <!-- Content -->
      <div class="h-[720px] overflow-y-auto px-5 pb-24">
        <!-- Header -->
        <div class="mt-2 flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <i data-lucide="map-pin" class="h-4 w-4 text-[#5e6ad2]"></i>
            <span class="text-[14px] font-medium">深圳市南山区科技园</span>
            <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-[#a1a1aa]"></i>
          </div>
          <div class="flex h-8 w-8 items-center justify-center rounded-full border border-[#27272a] bg-[#151518]">
            <i data-lucide="bell" class="h-3.5 w-3.5"></i>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="mt-6 grid grid-cols-4 gap-3">
          <div class="flex flex-col items-center gap-2">
            <div class="flex h-12 w-12 items-center justify-center rounded-xl border border-[#27272a] bg-[#151518]">
              <i data-lucide="zap" class="h-5 w-5 text-[#5e6ad2]"></i>
            </div>
            <span class="text-[11px] text-[#a1a1aa]">扫码充电</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <div class="flex h-12 w-12 items-center justify-center rounded-xl border border-[#27272a] bg-[#151518]">
              <i data-lucide="navigation" class="h-5 w-5 text-[#5e6ad2]"></i>
            </div>
            <span class="text-[11px] text-[#a1a1aa]">附近电站</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <div class="flex h-12 w-12 items-center justify-center rounded-xl border border-[#27272a] bg-[#151518]">
              <i data-lucide="wallet" class="h-5 w-5 text-[#5e6ad2]"></i>
            </div>
            <span class="text-[11px] text-[#a1a1aa]">我的钱包</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <div class="flex h-12 w-12 items-center justify-center rounded-xl border border-[#27272a] bg-[#151518]">
              <i data-lucide="file-text" class="h-5 w-5 text-[#5e6ad2]"></i>
            </div>
            <span class="text-[11px] text-[#a1a1aa]">充电订单</span>
          </div>
        </div>

        <!-- Active Charging -->
        <div class="mt-6 rounded-2xl border border-[#27272a] bg-[#151518] p-5">
          <div class="flex items-center justify-between">
            <div class="text-[13px] font-medium">正在充电</div>
            <span class="rounded-full bg-[#22c55e]/10 px-2 py-0.5 text-[11px] text-[#22c55e]">进行中</span>
          </div>
          <div class="mt-5 flex items-center justify-between">
            <div>
              <div class="text-[28px] font-medium tracking-tight">28.6</div>
              <div class="text-[11px] text-[#a1a1aa]">kWh</div>
            </div>
            <div class="relative flex h-20 w-20 items-center justify-center">
              <svg class="absolute inset-0 h-full w-full -rotate-90" viewBox="0 0 36 36">
                <path class="text-[#27272a]" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"></path>
                <path class="text-[#5e6ad2]" stroke-dasharray="65, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
              </svg>
              <div class="glow-ring absolute inset-0 m-auto h-16 w-16 rounded-full border border-[#5e6ad2]/30"></div>
              <i data-lucide="zap" class="relative h-5 w-5 text-[#5e6ad2]"></i>
            </div>
            <div class="text-right">
              <div class="text-[28px] font-medium tracking-tight">¥ 42.3</div>
              <div class="text-[11px] text-[#a1a1aa]">预估费用</div>
            </div>
          </div>
          <div class="mt-5 grid grid-cols-3 gap-2 border-t border-[#27272a] pt-4 text-center">
            <div>
              <div class="text-[13px] font-medium">42 分</div>
              <div class="text-[10px] text-[#a1a1aa]">已充时长</div>
            </div>
            <div>
              <div class="text-[13px] font-medium">68%</div>
              <div class="text-[10px] text-[#a1a1aa]">当前电量</div>
            </div>
            <div>
              <div class="text-[13px] font-medium">86 kW</div>
              <div class="text-[10px] text-[#a1a1aa]">充电功率</div>
            </div>
          </div>
        </div>

        <!-- PLUS Member -->
        <div class="mt-4 rounded-2xl border border-[#27272a] bg-gradient-to-br from-[#151518] to-[#18181b] p-4">
          <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-[#5e6ad2]/60 to-transparent"></div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="flex h-9 w-9 items-center justify-center rounded-full bg-[#5e6ad2]/10">
                <i data-lucide="crown" class="h-4 w-4 text-[#5e6ad2]"></i>
              </div>
              <div>
                <div class="text-[13px] font-medium">PLUS 会员</div>
                <div class="text-[11px] text-[#a1a1aa]">每月立省 30% 服务费</div>
              </div>
            </div>
            <span class="rounded-full bg-[#5e6ad2] px-3 py-1 text-[11px] font-medium text-white">立即开通</span>
          </div>
        </div>

        <!-- Nearby Stations -->
        <div class="mt-6">
          <div class="flex items-center justify-between">
            <div class="text-[13px] font-medium">附近电站</div>
            <div class="flex items-center gap-1 text-[11px] text-[#a1a1aa]">
              <span>查看更多</span>
              <i data-lucide="chevron-right" class="h-3 w-3"></i>
            </div>
          </div>
          <div class="mt-3 divide-y divide-[#27272a] rounded-xl border border-[#27272a] bg-[#151518] overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-[13px] font-medium">科兴科学园充电站</span>
                  <span class="h-1.5 w-1.5 rounded-full bg-[#22c55e]"></span>
                </div>
                <div class="mt-0.5 text-[11px] text-[#a1a1aa]">空闲 12 / 总 20 · 0.8km</div>
              </div>
              <div class="text-right">
                <div class="text-[13px] font-medium">¥ 1.08</div>
                <div class="text-[10px] text-[#a1a1aa]">/度</div>
              </div>
            </div>
            <div class="flex items-center justify-between px-4 py-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-[13px] font-medium">腾讯大厦超充站</span>
                  <span class="h-1.5 w-1.5 rounded-full bg-[#f59e0b]"></span>
                </div>
                <div class="mt-0.5 text-[11px] text-[#a1a1aa]">空闲 3 / 总 16 · 1.2km</div>
              </div>
              <div class="text-right">
                <div class="text-[13px] font-medium">¥ 1.25</div>
                <div class="text-[10px] text-[#a1a1aa]">/度</div>
              </div>
            </div>
            <div class="flex items-center justify-between px-4 py-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-[13px] font-medium">万象天地充电站</span>
                  <span class="h-1.5 w-1.5 rounded-full bg-[#22c55e]"></span>
                </div>
                <div class="mt-0.5 text-[11px] text-[#a1a1aa]">空闲 8 / 总 24 · 1.5km</div>
              </div>
              <div class="text-right">
                <div class="text-[13px] font-medium">¥ 0.98</div>
                <div class="text-[10px] text-[#a1a1aa]">/度</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Tab Bar -->
      <div class="absolute bottom-0 left-0 right-0 z-20 border-t border-[#27272a] bg-[#0e0e10]/95 px-6 pb-6 pt-2 backdrop-blur">
        <div class="flex items-center justify-between">
          <div class="flex flex-col items-center gap-1">
            <i data-lucide="home" class="h-5 w-5 text-[#5e6ad2]"></i>
            <span class="text-[10px] text-[#fafafa]">首页</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <i data-lucide="map" class="h-5 w-5 text-[#a1a1aa]"></i>
            <span class="text-[10px] text-[#a1a1aa]">地图</span>
          </div>
          <div class="relative -top-5">
            <div class="scan-btn flex h-14 w-14 items-center justify-center rounded-full bg-[#5e6ad2]">
              <i data-lucide="scan-line" class="h-6 w-6 text-white"></i>
            </div>
          </div>
          <div class="flex flex-col items-center gap-1">
            <i data-lucide="message-circle" class="h-5 w-5 text-[#a1a1aa]"></i>
            <span class="text-[10px] text-[#a1a1aa]">消息</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <i data-lucide="user" class="h-5 w-5 text-[#a1a1aa]"></i>
            <span class="text-[10px] text-[#a1a1aa]">我的</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
